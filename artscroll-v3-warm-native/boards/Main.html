<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&amp;display=swap">
<style>body{margin:0}</style>
<script src="../js/covers.js"></script>
<script src="../js/dc-shim.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div class="ipad land t-light">
<div class="split">
<nav class="sidebar" aria-label="ArtScroll">
<p class="sb-title">ArtScroll</p>
<ul class="sb-list">
<li><a class="sb-item" href="Main.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z"></path><path d="M12 6.5v13"></path></svg>Learn</a></li>
<li><a class="sb-item" href="Library.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="4.5" height="16" rx="1"></rect><rect x="9.5" y="4" width="4.5" height="16" rx="1"></rect><path d="m15.6 6.1 3.3-.9 2.9 13.6-3.3.9z"></path></svg>Library</a></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.5h11a2 2 0 0 1 2 2V20h-11a2 2 0 0 1-2-2z"></path><path d="M5.5 18a2 2 0 0 1 2-2h11"></path></svg>Siddur</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13v5.5a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5H11"></path><path d="m17.5 3.5 3 3L12 15l-4 1 1-4z"></path></svg>My notes</button></li>
<li>
<button type="button" class="sb-item" aria-expanded="{{toolsOpen}}" onClick="{{toggleTools}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>Tools<svg class="ic sm sb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button>
<sc-if value="{{toolsOpen}}" hint-placeholder-val="{{ false }}">
<ul class="sb-sub">
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Zmanim</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>Luach</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Mizrach</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"></path></svg>Misheberach</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 11h14M5 15.5h9"></path></svg>Verses for names</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="12" cy="10" r="3"></circle><path d="M7 19c1-2.5 2.8-3.7 5-3.7s4 1.2 5 3.7"></path></svg>Tefillin mirror</button></li>
</ul>
</sc-if>
</li>
</ul>
<ul class="sb-list sb-foot">
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4v4h4"></path><path d="M12 8v4.5l3 2"></path></svg>History</button></li>
<li><button type="button" class="sb-item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="6.5"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings</button></li>
</ul>
</nav>

<main class="content">
<div class="navbar">
<button type="button" class="icon-btn" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path></svg></button>
</div>
<h1 class="large-title">Learn</h1>

<section aria-labelledby="h-continue">
<h2 class="sec-title" id="h-continue">Continue</h2>
<div class="group continue">
<img class="cover continue-cover" src="{{covers.arachin}}" alt="Arachin, Schottenstein Talmud Bavli">
<div class="continue-text">
<p class="continue-title"><span>Arachin 2a</span><span class="he" lang="he" dir="rtl">ערכין ב׳ ע״א</span></p>
<p class="continue-meta">Chapter 1, Hakol Ma’arichin. Opened 2 hours ago.</p>
<div class="continue-progress"><span class="bar" aria-hidden="true"><i></i></span><span class="tnum">1% of Arachin</span></div>
</div>
<a class="btn-filled" href="Reader.html">Resume Arachin 2a</a>
</div>
</section>

<div class="two-col">
<section aria-labelledby="h-today">
<h2 class="sec-title" id="h-today">Today’s learning</h2>
<ul class="group">
<li class="{{rowDaf}}">
<button type="button" class="check" aria-pressed="{{lDaf}}" aria-label="Daf Yomi learned" onClick="{{tDaf}}"><span class="check-ring"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"></path></svg></span></button>
<a class="row-link" href="Reader.html"><span class="row-text"><span class="row-title">Daf Yomi</span><span class="row-sub"><span>Arachin 4</span><span class="he" lang="he" dir="rtl">ערכין ד׳</span></span></span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></a>
</li>
<li class="{{rowYer}}">
<button type="button" class="check" aria-pressed="{{lYer}}" aria-label="Yerushalmi learned" onClick="{{tYer}}"><span class="check-ring"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"></path></svg></span></button>
<a class="row-link" href="Library.html"><span class="row-text"><span class="row-title">Yerushalmi</span><span class="row-sub"><span>Kesubos 37</span><span class="he" lang="he" dir="rtl">כתובות ל״ז</span></span></span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></a>
</li>
<li class="{{rowMish}}">
<button type="button" class="check" aria-pressed="{{lMish}}" aria-label="Mishnah Yomis learned" onClick="{{tMish}}"><span class="check-ring"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"></path></svg></span></button>
<a class="row-link" href="Library.html"><span class="row-text"><span class="row-title">Mishnah Yomis</span><span class="row-sub"><span>Negaim 3:3–4</span><span class="he" lang="he" dir="rtl">נגעים ג׳:ג׳–ד׳</span></span></span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></a>
</li>
<li class="{{rowKitzur}}">
<button type="button" class="check" aria-pressed="{{lKitzur}}" aria-label="Kitzur Yomi learned" onClick="{{tKitzur}}"><span class="check-ring"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"></path></svg></span></button>
<a class="row-link" href="Library.html"><span class="row-text"><span class="row-title">Kitzur Yomi</span><span class="row-sub"><span>Siman 151</span><span class="he" lang="he" dir="rtl">סימן קנ״א</span></span></span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></a>
</li>
</ul>
</section>

<section aria-labelledby="h-plans">
<h2 class="sec-title" id="h-plans">Learning plans</h2>
<div class="group plans">
<p class="plans-intro">You have no plans yet. Start one and it appears in Today’s learning each morning, with your place kept.</p>
<ul>
<li class="row"><span class="row-text"><span class="row-title">Daf Yomi</span><span class="row-sub">One daf a day, with the worldwide cycle</span></span><button type="button" class="btn-tinted" aria-pressed="{{pDaf}}" onClick="{{startDaf}}">{{pDafLabel}}<span class="vh"> Daf Yomi</span></button></li>
<li class="row"><span class="row-text"><span class="row-title">Mishnah Yomis</span><span class="row-sub">Two mishnayos a day</span></span><button type="button" class="btn-tinted" aria-pressed="{{pMish}}" onClick="{{startMish}}">{{pMishLabel}}<span class="vh"> Mishnah Yomis</span></button></li>
<li class="row"><span class="row-text"><span class="row-title">Finish Arachin</span><span class="row-sub">33 dapim, at a pace you choose</span></span><button type="button" class="btn-tinted" aria-pressed="{{pAr}}" onClick="{{startAr}}">{{pArLabel}}<span class="vh"> Finish Arachin</span></button></li>
</ul>
</div>
</section>
</div>

<section class="recent" aria-labelledby="h-recent">
<h2 class="sec-title" id="h-recent">Recently opened</h2>
<ul class="recent-row">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="7">
<li><a class="recent-item" href="{{r.href}}"><img class="cover" src="{{r.src}}" alt=""><span>{{r.title}}</span></a></li>
</sc-for>
</ul>
</section>
</main>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      toolsOpen: false,
      learned: { daf: false, yer: false, mish: false, kitzur: true },
      plans: { daf: false, mish: false, ar: false }
    };
  }
  renderVals() {
    // Cover map: replace these files to swap in the real ArtScroll covers.
    const covers = window.COVERS;
    const s = this.state;
    const L = s.learned;
    const P = s.plans;
    const learn = (k) => () => this.setState({ learned: Object.assign({}, L, { [k]: !L[k] }) });
    const plan = (k) => () => this.setState({ plans: Object.assign({}, P, { [k]: !P[k] }) });
    const row = (k) => (L[k] ? 'row learned' : 'row');
    return {
      covers,
      toolsOpen: s.toolsOpen,
      toggleTools: () => this.setState({ toolsOpen: !s.toolsOpen }),
      lDaf: L.daf, lYer: L.yer, lMish: L.mish, lKitzur: L.kitzur,
      rowDaf: row('daf'), rowYer: row('yer'), rowMish: row('mish'), rowKitzur: row('kitzur'),
      tDaf: learn('daf'), tYer: learn('yer'), tMish: learn('mish'), tKitzur: learn('kitzur'),
      pDaf: P.daf, pMish: P.mish, pAr: P.ar,
      pDafLabel: P.daf ? 'Added' : 'Start',
      pMishLabel: P.mish ? 'Added' : 'Start',
      pArLabel: P.ar ? 'Added' : 'Start',
      startDaf: plan('daf'), startMish: plan('mish'), startAr: plan('ar'),
      recent: [
        { title: 'Arachin', src: covers.arachin, href: 'Reader.html' },
        { title: 'Menachos', src: covers.menachos, href: 'Library.html' },
        { title: 'Temurah', src: covers.temurah, href: 'Library.html' },
        { title: 'Shabbos', src: covers.shabbos, href: 'Library.html' },
        { title: 'Chullin', src: covers.chullin, href: 'Library.html' },
        { title: 'Zevachim', src: covers.zevachim, href: 'Library.html' },
        { title: 'Berachos', src: covers.berachos, href: 'Library.html' }
      ]
    };
  }
}

DC_BOOT(Component);
</script>
</body>
</html>
