<p class="gem" lang="he"><span class="dseg {{s0}}"><b class="mark">מתני׳</b> <span class="gem-open">הכל</span> מעריכין ונערכין נודרין ונידרין כהנים לוים וישראלים נשים ועבדים</span> <span class="dseg {{s1}}">טומטום ואנדרוגינוס נודרין ונידרין ומעריכין אבל לא נערכין שאינו נערך אלא הזכר ודאי ונקבה ודאית</span> <span class="dseg {{s2}}">חרש שוטה וקטן נידרין ונערכין אבל לא נודרין ולא מעריכין מפני שאין בהם דעת:</span> <span class="dseg {{s3}}"><b class="mark">גמ׳</b> הכל מעריכין לאתויי מאי לאתויי מופלא סמוך לאיש</span> <span class="dseg {{s4}}">נערכין לאתויי מאי לאתויי מנוול ומוכה שחין</span> <span class="dseg {{s5}}">סד״א נדר בערכך כתיב כל שישנו בדמים ישנו בערכין וכל שאינו בדמים אינו בערכין</span> <span class="dseg {{s6}}">קמ״ל נפשות כל דהו</span> <span class="dseg {{s7}}">נודרין לאתויי מאי נידרין איצטריך ליה</span> <span class="dseg">נידרין לאתויי מאי אי לאתויי טומטום ואנדרוגינוס בהדיא קתני להו ואי לאתויי חרש שוטה וקטן בהדיא קתני להו</span> <span class="dseg">אי לאתויי פחות מבן חודש בהדיא קתני להו ואי לאתויי עובד כוכבים בהדיא קתני להו לעולם לאתויי פחות מבן חודש ותני והדר מפרש</span> <span class="dseg">הכל סומכין לאתויי מאי לאתויי יורש ודלא כרבי יהודה</span> <span class="dseg">הכל ממירין לאתויי מאי לאתויי יורש ודלא כרבי יהודה</span> <span class="dseg">דתניא יורש סומך יורש מימר ר׳ יהודה אומר יורש אינו סומך יורש אינו מימר</span> <span class="dseg">מאי טעמא דרבי יהודה (ויקרא א, ג) קרבנו ולא קרבן אביו ויליף תחלת הקדש מסוף הקדש מה סוף הקדש יורש אינו סומך אף תחלת הקדש יורש אינו מימר</span> <span class="dseg">ורבנן (ויקרא כז, י) המר ימיר לרבות את היורש וילפינן סוף הקדש מתחלת הקדש מה תחלת הקדש יורש מימר אף סוף הקדש יורש סומך</span> <span class="dseg">ורבנן האי קרבנו מאי עבדי ליה מיבעי ליה קרבנו ולא קרבן עובד כוכבים קרבנו ולא קרבן חבירו קרבנו לרבות כל בעלי חוברין לסמיכה</span> <span class="dseg">ורבי יהודה לרבות כל בעלי חוברין לסמיכה לית ליה ואי נמי אית ליה</span></p>

<sc-if value="{{tabT}}" hint-placeholder-val="{{ true }}">
<div role="tabpanel" aria-label="Translation">
<p class="dedication"><span class="he" lang="he" dir="rtl">לעילוי נשמת ר׳ אברהם יצחק ב״ר שמואל ורבקה בת מנחם</span>This volume is dedicated by the Halpern family in loving memory of their parents.</p>
<div class="ch-head"><h2>Chapter One</h2><span class="he" lang="he" dir="rtl">פרק ראשון · הכל מעריכין</span></div>

<div class="tl {{s0}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a0}}" onClick="{{p0}}">מתני׳ הכל מעריכין ונערכין נודרין ונידרין כהנים לוים וישראלים נשים ועבדים</button>
<p class="tl-en"><b>Everyone may pledge a valuation, and everyone may be valued; everyone may vow another’s worth, and everyone’s worth may be vowed.</b> A valuation is the fixed sum the Torah sets by age and sex alone. A vow of worth is paid at whatever the person would fetch if sold as a servant.<sup>1</sup> <b>This holds for Kohanim, Levites and Yisraelim, for women and for slaves.</b></p>
<p class="fn"><span class="fn-n">1</span>The fixed sums are listed in Leviticus 27:3–7. For a man between twenty and sixty, for example, the sum is fifty shekels.</p>
</div>

<div class="tl {{s1}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a1}}" onClick="{{p1}}">טומטום ואנדרוגינוס נודרין ונידרין ומעריכין אבל לא נערכין שאינו נערך אלא הזכר ודאי ונקבה ודאית</button>
<p class="tl-en"><b>A tumtum and an androgynous</b>, a person whose sex cannot be determined and a person with features of both, <b>may vow another’s worth, may have their own worth vowed, and may pledge a valuation. But they may not be valued, for only one who is definitely male or definitely female is valued.</b> The Torah gives one scale for men and another for women, and neither scale applies to them.</p>
</div>

<div class="tl {{s2}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a2}}" onClick="{{p2}}">חרש שוטה וקטן נידרין ונערכין אבל לא נודרין ולא מעריכין מפני שאין בהם דעת:</button>
<p class="tl-en"><b>A deaf-mute, a person who is mentally incompetent, and a minor may have their worth vowed and may be valued, but they may not vow or pledge a valuation, because they lack understanding.</b> A binding pledge needs a person who grasps what he commits to. Someone else may still pledge on their account, since the debt falls on the one who speaks.</p>
</div>

<div class="tl {{s3}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a3}}" onClick="{{p3}}">גמ׳ הכל מעריכין לאתויי מאי לאתויי מופלא סמוך לאיש</button>
<p class="tl-en"><b>Gemara.</b> The Mishnah opened, <b>“Everyone may pledge a valuation.” What does “everyone” add</b>, beyond the groups it goes on to list? <b>It adds a child close to adulthood:</b> a boy in the year before he comes of age, whose vow stands once it is clear he understood in Whose Name he vowed.<sup>2</sup></p>
<p class="fn"><span class="fn-n">2</span>The age, and how such a child’s understanding is tested, are taught in the Mishnah in Niddah 45b.</p>
</div>

<div class="tl {{s4}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a4}}" onClick="{{p4}}">נערכין לאתויי מאי לאתויי מנוול ומוכה שחין</button>
<p class="tl-en"><b>“And everyone may be valued.” What does “everyone” add here? It adds a person who is disfigured or covered with boils.</b> Offered for sale, such a person would bring almost nothing.</p>
</div>

<div class="tl {{s5}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a5}}" onClick="{{p5}}">סד״א נדר בערכך כתיב כל שישנו בדמים ישנו בערכין וכל שאינו בדמים אינו בערכין</button>
<p class="tl-en"><b>You might have thought</b> otherwise, <b>since it is written, “a vow by your valuation,”</b><sup>3</sup> joining the two. That would suggest <b>whoever has a market value can be valued, and whoever has no market value cannot be valued.</b></p>
<p class="fn"><span class="fn-n">3</span>Leviticus 27:2.</p>
</div>

<div class="tl {{s6}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a6}}" onClick="{{p6}}">קמ״ל נפשות כל דהו</button>
<p class="tl-en"><b>The Mishnah teaches us</b> that this is not so. The verse speaks of <b>“souls,” meaning any person at all</b>, whatever he would fetch.</p>
</div>

<div class="tl {{s7}}">
<button type="button" class="tl-he" lang="he" dir="rtl" aria-pressed="{{a7}}" onClick="{{p7}}">נודרין לאתויי מאי נידרין איצטריך ליה</button>
<p class="tl-en"><b>“Everyone may vow another’s worth.” What does “everyone” add here?</b> Nothing of its own. <b>The Mishnah needed the word for the clause that follows,</b> “and everyone’s worth may be vowed.”</p>
</div>
</div>
</sc-if>

<sc-if value="{{tabN}}" hint-placeholder-val="{{ false }}">
<div role="tabpanel" aria-label="Notes" class="notes-list">
<div class="group note-card">
<p class="note-ref"><span>Arachin 2a, today</span><span class="he" lang="he" dir="rtl">לאתויי מופלא סמוך לאיש</span></p>
<p class="note-body">Compare Niddah 45b: how a child’s understanding of his vow is tested in the year before he comes of age.</p>
</div>
<div><button type="button" class="btn-tinted"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New note</button></div>

<sc-if value="{{tabC}}" hint-placeholder-val="{{ false }}">
<div role="tabpanel" aria-label="Commentary">
<div class="group cm-block">
<p class="cm-on">On the line <span class="he" lang="he" dir="rtl">מתני׳ הכל מעריכין</span></p>
<p class="cm-name">Rashi, in brief</p>
<p class="cm-text">A valuation is the sum written in the Torah’s passage. One who says “the valuation of this person is on me” gives the sum set for that person’s age. A vow of worth is assessed as if the person were a servant sold in the market.</p>
</div>
<ul class="group cm-list">
<li class="row"><button type="button" class="row-link"><span class="row-text"><span class="row-title">Rashi</span></span><span class="he" lang="he" dir="rtl">רש״י</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button></li>
<li class="row"><button type="button" class="row-link"><span class="row-text"><span class="row-title">Tosafos</span></span><span class="he" lang="he" dir="rtl">תוספות</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button></li>
<li class="row"><button type="button" class="row-link"><span class="row-text"><span class="row-title">Rabbeinu Gershom</span></span><span class="he" lang="he" dir="rtl">רבינו גרשום</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button></li>
<li class="row"><button type="button" class="row-link"><span class="row-text"><span class="row-title">Shitah Mekubetzes</span></span><span class="he" lang="he" dir="rtl">שיטה מקובצת</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button></li>
</ul>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: 'light', size: 3, layout: 'side', tab: 't', sel: 0,
      fn: false, hl: true, lightDaf: false, pop: false
    };
    this.rashi = this.makeLines(7, 72);
    this.tosafos = this.makeLines(19, 72);
  }
  // Rashi and Tosafos are drawn as fine text lines (a stand-in, not real text).
  makeLines(seed, count) {
    let x = seed;
    const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const n = 3 + Math.floor(rnd() * 4);
      const ws = [];
      for (let j = 0; j < n; j++) {
        const lead = j === 0 && (i % 9 === 0 || i % 9 === 5);
        ws.push({ c: 'w g' + (1 + Math.floor(rnd() * 5)) + (lead ? ' dh' : '') });
      }
      out.push({ c: i % 9 === 4 || i % 9 === 8 ? 'ln end' : 'ln', ws });
    }
    return out;
  }
  renderVals() {
    const s = this.state;
    const root = ['ipad', 'land', 't-' + s.theme, 'fs-' + s.size, 'lay-' + s.layout];
    if (s.fn) root.push('show-fn');
    if (s.hl) root.push('show-hl');
    if (s.lightDaf) root.push('light-daf');
    if (s.pop) root.push('pop-open');
    const set = (patch) => () => this.setState(patch);
    const v = {
      root: root.join(' '),
      rashi: this.rashi, tosafos: this.tosafos,
      pop: s.pop, togglePop: set({ pop: !s.pop }), closePop: set({ pop: false }),
      panelOn: s.layout !== 'daf', togglePanel: set({ layout: s.layout === 'daf' ? 'side' : 'daf' }),
      tabT: s.tab === 't', tabN: s.tab === 'n', tabC: s.tab === 'c',
      showT: set({ tab: 't' }), showN: set({ tab: 'n' }), showC: set({ tab: 'c' }),
      thLight: s.theme === 'light', thSepia: s.theme === 'sepia', thNight: s.theme === 'night',
      setLight: set({ theme: 'light' }), setSepia: set({ theme: 'sepia' }), setNight: set({ theme: 'night' }),
      size: s.size,
      sizeText: ['Smallest', 'Small', 'Default', 'Large', 'Largest'][s.size - 1],
      onSize: (e) => this.setState({ size: Number(e.target.value) }),
      lyDaf: s.layout === 'daf', lyTr: s.layout === 'translation', lySide: s.layout === 'side',
      setDaf: set({ layout: 'daf' }), setTr: set({ layout: 'translation' }), setSide: set({ layout: 'side' }),
      fn: s.fn, hl: s.hl, lightDaf: s.lightDaf,
      toggleFn: set({ fn: !s.fn }), toggleHl: set({ hl: !s.hl }), toggleLightDaf: set({ lightDaf: !s.lightDaf })
    };
    for (let i = 0; i < 8; i++) {
      v['s' + i] = s.sel === i ? 'cur' : '';
      v['a' + i] = s.sel === i;
      v['p' + i] = set({ sel: i });
    }
    return v;
  }
}

DC_BOOT(Component);
</script>
