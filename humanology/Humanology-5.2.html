:"Publication abstract","publication_type":"Primary study"},{"source_id":"16719566","title":"Distributed practice in verbal recall tasks: A review and quantitative synthesis.","url":"https://pubmed.ncbi.nlm.nih.gov/16719566/","year":"2006","role":"One component, spacing","what_it_shows":"Spacing learning episodes improved later retention compared with massed practice. Effective intervals depended on how much later learners were tested. This paper does not establish the feedback and self-testing schedule.","authors":"Cepeda NJ, Pashler H, Vul E, Wixted JT, Rohrer D.","doi":"10.1037/0033-2909.132.3.354","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"16796222","title":"A brief afternoon nap following nocturnal sleep restriction: which nap duration is most recuperative?","url":"https://pubmed.ncbi.nlm.nih.gov/16796222/","year":"2006","role":"Related duration measure","what_it_shows":"After restricted sleep, ten minutes of actual nap sleep improved immediate alertness in a small lab trial. Five, 20 and 30 minutes had different effects. The 15-minute time allowance is supported by the other paper.","authors":"Brooks A, Lack L.","doi":"10.1093/sleep/29.6.831","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"17275896","title":"The effect of walking on fitness, fatness and resting blood pressure: a meta-analysis of randomised, controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/17275896/","year":"2007","role":"Pooled research","what_it_shows":"Controlled trials in previously sedentary adults measured gains in aerobic fitness after regular walking. This supports the fitness benefit separately from blood pressure.","authors":"Murphy MH, Nevill AM, Murtagh EM, Holder RL.","doi":"10.1016/j.ypmed.2006.12.008","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"17514726","title":"Supplementary breaks and stretching exercises for data entry operators: a follow-up field study.","url":"https://pubmed.ncbi.nlm.nih.gov/17514726/","year":"2007","role":"Controlled trial","what_it_shows":"Data-entry workers reported less discomfort and eyestrain when four five-minute breaks were added to their usual breaks.","authors":"Galinsky T, Swanson N, Sauter S, Dunkin R, Hurrell J, Schleifer L.","doi":"10.1002/ajim.20472","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"18426457","title":"Music improves sleep quality in students.","url":"https://pubmed.ncbi.nlm.nih.gov/18426457/","year":"2008","role":"Direct primary example","what_it_shows":"Young adults with sleep complaints who listened to 45 minutes of relaxing classical music at bedtime for three weeks reported improved sleep quality on a questionnaire.","authors":"Harmat L, Takács J, Bódizs R, Bódizs R.","doi":"10.1111/j.1365-2648.2008.04602.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"19661958","title":"Water consumption increases weight loss during a hypocaloric diet intervention in middle-aged and older adults.","url":"https://pubmed.ncbi.nlm.nih.gov/19661958/","year":"2010","role":"Direct, combined program","what_it_shows":"Forty-eight adults aged 55–75 on a reduced-calorie diet were assigned to water before meals or diet alone. Weight loss over 12 weeks was about 2 kg greater with 500 mL water before each main meal.","authors":"Dennis EA, Dengo AL, Comber DL, Flack KD, Savla J, Davy KP, Davy BM.","doi":"10.1038/oby.2009.235","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"19930508","title":"Repeated testing improves long-term retention relative to repeated study: a randomised controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/19930508/","year":"2009","role":"Direct combined example","what_it_shows":"Forty trainees completed repeated testing with feedback versus repeated study. The first session was immediate and two further sessions were roughly two weeks apart. Six-month scores averaged 39% versus 26% on the studied material.","authors":"Larsen DP, Butler AC, Roediger HL.","doi":"10.1111/j.1365-2923.2009.03518.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"20660224","title":"Physicochemical properties of oat β-glucan influence its ability to reduce serum LDL cholesterol in humans: a randomized clinical trial.","url":"https://pubmed.ncbi.nlm.nih.gov/20660224/","year":"2010","role":"Direct, product-specific result","what_it_shows":"Cereals providing 3 g daily of high- or medium-molecular-weight oat beta-glucan lowered LDL by about 5%. The low-molecular-weight preparation was less effective.","authors":"Wolever TM, Tosh SM, Gibbs AL, Brand-Miller J, Duncan AM, Hart V, Lamarche B, Thomson BA, Duss R, Wood PJ.","doi":"10.3945/ajcn.2010.29174","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"21177034","title":"Effectiveness of small daily amounts of progressive resistance training for frequent neck/shoulder pain: randomised controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/21177034/","year":"2011","role":"Controlled trial","what_it_shows":"Symptomatic workers received taught progressive band exercises for two or twelve minutes on workdays. Both groups reported less neck or shoulder pain than controls.","authors":"Andersen LL, Saervoll CA, Mortensen OS, Poulsen OM, Hannerz H, Zebis MK.","doi":"10.1016/j.pain.2010.11.016","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"21323688","title":"Randomised clinical trial: dried plums (prunes) vs. psyllium for constipation.","url":"https://pubmed.ncbi.nlm.nih.gov/21323688/","year":"2011","role":"Direct exact schedule","what_it_shows":"Forty adults with constipation crossed over between dried plums and psyllium. Fifty grams of dried plums twice daily for three weeks improved complete spontaneous bowel movements and stool consistency relative to psyllium.","authors":"Attaluri A, Donahoe R, Valestin J, Brown K, Rao SS.","doi":"10.1111/j.1365-2036.2011.04594.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"21450262","title":"Become more optimistic by imagining a best possible self: effects of a two week intervention.","url":"https://pubmed.ncbi.nlm.nih.gov/21450262/","year":"2011","role":"Direct, tested schedule","what_it_shows":"Five minutes daily of imagining one’s best possible self increased self-rated optimism relative to imagining ordinary daily activities, both after one session and over two weeks.","authors":"Meevissen YM, Peters ML, Alberts HJ.","doi":"10.1016/j.jbtep.2011.02.012","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"22301929","title":"Replacing caloric beverages with water or diet beverages for weight loss in adults: main results of the Choose Healthy Options Consciously Everyday (CHOICE) randomized clinical trial.","url":"https://pubmed.ncbi.nlm.nih.gov/22301929/","year":"2012","role":"Inconclusive water-specific result","what_it_shows":"At six months mean weight loss in the water group did not clearly exceed the attention control. A separate positive analysis combined water and diet drinks. It cannot establish the effect of water alone.","authors":"Tate DF, Turner-McGrievy G, Lyons E, Stevens J, Erickson K, Polzien K, Diamond M, Wang X, Popkin B.","doi":"10.3945/ajcn.111.026278","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"22374636","title":"Breaking up prolonged sitting reduces postprandial glucose and insulin responses.","url":"https://pubmed.ncbi.nlm.nih.gov/22374636/","year":"2012","role":"Direct result, different timing","what_it_shows":"Nineteen adults with overweight or obesity had lower five-hour glucose and insulin responses with two-minute walks every 20 minutes than with uninterrupted sitting. Use for the benefit and the 20-minute interval.","authors":"Dunstan DW, Kingwell BA, Larsen R, Healy GN, Cerin E, Hamilton MT, Shaw JE, Bertovic DA, Zimmet PZ, Salmon J, Owen N.","doi":"10.2337/dc11-1931","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"23732711","title":"Sunscreen and prevention of skin aging: a randomized trial.","url":"https://pubmed.ncbi.nlm.nih.gov/23732711/","year":"2013","role":"Direct multi-year result","what_it_shows":"Australian adults assigned daily sunscreen showed less progression of skin aging at 4.5 years than those using it at their discretion. Assessors graded changes without knowing treatment assignment.","authors":"Hughes MC, Williams GM, Baker P, Green AC.","doi":"10.7326/0003-4819-158-11-201306040-00002","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"23929687","title":"Olfactory training is helpful in postinfectious olfactory loss: a randomized, controlled, multicenter study.","url":"https://pubmed.ncbi.nlm.nih.gov/23929687/","year":"2014","role":"Different comparison and duration","what_it_shows":"People with postinfectious smell loss trained with stronger or weaker odors for 18 weeks. Improvement on testing was more common in the higher-concentration arm. Both groups trained, limiting inference about training versus usual care.","authors":"Damm M, Pikart LK, Reimann H, Burkert S, Göktas Ö, Haxel B, Frey S, Charalampakis I, Beule A, Renner B, Hummel T, Hüttenbrink KB.","doi":"10.1002/lary.24340","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"24388483","title":"Slower eating speed lowers energy intake in normal-weight but not overweight/obese subjects.","url":"https://pubmed.ncbi.nlm.nih.gov/24388483/","year":"2014","role":"Controlled trial","what_it_shows":"A fast-versus-slow eating comparison found lower intake in the normal-weight subgroup. The group-by-weight interaction was not significant.","authors":"Shah M, Copeland J, Dart L, Adams-Huet B, James A, Rhea D.","doi":"10.1016/j.jand.2013.11.002","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"24847856","title":"A systematic review and meta-analysis examining the effect of eating rate on energy intake and hunger.","url":"https://pubmed.ncbi.nlm.nih.gov/24847856/","year":"2014","role":"Direct pooled result","what_it_shows":"Experimental meals consumed more slowly were associated with lower intake on average than faster meals. The designs and methods for changing eating rate varied.","authors":"Robinson E, Almiron-Roig E, Rutters F, de Graaf C, Forde CG, Tudur Smith C, Nolan SJ, Jebb SA.","doi":"10.3945/ajcn.113.081745","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"25150680","title":"The effect of testing versus restudy on retention: a meta-analytic review of the testing effect.","url":"https://pubmed.ncbi.nlm.nih.gov/25150680/","year":"2014","role":"One component, retrieval","what_it_shows":"Pooling testing-versus-restudy comparisons favored retrieval for later recall. This supports self-testing as an ingredient. The exact two-week spacing and feedback example comes from the trainee trial.","authors":"Rowland CA.","doi":"10.1037/a0037559","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"25411276","title":"Cholesterol-lowering effects of oat β-glucan: a meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/25411276/","year":"2014","role":"Pooled research","what_it_shows":"Controlled trials using at least 3 g/day of oat beta-glucan found lower LDL compared with control diets. The active amount refers specifically to oat beta-glucan.","authors":"Whitehead A, Beck EJ, Tosh S, Wolever TM.","doi":"10.3945/ajcn.114.086108","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"27631616","title":"The Effect of Cold Showering on Health and Work: A Randomized Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/27631616/","year":"2016","role":"Direct, pooled durations","what_it_shows":"Sick-leave days were 29% lower across groups assigned 30–90 seconds of cold water at the end of showers. Self-reported illness days were comparable. The 29% was not estimated specifically for 30 seconds.","authors":"Buijze GA, Sierevelt IN, van der Heijden BC, Dijkgraaf MG, Frings-Dresen MH.","doi":"10.1371/journal.pone.0161749","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"27724985","title":"The effect of oat β-glucan on LDL-cholesterol, non-HDL-cholesterol and apoB for CVD risk reduction: a systematic review and meta-analysis of randomised-controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/27724985/","year":"2016","role":"Pooled research","what_it_shows":"A second oat beta-glucan synthesis reported lower LDL across 58 trials. The two syntheses may include many of the same trials.","authors":"Ho HV, Sievenpiper JL, Zurbau A, Blanco Mejia S, Jovanovski E, Au-Yeung F, Jenkins AL, Vuksan V.","doi":"10.1017/s000711451600341x","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"27747394","title":"Advice to walk after meals is more effective for lowering postprandial glycaemia in type 2 diabetes mellitus than advice that does not specify timing: a randomised crossover study.","url":"https://pubmed.ncbi.nlm.nih.gov/27747394/","year":"2016","role":"Direct, diabetes variant","what_it_shows":"Adults with type 2 diabetes had about 12% less three-hour post-meal glucose exposure with ten minutes of walking after each main meal than with one untimed daily walk. This comparison supplies no insulin estimate.","authors":"Reynolds AN, Mann JI, Williams S, Venn BJ.","doi":"10.1007/s00125-016-4085-2","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"27809874","title":"Effect of frequent interruptions of prolonged sitting on self-perceived levels of energy, mood, food cravings and cognitive function.","url":"https://pubmed.ncbi.nlm.nih.gov/27809874/","year":"2016","role":"Direct moderate-walk schedule","what_it_shows":"Thirty sedentary adults completed uninterrupted sitting and two activity conditions. Six hourly five-minute moderate walks improved self-rated mood and reduced fatigue compared with sitting. A morning half-hour walk did not show those same results.","authors":"Bergouignan A, Legget KT, De Jong N, Kealey E, Nikolovski J, Groppel JL, Jordan C, O'Day R, Hill JO, Bessesen DH.","doi":"10.1186/s12966-016-0437-z","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"28033302","title":"The efficacy of isometric resistance training utilizing handgrip exercise for blood pressure management: A randomized trial.","url":"https://pubmed.ncbi.nlm.nih.gov/28033302/","year":"2016","role":"Controlled trial","what_it_shows":"Eight weeks of handgrip training at 30% maximum was compared with lower intensity. Systolic pressure fell within the higher-intensity group; its diastolic change was not significant.","authors":"Carlson DJ, Inder J, Palanisamy SKA, McFarlane JR, Dieberg G, Smart NA.","doi":"10.1097/md.0000000000005791","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"29058942","title":"The effects of bedtime writing on difficulty falling asleep: A polysomnographic study comparing to-do lists and completed activity lists.","url":"https://pubmed.ncbi.nlm.nih.gov/29058942/","year":"2018","role":"Direct, one-night comparison","what_it_shows":"Among 57 young adults, writing upcoming tasks for five minutes before bed led to faster objectively measured sleep onset than writing completed tasks. The trial had no group who did neither.","authors":"Scullin MK, Krueger ML, Ballard HK, Pruett N, Bliwise DL.","doi":"10.1037/xge0000374","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"30087839","title":"Experimental effects of brief, single bouts of walking and meditation on mood profile in young adults.","url":"https://pubmed.ncbi.nlm.nih.gov/30087839/","year":"2018","role":"Controlled trial","what_it_shows":"After a ten-minute brisk walk, young adults reported less fatigue than before. The study reported an overall group-by-time interaction and within-group changes.","authors":"Edwards MK, Loprinzi PD.","doi":"10.15171/hpp.2018.23","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"30208396","title":"Effectiveness of a Therapeutic Tai Ji Quan Intervention vs a Multimodal Exercise Intervention to Prevent Falls Among Older Adults at High Risk of Falling: A Randomized Clinical Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/30208396/","year":"2018","role":"Related fall endpoint","what_it_shows":"Among 670 older adults at increased fall risk, twice-weekly therapeutic tai ji quan produced fewer falls than stretching over 24 weeks. Its primary endpoint counted all falls. Cite the earlier trial specifically for repeat falling.","authors":"Li F, Harmer P, Fitzgerald K, Eckstrom E, Akers L, Chou LS, Pidgeon D, Voit J, Winters-Stone K.","doi":"10.1001/jamainternmed.2018.3915","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"30239559","title":"Effect of psyllium (Plantago ovata) fiber on LDL cholesterol and alternative lipid targets, non-HDL cholesterol and apolipoprotein B: a systematic review and meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/30239559/","year":"2018","role":"Direct LDL result","what_it_shows":"Across 28 controlled trials, a median daily psyllium intake of about 10.2 g lowered LDL by 0.33 mmol/L on average. This is the lipid evidence on this two-benefit card.","authors":"Jovanovski E, Yashpal S, Komishon A, Zurbau A, Blanco Mejia S, Ho HVT, Li D, Sievenpiper J, Duvnjak L, Vuksan V.","doi":"10.1093/ajcn/nqy115","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"30285042","title":"Effect of Increased Daily Water Intake in Premenopausal Women With Recurrent Urinary Tract Infections: A Randomized Clinical Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/30285042/","year":"2018","role":"Direct prevention trial","what_it_shows":"Among 140 premenopausal women with recurrent cystitis and low fluid intake, adding 1.5 L of water daily resulted in 1.7 versus 3.2 episodes on average over a year. The study concerned prevention.","authors":"Hooton TM, Vecchio M, Iroz A, Tack I, Dornic Q, Seksek I, Lotan Y.","doi":"10.1001/jamainternmed.2018.4204","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"30288727","title":"Pelvic floor muscle training versus no treatment, or inactive control treatments, for urinary incontinence in women.","url":"https://pubmed.ncbi.nlm.nih.gov/30288727/","year":"2018","role":"Pooled research","what_it_shows":"A Cochrane review compared pelvic-floor training with inactive controls and found symptom improvement in women with stress incontinence.","authors":"Dumoulin C, Cacciari LP, Hay-Smith EJC.","doi":"10.1002/14651858.cd005654.pub4","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"30649897","title":"Do stair climbing exercise \"snacks\" improve cardiorespiratory fitness?","url":"https://pubmed.ncbi.nlm.nih.gov/30649897/","year":"2019","role":"Tested schedule","what_it_shows":"Inactive young adults climbed 60 stairs three times daily, separated by one to four hours. Fitness improved after six weeks.","authors":"Jenkins EM, Nairn LN, Skelly LE, Little JP, Gibala MJ.","doi":"10.1139/apnm-2018-0675","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"31102877","title":"Before-bedtime passive body heating by warm shower or bath to improve sleep: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/31102877/","year":"2019","role":"Pooled research","what_it_shows":"This review found shorter sleep-onset time after appropriately timed warm bathing or showering. Included studies varied in their designs.","authors":"Haghayegh S, Khoshnevis S, Smolensky MH, Diller KR, Castriotta RJ.","doi":"10.1016/j.smrv.2019.04.008","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"31237569","title":"Efficacy of the Mindfulness Meditation Mobile App \"Calm\" to Reduce Stress Among College Students: Randomized Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/31237569/","year":"2019","role":"Direct, student sample","what_it_shows":"Stressed college students assigned to an app-based mindfulness program reported lower perceived stress than a wait-list group. This extends the finding to another study population.","authors":"Huberty J, Green J, Glissmann C, Larkey L, Puzia M, Lee C.","doi":"10.2196/14273","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"31545815","title":"Effects of the Best Possible Self intervention: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/31545815/","year":"2019","role":"Direct pooled result","what_it_shows":"Across different versions of the best-possible-self exercise, participants showed higher optimism on average than comparison groups. The pooled estimate spans different practice formats.","authors":"Carrillo A, Rubio-Aparicio M, Molinari G, Enrique Á, Sánchez-Meca J, Baños RM.","doi":"10.1371/journal.pone.0222386","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"31840162","title":"Two apples a day lower serum cholesterol and improve cardiometabolic biomarkers in mildly hypercholesterolemic adults: a randomized, controlled, crossover trial.","url":"https://pubmed.ncbi.nlm.nih.gov/31840162/","year":"2020","role":"Direct, matched drink","what_it_shows":"Two whole apples daily resulted in modestly lower LDL than a matched apple drink after eight weeks in a small crossover trial of adults with mildly elevated cholesterol.","authors":"Koutsos A, Riccadonna S, Ulaszewska MM, Franceschi P, Trošt K, Galvin A, Braune T, Fava F, Perenzoni D, Mattivi F, Tuohy KM, Lovegrove JA.","doi":"10.1093/ajcn/nqz282","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"32040492","title":"Effect of restricting bedtime mobile phone use on sleep, arousal, mood, and working memory: A randomized pilot trial.","url":"https://pubmed.ncbi.nlm.nih.gov/32040492/","year":"2020","role":"Direct, self-reported outcomes","what_it_shows":"In 38 young adults a reinforced bedtime phone restriction improved reported sleep onset, sleep quality and bedtime arousal. The groups’ average changes in onset differed by about ten minutes. The paper’s p = 0.049 is the end-of-study group comparison.","authors":"He JW, Tu ZH, Xiao L, Su T, Tang YX.","doi":"10.1371/journal.pone.0228756","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Primary study"},{"source_id":"32330233","title":"Dietary Approaches to Stop Hypertension (DASH) Diet and Blood Pressure Reduction in Adults with and without Hypertension: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/32330233/","year":"2020","role":"Pooled research","what_it_shows":"Randomized trials of the DASH pattern found lower systolic and diastolic pressure. Sodium intake and other trial conditions varied.","authors":"Filippou CD, Tsioufis CP, Thomopoulos CG, Mihas CC, Dimitriadis KS, Sotiropoulou LI, Chrysochoou CA, Nihoyannopoulos PI, Tousoulis DM.","doi":"10.1093/advances/nmaa041","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"32409236","title":"Therapeutic benefits of blinking exercises in dry eye disease.","url":"https://pubmed.ncbi.nlm.nih.gov/32409236/","year":"2021","role":"Related schedule","what_it_shows":"In a four-week before-and-after program, dry-eye symptoms improved. It used a different blink schedule and lacked a randomized no-exercise control.","authors":"Kim AD, Muntz A, Lee J, Wang MTM, Craig JP.","doi":"10.1016/j.clae.2020.04.014","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"32488233","title":"An Afternoon Hummus Snack Affects Diet Quality, Appetite, and Glycemic Control in Healthy Adults.","url":"https://pubmed.ncbi.nlm.nih.gov/32488233/","year":"2020","role":"Direct, specified snack","what_it_shows":"Compared with no snack, hummus with pretzels reduced afternoon hunger in 39 healthy adults. Later dessert snacking was about 20% lower than after either no snack or granola bars. The measurement followed six days on each pattern.","authors":"Reister EJ, Leidy HJ.","doi":"10.1093/jn/nxaa139","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"32567798","title":"Treatment of post-viral olfactory dysfunction: an evidence-based review with recommendations.","url":"https://pubmed.ncbi.nlm.nih.gov/32567798/","year":"2020","role":"Direct review, varied protocols","what_it_shows":"An evidence review recommends repeated odor training for postviral smell loss based on changes in measured olfactory function. Protocols and odor sets differed across the studies.","authors":"Hura N, Xie DX, Choby GW, Schlosser RJ, Orlov CP, Seal SM, Rowan NR.","doi":"10.1002/alr.22624","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Review"},{"source_id":"33630309","title":"Walking for hypertension.","url":"https://pubmed.ncbi.nlm.nih.gov/33630309/","year":"2021","role":"Pooled research","what_it_shows":"Walking programs lowered average systolic pressure in adults. The review judged the diastolic result less certain and used a range of schedules.","authors":"Lee LL, Mulvaney CA, Wong YKY, Chan ES, Watson MC, Lin HH.","doi":"10.1002/14651858.cd008823.pub2","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"33878207","title":"Compression stockings for preventing deep vein thrombosis in airline passengers.","url":"https://pubmed.ncbi.nlm.nih.gov/33878207/","year":"2021","role":"Pooled research","what_it_shows":"Flight trials found fewer symptomless leg clots on screening with compression stockings. They could not estimate protection against symptomatic events.","authors":"Clarke MJ, Broderick C, Hopewell S, Juszczak E, Eisinga A.","doi":"10.1002/14651858.cd004002.pub4","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"34074830","title":"Exploratory Comparative Effectiveness Trial of Green Kiwifruit, Psyllium, or Prunes in US Patients With Chronic Constipation.","url":"https://pubmed.ncbi.nlm.nih.gov/34074830/","year":"2021","role":"Direct for bowel frequency","what_it_shows":"In the US comparison all three groups improved in bowel frequency from baseline and responder rates were similar. In the kiwi group bloating and straining also improved. Those symptom outcomes are narrower than overall digestive comfort.","authors":"Chey SW, Chey WD, Jackson K, Eswaran S.","doi":"10.14309/ajg.0000000000001149","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34459569","title":"Effect of Salt Substitution on Cardiovascular Events and Death.","url":"https://pubmed.ncbi.nlm.nih.gov/34459569/","year":"2021","role":"Direct, high-risk population","what_it_shows":"With potassium-enriched salt there were about 29 versus 34 strokes per 1,000 person-years in rural Chinese participants with a prior stroke or who were at least 60 with hypertension. Follow-up averaged 4.74 years.","authors":"Neal B, Wu Y, Feng X, Zhang R, Zhang Y, Shi J, Zhang J, Tian M, Huang L, Li Z, Yu Y, Zhao Y, Zhou B, Sun J, Liu Y, Yin X, Hao Z, Yu J, Li KC, Zhang X, Duan P, Wang F, Ma B, Shi W, Di Tanna GL, Stepien S, Shan S, Pearson SA, Li N, Yan LL, Labarthe D, Elliott P.","doi":"10.1056/nejmoa2105675","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34463746","title":"Home Hazard Removal to Reduce Falls Among Community-Dwelling Older Adults: A Randomized Clinical Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/34463746/","year":"2021","role":"Secondary result only","what_it_shows":"A home-hazard intervention lowered the rate of falls in a secondary analysis. The primary measure, time to first fall, did not differ clearly. Attach only to the fall-rate interpretation.","authors":"Stark S, Keglovits M, Somerville E, Hu YL, Barker A, Sykora D, Yan Y.","doi":"10.1001/jamanetworkopen.2021.22044","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34507028","title":"Behavioral interventions to extend sleep duration: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/34507028/","year":"2021","role":"Broader research","what_it_shows":"Sleep-extension interventions increased sleep duration across populations, with substantial variation. This review does not establish lower energy intake.","authors":"Baron KG, Duffecy J, Reutrakul S, Levenson JC, McFarland MM, Lee S, Qeadan F.","doi":"10.1016/j.smrv.2021.101532","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"34642756","title":"Canned Beans Decrease Serum Total and LDL Cholesterol in Adults with Elevated LDL Cholesterol in a 4-wk Multicenter, Randomized, Crossover Study.","url":"https://pubmed.ncbi.nlm.nih.gov/34642756/","year":"2021","role":"Direct comparison","what_it_shows":"One cup of beans daily for four weeks produced a lower LDL than white rice. Half a cup did not clearly differ from rice. The trial also found no clear difference between the two portions.","authors":"Doma KM, Dolinar KF, Dan Ramdath D, Wolever TMS, Duncan AM.","doi":"10.1093/jn/nxab323","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34877772","title":"The efficacy of powered toothbrushes: A systematic review and network meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/34877772/","year":"2022","role":"Pooled research","what_it_shows":"Pooled single-brushing studies found slightly greater plaque removal with a powered toothbrush. This specific finding concerns immediate plaque removal.","authors":"Thomassen TMJA, Van der Weijden FGA, Slot DE.","doi":"10.1111/idh.12563","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"35129580","title":"Effect of Sleep Extension on Objectively Assessed Energy Intake Among Adults With Overweight in Real-life Settings: A Randomized Clinical Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/35129580/","year":"2022","role":"Controlled trial","what_it_shows":"Individualized counseling increased measured sleep duration and reduced energy intake over two weeks in short-sleeping adults with overweight. Both results came from the same trial.","authors":"Tasali E, Wroblewski K, Kahn E, Kilkus J, Schoeller DA.","doi":"10.1001/jamainternmed.2021.8098","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35210284","title":"Efficacy of a meal sequence in patients with type 2 diabetes: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/35210284/","year":"2022","role":"Limitation, later time point","what_it_shows":"In eight trials in people with type 2 diabetes there was little clear difference in two-hour plasma glucose or HbA1c. Retain as a limit on interpreting the earlier post-meal changes.","authors":"Okami Y, Tsunoda H, Watanabe J, Kataoka Y.","doi":"10.1136/bmjdrc-2021-002534","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"35301135","title":"Sleep Positional Therapy for Nocturnal Gastroesophageal Reflux: A Double-Blind, Randomized, Sham-Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/35301135/","year":"2022","role":"Controlled trial","what_it_shows":"A wearable device encouraged left-side sleep for two weeks. Nighttime reflux symptoms improved relative to a sham device.","authors":"Schuitenmaker JM, Kuipers T, Oude Nijhuis RAB, Schijven MP, Smout AJPM, Fockens P, Bredenoord AJ.","doi":"10.1016/j.cgh.2022.02.058","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35445655","title":"The effect of hand hygiene frequency on reducing acute respiratory infections in the community: a meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/35445655/","year":"2022","role":"Inconclusive frequency analysis","what_it_shows":"A model of six community studies estimated a 3% reduction in daily infection probability per extra hand-hygiene event. Even its 80% credible interval included no difference. This cannot support a precise risk reduction or a wash duration.","authors":"Mo Y, Pham TM, Lim C, Horby P, Stewardson AJ, Harbarth S, Scott GM, Cooper BS.","doi":"10.1017/s0950268822000516","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"35512731","title":"Taking a One-Week Break from Social Media Improves Well-Being, Depression, and Anxiety: A Randomized Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/35512731/","year":"2022","role":"Controlled trial","what_it_shows":"One week away from selected social media platforms improved a wellbeing score compared with usual use. Follow-up was short.","authors":"Lambert J, Barnstable G, Minter E, Cooper J, McEwan D.","doi":"10.1089/cyber.2021.0324","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35816465","title":"The Effect of Fiber Supplementation on Chronic Constipation in Adults: An Updated Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/35816465/","year":"2022","role":"Direct psyllium subgroup","what_it_shows":"In the psyllium subgroup, bowel frequency increased by about 3.08 per week, with a wide 95% interval of 0.61 to 5.54 and substantial variation. The overall fiber response rate cannot be attributed to psyllium alone.","authors":"van der Schoot A, Drysdale C, Whelan K, Dimidi E.","doi":"10.1093/ajcn/nqac184","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Review"},{"source_id":"35945000","title":"Effects of salt substitutes on clinical outcomes: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/35945000/","year":"2022","role":"Pooled research","what_it_shows":"Trials of potassium-enriched salt substitutes found lower systolic and diastolic pressure relative to regular salt.","authors":"Yin X, Rodgers A, Perkovic A, Huang L, Li KC, Yu J, Wu Y, Wu JHY, Marklund M, Huffman MD, Miranda JJ, Miranda JJ, Di Tanna GL, Labarthe D, Elliott P, Tian M, Neal B.","doi":"10.1136/heartjnl-2022-321332","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"36000763","title":"Listening to music for insomnia in adults.","url":"https://pubmed.ncbi.nlm.nih.gov/36000763/","year":"2022","role":"Pooled research","what_it_shows":"A Cochrane review found better perceived sleep quality among adults with insomnia symptoms. Objective sleep measurements were less conclusive.","authors":"Jespersen KV, Pando-Naude V, Koenig J, Jennum P, Vuust P.","doi":"10.1002/14651858.cd010459.pub3","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"36537785","title":"Consumption of 2 Green Kiwifruits Daily Improves Constipation and Abdominal Comfort-Results of an International Multicenter Randomized Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/36537785/","year":"2023","role":"Direct, change from baseline","what_it_shows":"Adults with functional constipation or IBS with constipation reported about 1.5–1.7 more complete spontaneous bowel movements per week than at baseline on two green kiwifruit daily. Overall gastrointestinal comfort also improved.","authors":"Gearry R, Fukudo S, Barbara G, Kuhn-Sherlock B, Ansell J, Blatchford P, Eady S, Wallace A, Butts C, Cremon C, Barbaro MR, Pagano I, Okawa Y, Muratubaki T, Okamoto T, Fuda M, Endo Y, Kano M, Kanazawa M, Nakaya N, Nakaya K, Drummond L.","doi":"10.14309/ajg.0000000000002124","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Primary study"},{"source_id":"36562267","title":"Efficacy of power-driven interdental cleaning tools: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/36562267/","year":"2023","role":"Direct, adjunct to brushing","what_it_shows":"Trials in adults with gingivitis found less bleeding between teeth with powered interdental cleaning plus brushing than with brushing alone. Floss gave a comparable result.","authors":"Edlund P, Bertl K, Pandis N, Stavropoulos A.","doi":"10.1002/cre2.691","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"36630953","title":"Brief structured respiration practices enhance mood and reduce physiological arousal.","url":"https://pubmed.ncbi.nlm.nih.gov/36630953/","year":"2023","role":"Direct, short-term mood","what_it_shows":"In a month-long remote randomized study, brief breathwork, especially exhale-focused cyclic sighing, improved positive mood more than the meditation comparison. The schedule was five minutes daily.","authors":"Balban MY, Neri E, Kogon MM, Weed L, Nouriani B, Jo B, Holl G, Zeitzer JM, Spiegel D, Huberman AD.","doi":"10.1016/j.xcrm.2022.100895","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"36728338","title":"Breaking Up Prolonged Sitting to Improve Cardiometabolic Risk: Dose-Response Analysis of a Randomized Crossover Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/36728338/","year":"2023","role":"Direct light-walk schedules","what_it_shows":"In 11 adults, light walks interrupted laboratory sitting and lowered same-day systolic pressure. Figure 3 supports fatigue and mood findings for the five-minute light-walk schedules. Preserve the separate moderate-walk citation.","authors":"Duran AT, Friel CP, Serafini MA, Ensari I, Cheung YK, Diaz KM.","doi":"10.1249/mss.0000000000003109","review_basis":"Abstract and full-text results, Figure 3","publication_type":"Primary study"},{"source_id":"36870101","title":"The effect of caffeine on subsequent sleep: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/36870101/","year":"2023","role":"Pooled research","what_it_shows":"The review found less sleep after caffeine. Its beverage-specific cutoff estimates are modeled and cannot establish a safe cutoff for a 400 mg dose.","authors":"Gardiner C, Weakley J, Burke LM, Roach GD, Sargent C, Maniar N, Townshend A, Halson SL.","doi":"10.1016/j.smrv.2023.101764","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"37121242","title":"Effectiveness of handwashing with soap for preventing acute respiratory infections in low-income and middle-income countries: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/37121242/","year":"2023","role":"Pooled research","what_it_shows":"Handwashing-with-soap promotion programs reduced respiratory infections in low- and middle-income settings. The review evaluates programs rather than one wash duration.","authors":"Ross I, Bick S, Ayieko P, Dreibelbis R, Wolf J, Freeman MC, Allen E, Brauer M, Cumming O.","doi":"10.1016/s0140-6736(23)00021-1","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"37247191","title":"Impact on facial skin aging signs of a 1-year standardized photoprotection over a classical skin care routine in skin phototypes II-VI individuals: A prospective randomized trial.","url":"https://pubmed.ncbi.nlm.nih.gov/37247191/","year":"2023","role":"Related, one-year result","what_it_shows":"Among 290 Brazilian women, twice-daily SPF 60 slowed progression of some facial aging signs versus usual care over one year. Cite only for that timeframe and regimen.","authors":"Flament F, Mercurio DG, Catalan E, Bouhadanna E, Delaunay C, Miranda DF, Passeron T.","doi":"10.1111/jdv.19230","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"37458579","title":"Randomized controlled trial on occupational graduated compression clinical and cost-effectiveness.","url":"https://pubmed.ncbi.nlm.nih.gov/37458579/","year":"2023","role":"Direct, occupational swelling","what_it_shows":"Graduated stockings countered increases in lower-leg volume in healthcare workers on standing shifts. Seventy-two participants completed data collection. The flight-clot outcome was outside this study.","authors":"Gianesini S, Vagnoni E, Cavicchi C, Chi YW, Pagani A, Tessari M, Zamboni P, Menegatti E.","doi":"10.23736/s0392-9590.23.05030-7","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"37969463","title":"Left lateral decubitus sleeping position is associated with improved gastroesophageal reflux disease symptoms: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/37969463/","year":"2023","role":"Overlapping review","what_it_shows":"The review found evidence linking left-side position to lower acid exposure and summarized the same device trial that reported symptom relief. It adds context without providing another independent device trial.","authors":"Simadibrata DM, Lesmana E, Amangku BR, Wardoyo MP, Simadibrata M.","doi":"10.12998/wjcc.v11.i30.7329","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"38305252","title":"Skeletal site-specific effects of jump training on bone mineral density in adults: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/38305252/","year":"2023","role":"Pooled research","what_it_shows":"Across jump programs, the clearest density improvement was at the femoral neck. The programs varied; the review does not establish fracture prevention.","authors":"Florence GE, Oosthuyse T, Bosch AN.","doi":"10.1080/02640414.2024.2312052","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"38494385","title":"The Effect of Progressive Muscle Relaxation Exercises on Sleep Quality in Cancer Patients Undergoing Chemotherapy: A Randomized Controlled Study.","url":"https://pubmed.ncbi.nlm.nih.gov/38494385/","year":"2024","role":"Direct, clinical population","what_it_shows":"Chemotherapy patients with poor sleep who practiced progressive muscle relaxation scored better on self-rated sleep than a usual-care group. The population limits extrapolation.","authors":"Sarı E, Gündogdu F, Semerci R.","doi":"10.1016/j.soncn.2024.151620","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"38569204","title":"Exercise snacks are a time-efficient alternative to moderate-intensity continuous training for improving cardiorespiratory fitness but not maximal fat oxidation in inactive adults: a randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/38569204/","year":"2024","role":"Tested schedule","what_it_shows":"The short stair-bout group improved peak oxygen uptake after six weeks. The paper also measured fat oxidation, which did not improve.","authors":"Yin M, Deng S, Chen Z, Zhang B, Zheng H, Bai M, Li H, Zhang X, Deng J, Liu Q, Little JP, Li Y.","doi":"10.1139/apnm-2023-0593","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"38612997","title":"Water Intake and Adiposity Outcomes among Overweight and Obese Individuals: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/38612997/","year":"2024","role":"Inconclusive water-specific result","what_it_shows":"Replacing sugary drinks with water was associated with an estimated 0.81 kg lower weight in the relevant subgroup. Its 95% interval ran from 1.66 kg lower to 0.03 kg higher and includes no difference.","authors":"Chen QY, Khil J, Keum N.","doi":"10.3390/nu16070963","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"39279635","title":"Consistent effect of eating rate on food and energy intake across twenty-four <i>ad libitum<\/i> meals.","url":"https://pubmed.ncbi.nlm.nih.gov/39279635/","year":"2024","role":"Related, different intervention","what_it_shows":"Researchers changed food texture to slow eating. Participants consumed less energy at those meals. This provides context for eating rate, while testing a different action from deliberately slowing down.","authors":"Heuven LAJ, van Bruinessen M, Tang CS, Stieger M, Lasschuijt MP, Forde CG.","doi":"10.1017/s0007114524001478","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"39377163","title":"Dose and timing effects of caffeine on subsequent sleep: a randomized clinical crossover trial.","url":"https://pubmed.ncbi.nlm.nih.gov/39377163/","year":"2025","role":"Direct dose–timing trial","what_it_shows":"Twenty-three men completed placebo and 100 mg or 400 mg conditions at 4, 8 or 12 hours before bed. The higher dose affected sleep initiation and architecture within 12 hours. No statistically clear disruption was detected with 100 mg.","authors":"Gardiner CL, Weakley J, Burke LM, Fernandez F, Johnston RD, Leota J, Russell S, Munteanu G, Townshend A, Halson SL.","doi":"10.1093/sleep/zsae230","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"39808431","title":"Digital Meditation to Target Employee Stress: A Randomized Clinical Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/39808431/","year":"2025","role":"Direct, tested prescription","what_it_shows":"In 1,458 stressed employees, assignment to an app providing ten minutes of daily meditation for eight weeks improved perceived stress compared with waiting list. Actual usage varied.","authors":"Radin RM, Vacarro J, Fromer E, Ahmadi SE, Guan JY, Fisher SM, Pressman SD, Hunter JF, Sweeny K, Tomiyama AJ, Hofschneider LT, Zawadzki MJ, Gavrilova L, Epel ES, Prather AA.","doi":"10.1001/jamanetworkopen.2024.54435","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"39985031","title":"Smartphone screen time reduction improves mental health: a randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/39985031/","year":"2025","role":"Direct, single sample","what_it_shows":"After three weeks, 111 students assigned to a daily two-hour phone cap or control differed on depressive symptoms, perceived stress, wellbeing and insomnia severity. The insomnia score differed by 2.59 points at the end. Several outcomes came from these same students.","authors":"Pieh C, Humer E, Hoenigl A, Schwab J, Mayerhofer D, Dale R, Haider K.","doi":"10.1186/s12916-025-03944-z","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"40038410","title":"The effects of social media abstinence on affective well-being and life satisfaction: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/40038410/","year":"2025","role":"Mixed findings","what_it_shows":"A systematic review of social-media breaks found no clear pooled benefit for positive affect, negative affect or life satisfaction. These related endpoints differ from the wellbeing scale of the one-week trial.","authors":"Lemahieu L, Vander Zwalmen Y, Mennes M, Koster EHW, Vanden Abeele MMP, Poels K.","doi":"10.1038/s41598-025-90984-3","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"40087042","title":"Effect of brief intense stair climbing on cardiorespiratory fitness and metabolic risk factors in inactive young men with obesity: A randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/40087042/","year":"2025","role":"Direct, single-session option","what_it_shows":"Young men with obesity completed a four-week vigorous stair program. Peak oxygen uptake improved relative to the pattern in controls. The study found no change in body composition or metabolic variables.","authors":"Han M, Yun J, Kuk JL, Lee S.","doi":"10.1016/j.numecd.2025.103902","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"40467388","title":"Optimisation of blinking exercises for dry eye disease.","url":"https://pubmed.ncbi.nlm.nih.gov/40467388/","year":"2025","role":"Direct, selected schedule","what_it_shows":"Short studies in adults with dry eye found fewer symptoms and incomplete blinks with the selected 15 close–squeeze–open repeats three times a day. Several objective tear-film measures showed no significant change.","authors":"Wolffsohn JS, Travé-Huarte S, Bahra I, Finch C, Anyaegbu U, Garcia-Porta N, Kingsnorth A.","doi":"10.1016/j.clae.2025.102453","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"40627390","title":"A meta-analysis of the effectiveness of gratitude interventions on well-being across cultures.","url":"https://pubmed.ncbi.nlm.nih.gov/40627390/","year":"2025","role":"Related, broader intervention","what_it_shows":"Across 163 samples, diverse gratitude exercises produced a small average wellbeing improvement. This estimate includes many exercises and should not be presented as the effect of writing three good things.","authors":"Choi H, Cha Y, McCullough ME, Coles NA, Oishi S.","doi":"10.1073/pnas.2425193122","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"40944180","title":"Blood Lipid Levels in Response to Almond Consumption: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/40944180/","year":"2025","role":"Direct pooled result","what_it_shows":"In 36 publications, daily almonds lowered LDL by about 5 mg/dL, total cholesterol by about 6 mg/dL, and ApoB by about 4.5 mg/dL relative to controls across varying amounts.","authors":"Musa-Veloso K, Gauntlett C, Geronimo K, Vicente I, Ho SPL.","doi":"10.3390/nu17172791","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"41633054","title":"Progressive muscle relaxation technique improves sleep quality and mental health: A systematic review and meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/41633054/","year":"2026","role":"Pooled research","what_it_shows":"Another synthesis found better sleep quality after progressive muscle relaxation. Trial effects varied substantially, and the two reviews may include the same participants.","authors":"Donato KO, Falcão L, Nishizima A, Oliveira AS, Gonzalez JV, Ribeiro NN, Abbud C, Braga GA, Garrido G, Donato AO, Eckeli A, Cruz MME, Salles C.","doi":"10.1016/j.jpsychores.2026.112563","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"41922197","title":"The Optimal Dosage of Isometric Handgrip Exercise for Blood Pressure Reduction: Systematic Review and Meta-Analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/41922197/","year":"2026","role":"Direct pooled result","what_it_shows":"In 31 studies, systolic and diastolic pressure were lower by about 5.4 and 2.7 mmHg on average. Results differed markedly across studies. The four-set protocol is an evidence-informed example.","authors":"Lin CW, Jun IB, Igbo V, Babaniamansour A, Meng L, Lin CF, Jan YK.","doi":"10.1111/jch.70246","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42045803","title":"The Impact of Macronutrient Ordering on Postprandial Glycaemic Control in Diabetes: A Systematic Review.","url":"https://pubmed.ncbi.nlm.nih.gov/42045803/","year":"2026","role":"Pooled research","what_it_shows":"Studies in diabetes suggest smaller post-meal glucose excursions when carbohydrates come last. Heterogeneity and low certainty limit the inference.","authors":"McKenzie R, Sterling C, O'Hara H, Woodside J.","doi":"10.1002/edm2.70228","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42054579","title":"Single-session volunteering reduces loneliness in older adults: immediate and long-term effects.","url":"https://pubmed.ncbi.nlm.nih.gov/42054579/","year":"2026","role":"Direct, structured session","what_it_shows":"In a trial of 76 older adults, participants who helped nursing-home residents reported less loneliness within a day. The effect persisted at one month. The participants volunteered within a structured program.","authors":"Niu CC, Wu K, Yu J.","doi":"10.1093/geront/gnag083","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"42070794","title":"The Acute Effects of Interrupting Prolonged Sitting With Regular Activity Breaks on Postprandial Glucose and Insulin in Adults: A Systematic Review and Meta-Analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/42070794/","year":"2026","role":"Direct pooled result","what_it_shows":"Across 39 pooled studies, activity breaks reduced the post-meal glucose and insulin response. Walking showed the largest subgroup effects. The comparison between break frequencies does not establish a uniquely best schedule.","authors":"Gale JT, Martin H, Haszard JJ, Peddie MC.","doi":"10.1111/obr.70152","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42127076","title":"The impact of walking on creative thinking: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/42127076/","year":"2026","role":"Pooled research","what_it_shows":"Walking improved scores on idea-generation tasks, mostly in student samples. Results for convergent problem solving were uncertain.","authors":"Thabane A, Arora V, Boilard J, Sutoski A, Parpia S, Calic G, Busse JW, McKechnie T, Staibano P, Phillips M, Reiter-Palmon R, Bhandari M.","doi":"10.1371/journal.pone.0347878","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42405260","title":"The optimal dose of brisk walking for improving blood pressure in hypertensive patients: a systematic review and bayesian meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/42405260/","year":"2026","role":"Direct pooled result","what_it_shows":"Across 17 trials in adults with hypertension, both pressure measures fell. The full paper reports a pooled diastolic difference of −4.67 mmHg (95% CI −6.26 to −3.08). Its suggested optimal dose was modeled across trials.","authors":"Wang J, Ma L, Lin Q, Yin Y.","doi":"10.7717/peerj.21478","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Review"},{"source_id":"42545422","title":"The effect of water immersion thermotherapy on sleep quality: a systematic review and meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/42545422/","year":"2026","role":"Mixed findings","what_it_shows":"A newer synthesis of immersion trials found no significant improvement in sleep latency. It is included because it qualifies the earlier positive result.","authors":"Chen H, Gao S, Chen W, Gao B.","doi":"10.1007/s00484-026-03281-7","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42586449","title":"Effects of short-bout accumulated exercise on postprandial metabolism in adults: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/42586449/","year":"2026","role":"Supporting subgroup","what_it_shows":"Short bouts of accumulated activity reduced post-meal glucose and insulin versus sitting in 29 cohorts. Walking and shorter intervals appeared beneficial in exploratory subgroup analyses. Timing was not compared with a formal interaction test.","authors":"Gong J, Tan L, Wang Y, Yan J, Li Y.","doi":"10.1016/j.ctim.2026.103416","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42625730","title":"The effects of progressive muscle relaxation on sleep quality in adults: a systematic review and meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/42625730/","year":"2026","role":"Direct, clinical populations","what_it_shows":"Across 14 trials, self-rated sleep improved on average with relaxation. Trial effects varied widely. Table 1 includes a 30-minute twice-weekly program for eight weeks in people with lung cancer and a 40-minute three-times-weekly program for six weeks in women with breast cancer.","authors":"Li K, Chen S, Liu Y, Yu N.","doi":"10.3389/fpubh.2026.1906525","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Review"},{"source_id":"42627002","title":"Effects of breaking up prolonged sitting with light-intensity walking on postprandial glucose and lipid responses in sedentary adult men.","url":"https://pubmed.ncbi.nlm.nih.gov/42627002/","year":"2026","role":"Direct result and interval","what_it_shows":"Sixteen sedentary men completed five-hour test-drink conditions. Two-minute walks every 30 minutes reduced glucose exposure by 6.4% and insulin by 18.2% versus sitting. The three-hour app window is an adaptation.","authors":"Kim D, Kim E.","doi":"10.1080/02640414.2026.2722777","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"42743912","title":"Whole-grain consumption and cardiometabolic risk: a meta-analysis of randomized trials.","url":"https://pubmed.ncbi.nlm.nih.gov/42743912/","year":"2026","role":"Pooled research","what_it_shows":"The review separately reports a small decrease in total cholesterol and LDL per 48 g/day of whole grains. Certainty differs between those outcomes.","authors":"Naghshi S, Kiani S, Ostadrahimi A, Jayedi A, Mobasseri M, Arefhosseini S, Tutunchi H, Aune D.","doi":"10.1093/eurheartj/ehag519","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42947012","title":"Effect of resistance, balance, and aerobic training on strength, mobility, balance, and quality of life in older adults with sarcopenia: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/42947012/","year":"2026","role":"Direct, varied exercise programs","what_it_shows":"Twelve trials involving 652 adults with sarcopenia found gains in strength and walking speed with exercise. The study table includes resistance exercise twice weekly for 12 weeks and combined resistance and aerobic exercise three times weekly for 12 weeks.","authors":"Alsubaie SF, Nambi G.","doi":"10.1186/s12877-026-08020-6","review_basis":"Publication abstract and relevant full-text results or methods","publication_type":"Review"},{"source_id":"8824651","title":"Effects of psyllium therapy on stool characteristics, colon transit and anorectal function in chronic idiopathic constipation.","url":"https://pubmed.ncbi.nlm.nih.gov/8824651/","year":"1995","role":"Controlled trial","what_it_shows":"Adults with chronic constipation received psyllium or placebo for eight weeks. Stool frequency and consistency improved during psyllium treatment.","authors":"Ashraf W, Park F, Lof J, Quigley EM.","doi":"10.1111/j.1365-2036.1995.tb00433.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"9099655","title":"A clinical trial of the effects of dietary patterns on blood pressure. DASH Collaborative Research Group.","url":"https://pubmed.ncbi.nlm.nih.gov/9099655/","year":"1997","role":"Direct feeding trial","what_it_shows":"With sodium intake and body weight held constant, participants assigned the DASH combination diet saw greater reductions in systolic and diastolic pressure than those on the control diet.","authors":"Appel LJ, Moore TJ, Obarzanek E, Vollmer WM, Svetkey LP, Sacks FM, Bray GA, Vogt TM, Cutler JA, Windhauser MM, Lin PH, Karanja N.","doi":"10.1056/nejm199704173361601","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"FALL","title":"Environmental interventions for preventing falls in older people living in the community","url":"https://www.cochrane.org/evidence/CD013258_reducing-fall-hazards-within-environment","year":"2023","role":"Pooled research","what_it_shows":"Home assessment and actual hazard reduction reduced the rate of falls in higher-risk older adults living in the community. The effect differed by baseline risk.","authors":"","doi":"","review_basis":"Cochrane evidence summary","publication_type":"Review"},{"source_id":"NICE","title":"Urinary incontinence and pelvic organ prolapse in women: management, section 1.4","url":"https://www.nice.org.uk/guidance/ng123/chapter/recommendations","year":"2019","role":"Instruction guideline","what_it_shows":"Sections 1.4.4–1.4.5 recommend at least three months of supervised training for women with stress or mixed incontinence and at least eight contractions three times daily. This is guidance on the program rather than an independent effect estimate.","authors":"","doi":"","review_basis":"Guideline recommendations","publication_type":"Guideline"},{"source_id":"CDC-HANDWASH","title":"Hand Hygiene Frequently Asked Questions","url":"https://www.cdc.gov/clean-hands/faq/index.html","year":"2024","role":"Instruction source","what_it_shows":"CDC explains how to scrub all hand surfaces with soap for at least 20 seconds. This source supplies the technique.","authors":"","doi":"","review_basis":"Public guidance","publication_type":"Guideline"},{"source_id":"25574172","title":"Process Evaluation of Workplace Interventions with Physical Exercise to Reduce Musculoskeletal Disorders","url":"https://pubmed.ncbi.nlm.nih.gov/25574172/","year":"2014","role":"Instruction source","what_it_shows":"The companion report describes the same workplace intervention, including technique, progression, and sets for the two-minute and twelve-minute options.","authors":"","doi":"10.1155/2014/761363","review_basis":"Published exercise methods","publication_type":"Companion methods report"},{"source_id":"36715875","title":"After Dinner Rest a While, After Supper Walk a Mile? A Systematic Review with Meta-analysis on the Acute Postprandial Glycemic Response to Exercise Before and After Meal Ingestion in Healthy Subjects and Patients with Impaired Glucose Tolerance.","url":"https://pubmed.ncbi.nlm.nih.gov/36715875/","year":"2023","role":"Timing review","what_it_shows":"Acute studies generally favored exercising after eating for glucose. Exercise types and schedules varied. This review cannot establish the three-hour break schedule or the type 2 diabetes trial’s specific comparison.","authors":"Engeroff T, Groneberg DA, Wilke J.","doi":"10.1007/s40279-022-01808-7","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"19394473","title":"Almonds have a neutral effect on serum lipid profiles: a meta-analysis of randomized trials.","url":"https://pubmed.ncbi.nlm.nih.gov/19394473/","year":"2009","role":"Earlier, less precise review","what_it_shows":"An earlier synthesis found lower total cholesterol and a borderline LDL estimate whose interval reached zero. The later, larger synthesis provides the card’s modest LDL estimate. Their evidence bases can overlap.","authors":"Phung OJ, Makanji SS, White CM, Coleman CI.","doi":"10.1016/j.jada.2009.02.014","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"24235903","title":"Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed.","url":"https://pubmed.ncbi.nlm.nih.gov/24235903/","year":"2013","role":"Earlier controlled timing study","what_it_shows":"The study tested 400 mg at bedtime or three or six hours beforehand. Sleep was disrupted versus placebo even six hours before bed. The separate 12-hour finding comes from the later trial.","authors":"Drake C, Roehrs T, Shambroom J, Roth T.","doi":"10.5664/jcsm.3170","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"41212331","title":"Optimal resistance training prescriptions to improve muscle strength, physical function, and muscle mass in older adults diagnosed with sarcopenia: a systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/41212331/","year":"2025","role":"Resistance-specific evidence","what_it_shows":"Across 24 trials in 951 older adults with sarcopenia, resistance exercise improved several strength and function measures. Average grip-strength and gait-speed improvements fell below the review’s thresholds for clinically important change.","authors":"Yan R, Chen Y, Zhang R, He J, Lin W, Sun J, Li D.","doi":"10.1007/s40520-025-03235-w","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"34569129","title":"The effect of progressive muscle relaxation on sleep quality and fatigue in patients with rheumatoid arthritis: A randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/34569129/","year":"2023","role":"Primary trial in a clinical population","what_it_shows":"People with rheumatoid arthritis assigned to six weeks of progressive muscle relaxation reported better sleep quality than controls. This is a primary example within a field already covered by reviews.","authors":"Kılıç N, Parlar Kılıç S.","doi":"10.1111/ijn.13015","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"39879231","title":"Effects of cold-water immersion on health and wellbeing: A systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/39879231/","year":"2025","role":"Review reusing the sick-leave trial","what_it_shows":"The review’s 29% lower sickness absence figure comes from the original shower trial. It provides no second independent test of that result. Other cold-immersion protocols answer different questions.","authors":"Cain T, Brinsley J, Bennett H, Nelson M, Maher C, Singh B.","doi":"10.1371/journal.pone.0317615","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"41837403","title":"Effects of meal sequence intervention on blood glucose response in healthy adults: a systematic review.","url":"https://pubmed.ncbi.nlm.nih.gov/41837403/","year":"2026","role":"Healthy-adult evidence","what_it_shows":"A review in healthy adults found that most studies reported a smaller acute glucose excursion when vegetables, fruit or protein preceded carbohydrates. The short feeding studies used several meal sequences.","authors":"Kim J, Jang EH, Lee S.","doi":"10.7762/cnr.2025.0027","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"21147704","title":"Kiwifruit improves bowel function in patients with irritable bowel syndrome with constipation.","url":"https://pubmed.ncbi.nlm.nih.gov/21147704/","year":"2010","role":"Related bowel-frequency outcome","what_it_shows":"In adults with constipation-predominant IBS, bowel movement frequency increased after four weeks of kiwifruit. This study measured defecation frequency, a broader outcome than complete spontaneous bowel movements.","authors":"Chang CC, Lin YT, Lu YT, Liu YS, Liu JF.","doi":"","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"17634169","title":"Pinto bean consumption reduces biomarkers for heart disease risk.","url":"https://pubmed.ncbi.nlm.nih.gov/17634169/","year":"2007","role":"Independent trial with a different portion","what_it_shows":"Sixteen adults with mild insulin resistance tried half a cup of pinto beans, black-eyed peas or carrots for eight weeks per condition. LDL fell more with pinto beans than carrots. The one-cup canned-bean card uses a different trial and comparator.","authors":"Winham DM, Hutchins AM, Johnston CS.","doi":"10.1080/07315724.2007.10719607","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"1964898","title":"Can eating baked beans lower plasma cholesterol?","url":"https://pubmed.ncbi.nlm.nih.gov/1964898/","year":"1990","role":"Different bean preparation and outcome","what_it_shows":"In 20 men with mildly high cholesterol, canned baked beans versus canned spaghetti did not clearly lower plasma total cholesterol. The abstract does not give an LDL result. This limits generalization to other canned products.","authors":"Cobiac L, McArthur R, Nestel PJ.","doi":"","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"41578335","title":"Comparative effects of salt substitutes on blood pressure, cardiovascular events and mortality: a systematic review and network meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/41578335/","year":"2026","role":"Broader review with overlapping trials","what_it_shows":"Across 34 trials, some potassium-enriched formulations probably lowered systolic pressure. Cardiovascular event evidence was dominated by one large Chinese trial. Do not count the stroke trial twice.","authors":"Lai H, Nesrallah G, Guyatt GH, Vernooij RWM, Liu J, Zhao W, Hou L, Pan B, Huang J, Campbell NRC, Tian J, Yang K, Ge L, Johnston BC.","doi":"10.1186/s12916-026-04635-z","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"26269373","title":"Whole-grain and blood lipid changes in apparently healthy adults: a systematic review and meta-analysis of randomized controlled studies.","url":"https://pubmed.ncbi.nlm.nih.gov/26269373/","year":"2015","role":"Earlier pooled comparison","what_it_shows":"Whole-grain diets modestly lowered LDL and total cholesterol compared with non-whole-grain controls. The trial pool overlaps the period covered by the newer review.","authors":"Hollænder PL, Ross AB, Kristensen M.","doi":"10.3945/ajcn.115.109165","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"24749966","title":"Give your ideas some legs: the positive effect of walking on creative thinking.","url":"https://pubmed.ncbi.nlm.nih.gov/24749966/","year":"2014","role":"Primary experimental example","what_it_shows":"Four experiments compared walking and sitting on idea-generation tasks. Walking improved creative ideation during or shortly after activity. The result depended on the task.","authors":"Oppezzo M, Schwartz DL.","doi":"10.1037/a0036577","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"21387981","title":"The effect of different interdental cleaning devices on gingival bleeding.","url":"https://pubmed.ncbi.nlm.nih.gov/21387981/","year":"2011","role":"Different active comparator","what_it_shows":"After four weeks, two oral-irrigator groups had less gingival bleeding than a floss group with manual brushing. This does not duplicate the brushing-alone comparison.","authors":"Rosema NA, Hennequin-Hoenderdos NL, Berchier CE, Slot DE, Lyle DM, van der Weijden GA.","doi":"","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"31050195","title":"How effective is a powered toothbrush as compared to a manual toothbrush? A systematic review and meta-analysis of single brushing exercises.","url":"https://pubmed.ncbi.nlm.nih.gov/31050195/","year":"2020","role":"Overlapping review","what_it_shows":"An earlier review of single-brushing comparisons favored powered brushes over manual brushes for plaque removal. Trials can overlap with the later review.","authors":"Elkerbout TA, Slot DE, Rosema NAM, Van der Weijden GA.","doi":"10.1111/idh.12401","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"35389685","title":"Finding the \"sweet spot\" of smartphone use: Reduction or abstinence to increase well-being and healthy lifestyle?! An experimental intervention study.","url":"https://pubmed.ncbi.nlm.nih.gov/35389685/","year":"2023","role":"Different reduction target","what_it_shows":"An experiment reducing daily smartphone use by one hour found improvements in depressive symptoms and wellbeing. It used a relative reduction rather than a two-hour daily cap and does not validate the card’s insomnia score.","authors":"Brailovskaia J, Delveaux J, John J, Wicker V, Noveski A, Kim S, Schillack H, Margraf J.","doi":"10.1037/xap0000430","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"22451457","title":"Compression hosiery for occupational leg symptoms and leg volume: a randomized crossover trial in a cohort of hairdressers.","url":"https://pubmed.ncbi.nlm.nih.gov/22451457/","year":"2013","role":"Independent occupational crossover trial","what_it_shows":"In 108 hairdressers randomized to low-strength stockings and no-compression periods, lower-leg volume averaged 19 mL less with stockings. Symptoms also improved. This supports the swelling result in a second standing occupation.","authors":"Blazek C, Amsler F, Blaettler W, Keo HH, Baumgartner I, Willenberg T.","doi":"10.1258/phleb.2011.011108","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"36724699","title":"The effectiveness and equivalence of different versions of a brief online Best Possible Self (BPS) manipulation to temporary increase optimism and affect.","url":"https://pubmed.ncbi.nlm.nih.gov/36724699/","year":"2023","role":"Different practice duration","what_it_shows":"An online study compared versions of best-possible-self practice. Writing and imagery produced similar immediate improvements in optimism. It did not test how long the effect lasts.","authors":"Boselie JJLM, Vancleef LMG, van Hooren S, Peters ML.","doi":"10.1016/j.jbtep.2023.101837","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"29073407","title":"Restricted use of electronic media, sleep, performance, and mood in high school athletes--a randomized trial.","url":"https://pubmed.ncbi.nlm.nih.gov/29073407/","year":"2015","role":"Null result in a different population","what_it_shows":"A four-week restriction on electronic media after 10 pm did not improve sleep habits in high-school athletes who already slept well. The rule, population and baseline sleep differed from the card trial.","authors":"Harris A, Gundersen H, Mørk-Andreassen P, Thun E, Bjorvatn B, Pallesen S.","doi":"10.1016/j.sleh.2015.09.011","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"41668954","title":"Evening smartphone exposure impairs sleep quality and next-day performance in elite soccer players: a randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/41668954/","year":"2026","role":"Different exposure and comparison","what_it_shows":"Sixteen male elite soccer players compared two hours of pre-bed smartphone exposure with magazine reading. Sleep quality worsened during phone exposure. This does not establish the effects of a 30-minute cutoff on onset or bedtime arousal.","authors":"Dridi N, Souissi MA, Dridi R, Ceylan Hİ, Bragazzi NL, Salem A, Fekih S, Chtara M, Mkaouer B, Chtourou H, Dergaa I, Souissi N, Stefanica V, Żmijewski P, Morgans R.","doi":"10.5114/biolsport.2026.152348","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"23271615","title":"Intake of whole apples or clear apple juice has contrasting effects on plasma lipids in healthy volunteers.","url":"https://pubmed.ncbi.nlm.nih.gov/23271615/","year":"2013","role":"Related whole-fruit comparison","what_it_shows":"In 23 healthy volunteers, clear apple juice produced higher LDL than whole apples in a four-week crossover study. The whole-apple portion was 550 g daily. This differs from the card’s population and matched drink.","authors":"Ravn-Haren G, Dragsted LO, Buch-Andersen T, Jensen EN, Jensen RI, Németh-Balogh M, Paulovicsová B, Bergström A, Wilcks A, Licht TR, Markowski J, Bügel S.","doi":"10.1007/s00394-012-0489-z","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35449537","title":"Metabolic and Cardiovascular Benefits of Apple and Apple-Derived Products: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/35449537/","year":"2022","role":"Mixed pooled evidence","what_it_shows":"Across trials of apples and apple-derived products, pooled LDL was 2.8 mg/dL lower, with a 95% interval from 5.78 lower to 0.17 higher. The overall result was inconclusive and the review mixed product forms.","authors":"Kim SJ, Anh NH, Jung CW, Long NP, Park S, Cho YH, Yoon YC, Lee EG, Kim M, Son EY, Kim TH, Deng Y, Lim J, Kwon SW.","doi":"10.3389/fnut.2022.766155","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"39855242","title":"The effects of volunteering on loneliness among lonely older adults: the HEAL-HOA dual randomised controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/39855242/","year":"2025","role":"Independent longer volunteering program","what_it_shows":"Older volunteers in a structured telephone program reported less loneliness than controls after a sustained intervention. Most effects were not sustained at later follow-up. This does not test one nursing-home visit.","authors":"Yeung DY, Jiang D, Warner LM, Choi NG, Ho RTH, Kwok JYY, Chou KL.","doi":"10.1016/j.lanhl.2024.100664","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"41366295","title":"Psyllium supplementation and lipid profiles: systematic review and dose-response meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/41366295/","year":"2025","role":"Later lipid review","what_it_shows":"A later synthesis also found lower LDL and total cholesterol with psyllium. It may reuse trials in the earlier review and offers no additional evidence on constipation.","authors":"Gholami Z, Paknahad Z.","doi":"10.1186/s12263-025-00786-5","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"SPACED-2021","title":"A Meta-Analytic Review of the Benefit of Spacing out Retrieval Practice Episodes on Retention","url":"https://doi.org/10.1007/s10648-020-09572-8","year":"2021","role":"Review of combined practice","what_it_shows":"A review of 29 studies found better later retention when retrieval sessions were spaced rather than massed. This supports the combined learning approach. The specific two-week interval remains a trial example.","authors":"Latimier A, Peyre H, Ramus F.","doi":"10.1007/s10648-020-09572-8","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"11377600","title":"Frequency and prevention of symptomless deep-vein thrombosis in long-haul flights: a randomised trial.","url":"https://pubmed.ncbi.nlm.nih.gov/11377600/","year":"2001","role":"Primary flight trial","what_it_shows":"Screening after long-haul flights found symptomless calf clots in the no-stocking group and none in those wearing stockings. This early trial illustrates the review evidence and should not be counted on top of it.","authors":"Scurr JH, Machin SJ, Bailey-King S, Mackie IJ, McDonald S, Smith PD.","doi":"10.1016/s0140-6736(00)04645-6","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34408031","title":"Soap versus sanitiser for preventing the transmission of acute respiratory infections in the community: a systematic review with meta-analysis and dose-response analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/34408031/","year":"2021","role":"Mixed soap-specific findings","what_it_shows":"In one review, the three soap-and-water trials showed no clear respiratory infection reduction compared with control. Sanitiser results were clearer. The settings and number of soap trials differ from the larger handwashing-promotion review.","authors":"Hoffmann T, Bakhit M, Krzyzaniak N, Del Mar C, Scott AM, Glasziou P.","doi":"10.1136/bmjopen-2020-046175","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"26237305","title":"Efficacy of water preloading before main meals as a strategy for weight loss in primary care patients with obesity: RCT.","url":"https://pubmed.ncbi.nlm.nih.gov/26237305/","year":"2015","role":"Independent primary-care trial","what_it_shows":"Among 84 adults with obesity who received weight-management advice, 500 mL of water before main meals was associated with 1.3
