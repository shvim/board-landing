 kg more weight loss over 12 weeks than the attention control. The adjusted interval included no difference.","authors":"Parretti HM, Aveyard P, Blannin A, Clifford SJ, Coleman SJ, Roalfe A, Daley AJ.","doi":"10.1002/oby.21167","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35285920","title":"Association of Low- and No-Calorie Sweetened Beverages as a Replacement for Sugar-Sweetened Beverages With Body Weight and Cardiometabolic Risk: A Systematic Review and Meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/35285920/","year":"2022","role":"Water-specific subgroup","what_it_shows":"Three trials in this review evaluated water in place of sugary drinks. Evidence for body weight was rated low certainty. Findings for low-calorie sweetened drinks cannot be attributed to water.","authors":"McGlynn ND, Khan TA, Wang L, Zhang R, Chiavaroli L, Au-Yeung F, Lee JJ, Noronha JC, Comelli EM, Blanco Mejia S, Ahmed A, Malik VS, Hill JO, Leiter LA, Agarwal A, Jeppesen PB, Rahelic D, Kahleová H, Salas-Salvadó J, Kendall CWC, Sievenpiper JL.","doi":"10.1001/jamanetworkopen.2022.2092","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"37217328","title":"\"Three Good Things\" Digital Intervention Among Health Care Workers: A Randomized Controlled Trial.","url":"https://pubmed.ncbi.nlm.nih.gov/37217328/","year":"2023","role":"Different schedule and outcomes","what_it_shows":"Healthcare workers were prompted three times weekly to name good things. Positive affect showed a small improvement. Life satisfaction and depressive symptoms did not clearly differ between groups. This differs from nightly writing about why events happened.","authors":"Gold KJ, Dobson ML, Sen A.","doi":"10.1370/afm.2963","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"34962055","title":"App-based mindfulness meditation reduces perceived stress and improves self-regulation in working university students: A randomised controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/34962055/","year":"2022","role":"Independent student trial","what_it_shows":"Working university students assigned to an eight-week mindfulness app reported lower stress than wait-listed students. It supports perceived stress in a different sample.","authors":"Schulte-Frankenfeld PM, Trautwein FM.","doi":"10.1111/aphw.12328","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"30676671","title":"A randomized controlled trial of bedtime music for insomnia disorder.","url":"https://pubmed.ncbi.nlm.nih.gov/30676671/","year":"2019","role":"Mixed findings across sleep measures","what_it_shows":"In adults with insomnia, bedtime music improved perceived sleep on a secondary measure. The primary comparison on insomnia severity was inconclusive, and objective sleep measures showed no change.","authors":"Jespersen KV, Otto M, Kringelbach M, Van Someren E, Vuust P.","doi":"10.1111/jsr.12817","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"32660334","title":"Olfactory Training for Postviral Olfactory Dysfunction: Systematic Review and Meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/32660334/","year":"2021","role":"Postviral training review","what_it_shows":"Across four pooled studies, trained participants were more likely than controls to improve by a clinically important amount on an odor test. Training protocols varied.","authors":"Kattar N, Do TM, Unis GD, Migneron MR, Thomas AJ, McCoul ED.","doi":"10.1177/0194599820943550","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"42311058","title":"Olfactory Training for COVID-19-Related Olfactory Dysfunction: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/42311058/","year":"2026","role":"Post-COVID subgroup","what_it_shows":"Ten randomized trials in post-COVID smell loss found a small average improvement in objective smell scores. The finding applies to this postviral subgroup across varied protocols.","authors":"Albazee E, Aldawas G, Alzeeby M, Alebrahim AH, Alwael A.","doi":"10.4274/tao.2026.2026-3-27","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"31988085","title":"Increased fluid intake to prevent urinary tract infections: systematic review and meta-analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/31988085/","year":"2020","role":"Broader recurrence review","what_it_shows":"A review of increased fluid intake found fewer recurrent urinary infections overall. At 12 months the difference in the proportion with any recurrence was inconclusive. It pools different fluid interventions and does not independently verify the card’s exact water dose.","authors":"Scott AM, Clark J, Mar CD, Glasziou P.","doi":"10.3399/bjgp20x708125","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"37682412","title":"The Effect of Sitting Duration on Peripheral Blood Pressure Responses to Prolonged Sitting, With and Without Interruption: A Systematic Review and Meta-Analysis.","url":"https://pubmed.ncbi.nlm.nih.gov/37682412/","year":"2024","role":"Broader sitting-break evidence","what_it_shows":"Pooled laboratory studies found that interrupting prolonged sitting attenuated increases in blood pressure. The interventions varied. It does not establish mood changes or a particular walking schedule.","authors":"Adams NT, Paterson C, Poles J, Higgins S, Stoner L.","doi":"10.1007/s40279-023-01915-z","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"11322712","title":"The short-term benefits of brief and long naps following nocturnal sleep restriction.","url":"https://pubmed.ncbi.nlm.nih.gov/11322712/","year":"2001","role":"Related nap duration","what_it_shows":"After restricted sleep, ten minutes of afternoon sleep improved subjective alertness immediately. Some testing after a 30-minute nap showed early grogginess. Time asleep differs from a 15-minute opportunity to nap.","authors":"Tietzel AJ, Lack LC.","doi":"10.1093/sleep/24.3.293","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"35631184","title":"Effects of Oat Beta-Glucan Intake on Lipid Profiles in Hypercholesterolemic Adults: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.","url":"https://pubmed.ncbi.nlm.nih.gov/35631184/","year":"2022","role":"Overlapping lipid review","what_it_shows":"A review in adults with high cholesterol found lower average LDL with oat beta-glucan. Dose, product and study duration varied, and earlier reviews may include the same trials.","authors":"Yu J, Xia J, Yang C, Pan D, Xu D, Sun G, Xia H.","doi":"10.3390/nu14102043","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"34140663","title":"Isometric handgrip exercise training reduces resting systolic blood pressure but does not interfere with diastolic blood pressure and heart rate variability in hypertensive subjects: a systematic review and meta-analysis of randomized clinical trials.","url":"https://pubmed.ncbi.nlm.nih.gov/34140663/","year":"2021","role":"Endpoint-specific uncertainty","what_it_shows":"Across trials in people with treated hypertension, handgrip training lowered resting systolic pressure, while the diastolic estimate was imprecise. Keep the diastolic result qualified.","authors":"Almeida JPAS, Bessa M, Lopes LTP, Gonçalves A, Roever L, Zanetti HR.","doi":"10.1038/s41440-021-00681-7","review_basis":"Publication abstract","publication_type":"Review"},{"source_id":"37736087","title":"Tai Chi for fall prevention and balance improvement in older adults: a systematic review and meta-analysis of randomized controlled trials.","url":"https://pubmed.ncbi.nlm.nih.gov/37736087/","year":"2023","role":"Broader fall prevention evidence","what_it_shows":"A pooled analysis favored tai chi for preventing falls in older adults across differing programs. Total falls and balance outcomes cannot be substituted for repeat falling on the card.","authors":"Chen W, Li M, Li H, Lin Y, Feng Z.","doi":"10.3389/fpubh.2023.1236050","review_basis":"Publication abstract","publication_type":"Review"}]}</script>
<script type="application/json" id="legacy51">{"H001":{"t":"Walk at a brisk, sustainable pace","a":"5 minutes at a manageable pace, then increase days or minutes toward the weekly target.","mins":5},"H002":{"t":"Walk after main meals","a":"Walk 10 minutes after one meal. Add the other main meals to reproduce the comparison.","mins":10},"H003":{"t":"Break up seated time with short walks","a":"Walk two minutes after the next 20-minute seated stretch. Repeat during a prolonged seated period.","mins":2},"H004":{"t":"Build strength with progressive resistance","a":"Try a controlled set of chair squats and a row. Add other major muscle groups and increase resistance gradually.","mins":5},"H005":{"t":"Practice balance through stepping and weight shifts","a":"Try a supported narrow stance at a stable counter. Build a varied, progressively challenging balance routine.","mins":1},"H006":{"t":"Stretch the joint you want to move more freely","a":"Hold one comfortable stretch for 20 seconds, then build to the repeated dose for that joint.","mins":1},"H007":{"t":"Schedule aerobic sessions for type 2 diabetes","a":"Try five minutes of cycling or walking. Increase duration and weekly frequency toward the studied program.","mins":5},"H008":{"t":"Make oats a daily source of soluble fiber","a":"Add oats to one breakfast; use the label to build toward the studied daily beta-glucan dose.","mins":0},"H009":{"t":"Replace a side dish with beans, peas or lentils","a":"Replace part of a side with a few spoonfuls of cooked beans. Increase to the daily trial portion as tolerated.","mins":0},"H010":{"t":"Swap a snack for nuts","a":"Swap a snack for one small handful. Trial amounts varied; keep the swap consistent.","mins":0},"H011":{"t":"Use soy as a regular protein source","a":"Swap one usual protein serving for tofu. Check protein content if working toward 25 g/day.","mins":0},"H012":{"t":"Cook with unsaturated oil in place of butter","a":"Use unsaturated oil in place of butter for one regular dish; extend the substitution across meals.","mins":0},"H013":{"t":"Build meals around the DASH pattern","a":"Build one DASH-style lunch, then apply the pattern across meals.","mins":0},"H014":{"t":"Replace recurring high-sodium foods","a":"Choose a lower-sodium version of one regular food; repeat with other major sodium sources.","mins":0},"H015":{"t":"Use potassium-enriched cooking salt if eligible","a":"If eligible, replace ordinary cooking salt with the studied type of blend consistently.","mins":0},"H016":{"t":"Follow a Mediterranean-style eating pattern","a":"Build one regular meal around vegetables, pulses and olive oil; extend across meals and weeks.","mins":0},"H017":{"t":"Choose slower-digesting carbohydrate staples","a":"Replace one usual refined starch with lentils or barley. Repeat across meals.","mins":0},"H018":{"t":"Replace sugary drinks with calorie-free drinks","a":"Swap one daily sweet drink for a calorie-free choice; sustain the substitution.","mins":0},"H019":{"t":"Serve smaller portions of energy-dense foods","a":"Plate a smaller amount of one energy-dense item before the meal.","mins":0},"H020":{"t":"Lower a meal’s energy density","a":"Replace some of an energy-dense ingredient with vegetables in one usual meal.","mins":0},"H021":{"t":"Cut back on alcohol when intake is high","a":"If dependence is unlikely, replace a usual drink with an alcohol-free one. Anyone at withdrawal risk needs a medically supported plan.","mins":0},"H022":{"t":"Choose a plant-sterol-enriched food for elevated LDL","a":"Check the fortified food label and use the stated portion with meals to reach the studied daily dose.","mins":0},"H023":{"t":"Include enough protein while strength training","a":"Include protein in a meal that usually has little. Build an adequate daily total while training.","mins":0},"H024":{"t":"Eat two green kiwifruits for constipation","a":"Eat two green kiwifruits daily for four weeks if tolerated.","mins":0},"H025":{"t":"Give short sleep a longer window","a":"Protect 20–30 extra minutes in bed and increase the sleep opportunity if still short sleeping.","mins":30},"H026":{"t":"Move caffeine earlier","a":"Move one later caffeinated drink earlier or use decaf. Adjust timing to dose and sleep schedule.","mins":0},"H027":{"t":"Turn down bright evening light","a":"Dim a bright room after dinner. Extend the lower-light period toward the three-hour guidance where safe.","mins":0},"H028":{"t":"Take a brief early-afternoon nap after a short night","a":"Allow a brief early-afternoon nap; ten minutes of actual sleep requires additional time to fall asleep.","mins":10},"H029":{"t":"Use the bed as a cue for sleep","a":"Use the sleepy-to-bed rule and a quiet return-to-bed routine when safely mobile. Build consistency across nights.","mins":0},"H030":{"t":"Practice a guided mindfulness meditation","a":"Follow one short guided session; work toward 10 min/day over eight weeks if comfortable.","mins":3},"H031":{"t":"Practice progressive muscle relaxation","a":"Gently tense and release a few comfortable muscle groups. Extend to a complete sequence.","mins":2},"H032":{"t":"Write a short gratitude list","a":"Write three specific things you appreciated this week. Repeat weekly.","mins":3},"H033":{"t":"Take a genuine break between demanding tasks","a":"Disengage from work for a few minutes between tasks.","mins":3},"H034":{"t":"Do something kind for another person","a":"Do one small, welcome favor. Increase frequency if you enjoy it.","mins":null},"H035":{"t":"Practice recalling something you want to remember","a":"Recall something from yesterday without looking, check it and revisit it later.","mins":2},"H036":{"t":"Train with isometric wall sits","a":"If eligible, learn the position with a brief comfortable hold. Build only toward an individually appropriate workload.","mins":1},"H037":{"t":"Spread vigorous stair climbs across the day","a":"Go up one flight at an easy pace. Progress only if vigorous stairs are appropriate.","mins":1},"H038":{"t":"Practice short bouts of impact jumping for hip bone density","a":"If already suited to impact, learn a controlled landing before adding repetitions.","mins":1},"H039":{"t":"Eat the vegetable part of a mixed meal first","a":"At one mixed meal eat the vegetable portion first without changing the meal contents.","mins":0},"H040":{"t":"Finish dinner earlier when reflux wakes you","a":"Move one typically late dinner earlier, aiming for the guideline interval before lying down.","mins":0},"H041":{"t":"Start the night on the left side for reflux","a":"Settle on the left side at bedtime if comfortable.","mins":0},"H042":{"t":"Get outdoor daylight early in your waking day","a":"Take a regular morning activity outside. Exact effective minutes depend on the light and timing.","mins":5},"H043":{"t":"Keep sleep and wake times more consistent","a":"Pick a workable wake-time window that still allows enough sleep.","mins":0},"H044":{"t":"Take a warm bath before bedtime","a":"Take a comfortably warm bath for about ten minutes, ending one to two hours before bed.","mins":10},"H045":{"t":"Follow a slow, comfortable breathing pacer","a":"Try a comfortable minute of even breathing, then lengthen practice if pleasant.","mins":1},"H046":{"t":"Choose a green route for a walk","a":"Choose a green route for a walk you already plan to take.","mins":5},"H047":{"t":"Arrange recurring, listening-focused phone calls","a":"Agree on one listening-focused call and a realistic recurring schedule.","mins":5},"H048":{"t":"Sing regularly with a community choir","a":"Try a local choir rehearsal. Continued attendance resembles the studied program.","mins":null},"H049":{"t":"Wear blue-light-filtering glasses to improve sleep","a":"No app starter recommended.","mins":null},"H050":{"t":"Cold showers for fewer infections","a":"No app starter recommended for immune protection.","mins":null},"H051":{"t":"Commercial brain games to prevent dementia","a":"No app starter recommended for dementia prevention.","mins":null},"H052":{"t":"Use calibrated isometric handgrip training","a":"Learn the grip and calibration before attempting a full session. A casual squeeze ball has no verified equivalent dose.","mins":1},"H053":{"t":"Alternate fast and easy walking intervals","a":"Try one easy/fast pair. Build the number of pairs before seeking higher intensity.","mins":6},"H054":{"t":"Raise an elastic band for recurrent desk-related neck and shoulder pain","a":"Learn a few light, comfortable repetitions. Increase toward the time and resistance used in the trial.","mins":1},"H055":{"t":"Practice a four-minute home strength circuit","a":"Learn one chair rise and a wall push-up with a stable support. Add the row and step, then progress toward the complete circuit.","mins":2},"H056":{"t":"Train calf push-off with supported heel raises","a":"Do a few slow supported raises to learn the movement. Progress only if comfortable before introducing the faster rise.","mins":1},"H057":{"t":"Use a foam roller for short-term range of motion","a":"Try a gentle 30-second calf roll. Stop if it causes sharp pain or numbness.","mins":1},"H058":{"t":"Practice a learned tai chi sequence","a":"Learn one supported weight transfer, then work toward the whole sequence and a regular class or home session.","mins":5},"H059":{"t":"Interrupt sitting with a short sequence of resistance movements","a":"Try the three-minute sequence once. Repeat across the seated period to match the studied schedule.","mins":3},"H060":{"t":"Listen to music at bedtime for sleep complaints","a":"Listen at a comfortable volume for 25–30 minutes on successive evenings.","mins":25},"H061":{"t":"Write tomorrow’s to-do list at bedtime","a":"Spend five minutes writing tomorrow’s tasks on paper before turning out the light.","mins":5},"H062":{"t":"Wind down with a printed book","a":"Read for 15 minutes before sleep on each of seven nights.","mins":15},"H063":{"t":"Pause quietly after learning","a":"After learning something you want to remember, spend ten quiet minutes before switching tasks.","mins":10},"H064":{"t":"Put a list along a familiar imaginary route","a":"Place three items at three familiar landmarks and retrieve them later. Progress to longer lists.","mins":3},"H065":{"t":"Mix similar examples while learning a distinction","a":"Mix examples from two or three similar categories in one practice session and identify each before checking it.","mins":5},"H066":{"t":"Sketch a concrete item you want to remember","a":"Sketch one object on a list, then later try recalling it without the sketch.","mins":1},"H067":{"t":"Learn an instrument through regular practice","a":"Practice a short phrase slowly for ten minutes. Build a regular lesson and practice schedule if learning the instrument matters to you.","mins":10},"H068":{"t":"Reflect on an upsetting moment from an observer’s perspective","a":"Describe a minor setback from an outside observer’s perspective for a brief reflection.","mins":2},"H069":{"t":"Imagine a realistically favorable future","a":"Choose a plausible future scene, then practice the five-minute imagery exercise daily for two weeks.","mins":5},"H070":{"t":"Savor one pleasant everyday experience","a":"Spend two minutes attending to one pleasant event; treat this as an adaptation of the studied exercises.","mins":2},"H071":{"t":"Practice loving-kindness meditation","a":"Follow a short goodwill practice directed toward an easy, familiar person. Expand gradually if comfortable.","mins":3},"H072":{"t":"Write privately about an emotionally important event","a":"Try writing for five minutes about a manageable event. Extend only if it feels tolerable.","mins":5},"H073":{"t":"Have a brief, welcome conversation with someone new","a":"Try one brief, low-pressure conversation in a setting where talking is welcome.","mins":null},"H074":{"t":"Make time earlier in the evening for constructive worry","a":"Spend five minutes pairing one manageable concern with a possible next step.","mins":5},"H075":{"t":"Practice diaphragmatic breathing","a":"Use a hand on the abdomen to learn a gentle, unforced breath for two minutes. Avoid deliberately taking enormous breaths or forcing a four-breath pace.","mins":2},"H076":{"t":"Practice repeated double-inhale sighs","a":"Learn one comfortable cycle while seated. A single physiological sigh is a familiarization step; repeated-practice mood data cannot be assigned to it.","mins":1},"H077":{"t":"Use an equal-phase box breathing pattern","a":"Learn the four phases seated and use an easy count. Skip holds if uncomfortable; omitting them changes the protocol.","mins":1},"H078":{"t":"Lengthen the exhale relative to the inhale","a":"Try one comfortable minute. Equal-rate, longer-exhale and double-inhale sighing protocols are distinct.","mins":1},"H079":{"t":"Practice breathing at an individually measured resonance frequency","a":"Learn relaxed breathing for a few minutes. A fixed-rate animation without measurement cannot identify an individual resonance frequency.","mins":null},"H080":{"t":"Hum gently on the exhale","a":"No app recommendation for sustained BP or autonomic health. Ordinary humming remains an optional activity.","mins":null},"H081":{"t":"Train the muscles of inhalation against resistance","a":"Learn device use and obtain an appropriate calibration before training. Unloaded deep breathing does not reproduce the intervention.","mins":null},"H082":{"t":"Use plain psyllium fiber with adequate fluid","a":"Start with a smaller labeled serving and a full glass of water (about 240 mL). Build gradually toward a tolerated daily intake.","mins":2},"H083":{"t":"Choose live-culture yogurt for lactose digestion","a":"Choose live-culture yogurt for one usual dairy serving. If viable counts are unlisted, exact matching to the EFSA condition is uncertain.","mins":0},"H084":{"t":"Eat prunes for infrequent bowel movements","a":"Start with a smaller tolerated portion, then increase gradually if needed. A few prunes have no verified equivalent effect.","mins":0},"H085":{"t":"Elevate the head of the bed for nighttime reflux","a":"Use a stable wedge or appropriate bed risers on a reflux-prone night, then repeat if comfortable.","mins":null},"H086":{"t":"Slow the pace of a usual meal","a":"Choose one unhurried meal. Set your utensil down between some bites instead of targeting a stopwatch or compulsory chew count.","mins":0},"H087":{"t":"Add ground flaxseed to a regular meal","a":"Add a small amount of ground flaxseed to one food, increase as tolerated and keep adequate fluid intake. One teaspoon is an introduction.","mins":0},"H088":{"t":"Drink a measured nitrate-rich beetroot juice","a":"If appropriate, try a small tolerated serving. The nitrate amount and sustained schedule determine whether it resembles a tested product.","mins":0},"H089":{"t":"Drink more water when recurrent cystitis coincides with low fluid intake","a":"Add one glass at a regular meal if eligible. The demonstrated result used a much larger sustained increase.","mins":0},"H090":{"t":"Use raw garlic specifically to lower LDL","a":"Use garlic for flavor if desired. No cholesterol-lowering starter is supported for a daily clove.","mins":null},"H091":{"t":"Practice adaptive visual processing speed","a":"Try a demonstration of the dual task. An app-made imitation has no validated dose or long-term effect.","mins":null},"H092":{"t":"Use cocoa with a measured flavanol content","a":"Check the flavanol dose on a product already used at home. A square of unspecified dark chocolate is an unverified substitute.","mins":0},"I001":{"t":"Aged garlic extract (supplement)","a":"Daily garlic supplement at labeled dose, or regular culinary garlic as a weaker alternative.","mins":null},"I002":{"t":"Hibiscus (sour) tea","a":"1-2 cups of hibiscus tea daily.","mins":null},"I003":{"t":"Listening to calming music","a":"10 minutes of a favorite calming playlist.","mins":null},"I004":{"t":"Self-compassion exercises","a":"A 2-minute 'self-compassion break' when stressed.","mins":null},"I005":{"t":"10-minute stair walk for energy","a":"Exactly the studied dose.","mins":null},"I006":{"t":"Steady hydration through the day","a":"Keep a water bottle at your desk and refill it twice.","mins":null},"I007":{"t":"Sit-to-stand practice","a":"2 sets of 5 sit-to-stands from a firm chair, most days.","mins":null},"I008":{"t":"5-minute home strength circuit","a":"One round: 8-12 wall push-ups, 10-15 calf raises, 8-12 chair squats.","mins":null},"I009":{"t":"Vigorous 'exercise snacks' built into the day","a":"One deliberate vigorous 1-2 minute burst daily - e.g., fast stairs.","mins":null},"I010":{"t":"Eat vegetables and protein before carbs","a":"Start dinner with the salad/vegetables and protein; finish with the starch.","mins":null},"I011":{"t":"Protein-rich breakfast","a":"Add eggs or Greek yogurt to breakfast daily.","mins":null},"I012":{"t":"Earlier eating window","a":"Finish eating by 7 pm on most days.","mins":null},"I013":{"t":"Humming breath (Bhramari)","a":"5 slow humming exhales whenever stressed, or 5 minutes daily.","mins":null},"I014":{"t":"Alternate-nostril breathing (Nadi Shodhana)","a":"2-3 minutes of alternate-nostril breathing daily.","mins":null},"I015":{"t":"Aerobic exercise for the brain","a":"Add one extra 20-30 minute brisk walk per week, building up.","mins":null},"I016":{"t":"Learn a demanding new skill","a":"Pick one genuinely new skill and schedule 3-5 hours a week for 3 months.","mins":null},"I017":{"t":"Structured cognitive training","a":"Not a first-line habit; consider only with realistic expectations (see notes).","mins":null},"I018":{"t":"Fermented food every day","a":"One serving daily (a pot of live yogurt or a forkful of kimchi).","mins":null},"I019":{"t":"Abdominal massage for constipation","a":"5 minutes of clockwise abdominal massage after dinner.","mins":null},"I020":{"t":"Footstool toilet posture","a":"Use any stable 15-20 cm footstool.","mins":null},"I021":{"t":"Regular sauna bathing","a":"One or two 15-minute sauna sessions a week.","mins":null},"I022":{"t":"Cold-shower finisher","a":"30 seconds cold at the end of your shower.","mins":null},"I023":{"t":"A daily step target around 7,000-8,000","a":"Find your current average, then add 500-1,000 steps.","mins":null},"I024":{"t":"No alcohol within 3 hours of bed","a":"Move the last drink to dinner, not bedtime.","mins":null},"I025":{"t":"Evening exercise (myth-check: it's fine)","a":"Keep your evening workout; just leave ~1 hour before lights-out.","mins":null},"I026":{"t":"Vinegar with a starchy meal","a":"Dressing with vinegar on the salad that starts the meal.","mins":null},"I027":{"t":"Brief impact loading for bones","a":"20-30 heel drops after your walk.","mins":null},"I028":{"t":"Green tea (L-theanine + caffeine)","a":"One cup of green tea mid-morning.","mins":null},"I029":{"t":"Scheduled 'worry time'","a":"Set a daily 15-minute 'worry appointment' and one postponed-worry note.","mins":null},"I030":{"t":"Deliberate pleasant-activity scheduling","a":"Plan 2-3 concrete pleasant activities into this week.","mins":null},"I031":{"t":"Daily multivitamin (older adults)","a":"Standard once-daily multivitamin if diet is inconsistent.","mins":null},"I032":{"t":"Weighted blanket for insomnia","a":"Try a weighted blanket of roughly 10% of your body weight for a few nights.","mins":null},"I033":{"t":"Enteric-coated peppermint oil for IBS","a":"If you have IBS-type symptoms, discuss trying enteric-coated peppermint oil capsules with a pharmacist or clinician.","mins":null},"I034":{"t":"Ginger for pregnancy nausea","a":"Sip ginger tea or take a small ginger dose (under 1500 mg/day total) when nausea is worst.","mins":null},"I035":{"t":"Foam rolling for flexibility","a":"Roll each tight muscle group slowly for about a minute, a few times a week, after a walk or workout.","mins":null},"I036":{"t":"Morning bright light for low mood","a":"Get outside within an hour of waking for 10-20 minutes of daylight; if low mood persists, consider a certified 10,000-lux light box on dark mornings.","mins":null},"I037":{"t":"Dance classes for brain health","a":"Join a weekly beginner dance class or follow a structured dance video at home.","mins":null},"I038":{"t":"Home blood pressure self-monitoring","a":"Buy a validated upper-arm cuff and take a seated reading morning and evening for a week each month; share the log with your clinician.","mins":null},"I039":{"t":"Yoga practice","a":"Follow a 20-minute beginner yoga video once or twice a week.","mins":null},"I040":{"t":"Active video games for body and brain","a":"Swap one sedentary screen session a week for an active game (VR fitness, dance, or motion-controlled sports).","mins":null},"I041":{"t":"Tart cherry juice for sleep","a":"Try a small glass of tart cherry juice with dinner for two weeks and see if your sleep changes.","mins":null},"I042":{"t":"Curcumin for knee osteoarthritis","a":"If knee osteoarthritis limits you, ask your clinician whether a trial of curcumin makes sense alongside exercise.","mins":null},"I043":{"t":"Melatonin for jet lag","a":"For trips across 5+ time zones, take 0.5-3 mg melatonin at your destination's bedtime for the first few nights.","mins":null}}</script>

const midCase = s => !s ? "" : /^[A-Z][a-z]/.test(s) && !/^[A-Z][a-z]+[A-Z]/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;
/* one plain benefit line for cards and headers: names what was studied, never promises an effect.
   Uses the preferred summary; prefers an outcome tied to the person's goal, then the stronger grade. */
function mainFinding(h) {
  if (h.personal) return null;
  const goal = st.profile.goal;
  const pick = v => v.f.map(id => HM.CAT.findings[id]).filter(f => f && f.gr !== "X")
    .sort((a, b) => (HM.relevant(b, goal) - HM.relevant(a, goal)) || (HM.GRADE_RANK[b.gr] - HM.GRADE_RANK[a.gr]))[0];
  return pick(HM.variant(h)) || h.v.map(pick).filter(Boolean)[0] || null;
}
function benefitOf(h) { const f = mainFinding(h); return f ? `For ${midCase(f.out)}` : ""; }

/* ============ explore ============ */
const COLLS = [["all", "All"], ["core", "Core"], ["promising", "Promising"], ["targeted", "Targeted"], ["context", "Research context"], ["aging", "Healthy aging"], ["beginner", "Beginner-friendly"], ["personal", "Personal habits"], ["saved", "Saved"], ["recent", "Recent"]];
const START_HERE = ["three-good-things", "caffeine", "stairs", "mindfulness", "kiwi", "music"];   // waist-up portraits so every tile matches
function exploreResults() {
  const E = st.ui.explore, f = E.f || {}, q = (E.q || "").trim().toLowerCase();
  const pool = HM.CAT.habits.concat(HM.PERSONAL);
  let r = pool.filter(h => {
    const pl = h.personal ? "personal" : h.pl;
    switch (E.coll) {
      case "core": if (pl !== "core_candidate") return false; break;
      case "promising": if (pl !== "promising_research") return false; break;
      case "targeted": if (pl !== "targeted_review") return false; break;
      case "context": if (pl !== "reference_only") return false; break;
      case "aging": if (!(h.sc || []).includes("healthy-aging")) return false; break;
      case "beginner": if (h.personal || pl !== "core_candidate" || h.d.mins == null || h.d.mins > 5 || !h.d.noEq) return false; break;
      case "personal": if (!h.personal) return false; break;
      case "saved": if (!st.saved.includes(h.id)) return false; break;
      case "recent": if (!st.recent.includes(h.id)) return false; break;
    }
    if (E.goals?.length && !E.goals.some(g => (h.g || []).includes(g))) return false;
    const m = h.personal ? h.mins : h.d.mins;
    if (f.time && (m == null || m > f.time)) return false;
    if (f.noEq && !(h.personal || h.d.noEq)) return false;
    if (f.seated && !(h.d?.seated)) return false;
    if (f.effort && (h.personal || h.d.effort !== f.effort)) return false;
    if (f.freq && (h.personal ? "daily" : h.d.freq) !== f.freq) return false;
    if (f.grade) { const bf = HM.bestFinding(h, st.profile.goal, st.profile.refine); if (!bf || !["A", "B"].includes(bf.gr)) return false; }
    if (q) {
      const hay = [h.t, h.n, ...(h.v || []).map(v => v.name), ...(h.g || []).map(goalLabel), ...(h.v || []).flatMap(v => v.cats || []),
        ...(h.v || []).flatMap(v => v.f.map(id => HM.CAT.findings[id]?.out || ""))].join(" ").toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const goal = st.profile.goal;
  const ev = h => { const b = HM.bestFinding(h, E.goals?.[0] || goal, st.profile.refine); return b ? HM.GRADE_RANK[b.gr] : -1; };
  const fit = h => (h.personal ? 0 : (h.el.auto ? 3 : h.pl === "core_candidate" ? 2 : h.pl === "promising_research" ? 1 : 0)) + (goal && (h.g || []).includes(goal) ? 2 : 0) + Math.max(0, ev(h));
  if (E.sort === "evidence") r.sort((a, b) => ev(b) - ev(a) || a.t.localeCompare(b.t));
  else if (E.sort === "time") r.sort((a, b) => { const ma = a.personal ? a.mins : a.d.mins, mb = b.personal ? b.mins : b.d.mins; return (ma ?? 999) - (mb ?? 999) || a.t.localeCompare(b.t); });
  else r.sort((a, b) => fit(b) - fit(a) || a.t.localeCompare(b.t));
  return r;
}

function weekBlock() {

  return HM.range(ws, HM.addDays(ws, 6)).map((d, i) => {
    const os = HM.occOn(st, d); const done = os.filter(o => o.status === "done");
    const inner = done.length ? done.slice(0, 3).map(o => th(HM.art(H(o.hid)), HM.field(H(o.hid)))).join("") :
      os.length && os.every(o => o.status === "rest" || o.status === "paused") ? '<div class="restd" title="Rest">&ndash;</div>' : '<div class="empty"></div>';
    return `<div class="d${d === st.today ? " now" : ""}"><small>${"MTWTFSS"[i]}</small><div class="stack">${inner}</div></div>`;
  }).join("");
}
function series(metric, from) {
  if (["mood", "energy", "stress", "fatigue", "sleepq"].includes(metric))
    return st.checkins.filter(c => c[metric] && c.ts.slice(0, 10) >= from).map(c => ({ d: c.ts.slice(0, 10), t: c.ts, v: c[metric], id: c.id, kind: "c", note: c.note, src: c.sample ? "Sample check-in" : "Check-in" }));
  const type = metric.startsWith("bp") ? "bp" : metric;
  return st.meas.filter(m => m.type === type && m.ts.slice(0, 10) >= from).map(m => ({ d: m.ts.slice(0, 10), t: m.ts, v: metric === "bpd" ? m.v.dia : metric === "bp" ? m.v.sys : m.v.v, id: m.id, kind: "m", note: m.note, src: `${m.source}${m.method ? " · " + m.method : ""}`, raw: m }));
}
const METRICS = { mood: "Mood", energy: "Energy", stress: "Stress", fatigue: "Tiredness", sleepq: "Sleep quality", sleep: "Sleep duration", bp: "Blood pressure", rhr: "Resting heart rate", hrv: "Heart rate variability", steps: "Steps" };
function spark(metric) {
  const from = HM.addDays(st.today, -27); const pts = series(metric, from);
  if (pts.length < 2) return `<div class="spark empty">Not enough entries yet</div>`;
  const dates = HM.range(from, st.today);
  const vals = pts.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const x = d => (HM.diff(from, d) / 27) * 100, y = v => 28 - ((v - lo) / (hi - lo)) * 24;
  let path = "", dots = "", prev = null;
  for (const p of pts.sort((a, b) => a.d.localeCompare(b.d))) { path += (prev && HM.diff(prev.d, p.d) <= 2 ? "L" : "M") + x(p.d).toFixed(1) + " " + y(p.v).toFixed(1) + " "; dots += `M${x(p.d).toFixed(1)} ${y(p.v).toFixed(1)}h0`; prev = p; }
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="${path}"/><path class="dots" d="${dots}"/></svg>`;
}

SCREENS.trend = p => {
  const m = p.m || "mood"; const range = F.range || 28; const from = HM.addDays(st.today, -(range - 1));
  const dates = HM.range(from, st.today);
  let chart = "", list = [], unit = "", summary = "";
  const tabsR = `<div class="seg" role="radiogroup" aria-label="Range">${[[14, "2 weeks"], [28, "4 weeks"], [56, "8 weeks"]].map(([v, l]) => `<button type="button" role="radio" aria-checked="${range === v}" class="${range === v ? "on" : ""}" data-act="range" data-v="${v}">${l}</button>`).join("")}</div>`;
  if (["mood", "energy", "stress", "fatigue", "sleepq"].includes(m)) {
    const pts = series(m, from); list = pts;
    const ticks = m === "mood" ? HM.MOODS.map((l, i) => ({ v: i + 1, l })) : [1, 2, 3, 4, 5].map(v => ({ v, l: v === 1 ? `1 ${HM.SCALES[m].ends[0]}`.slice(0, 12) : v === 5 ? `5 ${HM.SCALES[m].ends[1]}`.slice(0, 12) : String(v) }));
    chart = pts.length ? lineChart({ dates, series: [{ pts, cls: "s1" }], yMin: 0.5, yMax: 5.5, ticks, ordinal: true }) : "";
    const cnt = {}; pts.forEach(x => cnt[x.v] = (cnt[x.v] || 0) + 1); const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    summary = pts.length ? `${pts.length} entries on ${new Set(pts.map(x => x.d)).size} of ${range} days. Most often: ${m === "mood" ? HM.MOODS[top[0] - 1] : top[0] + " of 5"}. Days without an entry are left blank.` : "";
    unit = m === "mood" ? "" : "1–5";

    const s = series("bp", from), d2 = series("bpd", from); list = s.map((x, i) => ({ ...x, v: `${x.raw.v.sys}/${x.raw.v.dia}` }));
    const all = s.map(x => x.v).concat(d2.map(x => x.v)); const lo = Math.floor((Math.min(...all, 70) - 5) / 10) * 10, hi = Math.ceil((Math.max(...all, 140) + 5) / 10) * 10;
    chart = s.length ? lineChart({ dates, series: [{ pts: s, cls: "s1" }, { pts: d2, cls: "s2", mark: "sq", dash: true }], yMin: lo, yMax: hi, ticks: [lo, (lo + hi) / 2, hi].map(v => ({ v })), avg: true }) : "";
    unit = "mmHg";
    summary = s.length ? `${s.length} readings. Systolic ${Math.min(...s.map(x => x.v))}–${Math.max(...s.map(x => x.v))}, diastolic ${Math.min(...d2.map(x => x.v))}–${Math.max(...d2.map(x => x.v))} mmHg. Dashed bars are weekly averages, not readings.` : "";
  } else {
    let pts = series(m, from);
    const methods = m === "hrv" ? [...new Set(pts.map(x => x.raw.method))] : [];
    const meth = m === "hrv" ? (F.hrvm && methods.includes(F.hrvm) ? F.hrvm : methods[0]) : null;
    if (meth) pts = pts.filter(x => x.raw.method === meth);
    list = pts; unit = HM.MEAS[m].unit;
    const vs = pts.map(x => x.v); const lo = vs.length ? Math.min(...vs) : 0, hi = vs.length ? Math.max(...vs) : 1; const pad = (hi - lo) * 0.2 || 1;
    chart = pts.length ? lineChart({ dates, series: [{ pts, cls: "s1" }], yMin: Math.max(0, lo - pad), yMax: hi + pad, ticks: [lo, (lo + hi) / 2, hi].map(v => ({ v: v, l: (Math.round(v * 10) / 10).toString() })), avg: true }) : "";
    summary = pts.length ? `${pts.length} entries, ${Math.min(...vs)}–${Math.max(...vs)} ${unit}.${meth ? ` Method: ${meth}. Other methods are kept separate.` : ""} Dashed bars are weekly averages.` : "";
    if (methods.length > 1) summary += `</p><div class="chips">${methods.map(x => `<button type="button" class="chip${x === meth ? " on" : ""}" data-act="hrvm" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div><p>`;
  }
  const table = list.slice().sort((a, b) => b.t.localeCompare(a.t)).map(x => `<div class="vrow"><span>${esc(HM.fmtDate(x.d))}<small>${esc(x.t.slice(11, 16))} · ${esc(x.src)}</small></span><b>${esc(m === "mood" ? HM.MOODS[x.v - 1] : x.v)}${unit && m !== "mood" ? ` <small>${esc(unit)}</small>` : ""}</b>
    <button type="button" class="mini icon" data-act="${x.kind === "c" ? "ci-edit" : "meas-edit"}" data-id="${x.id}" aria-label="Edit entry">${ico("edit")}</button></div>${x.note ? `<p class="fine vnote">${esc(x.note)}</p>` : ""}`).join("");
  return { cls: "s-list", html: `${backBtn()}<div class="top"><h2 class="disp">${esc(METRICS[m])}</h2>${sampleTag()}</div><div class="pad">${tabsR}
    <div class="card2 chartc">${chart || `<div class="nodata">${ico("chart", "big")}<p><b>No entries in this range</b></p><p class="fine">Add one and it will appear here.</p></div>`}
    ${m === "bp" && chart ? '<div class="legend"><span><i class="l1"></i>Systolic</span><span><i class="l2"></i>Diastolic</span></div>' : ""}</div>
    <p class="fine summary">${summary}</p>
    <button type="button" class="btn ghost-btn" data-act="${["mood", "energy", "stress", "fatigue", "sleepq"].includes(m) ? "go" : "meas-new"}" data-r="checkin" data-t="${m}">${ico("plus")} Add an entry</button>
    <div class="sec-h"><h3>Values</h3></div>${table || '<p class="fine">No values yet.</p>'}</div>` };
};

SCREENS.history = () => {
  const pid = F.histPid || "";
  const start = HM.weekStart(HM.addDays(st.today, -49)); const days = HM.range(start, HM.addDays(HM.weekStart(st.today), 6));
  const LBL = { done: "Done", partial: "Some done", missed: "Missed or skipped", rest: "Rest or paused", none: "Nothing scheduled", future: "Upcoming" };
  const cells = days.map(d => { const s = HM.dayState(st, d, pid || null); const n = HM.occOn(st, d).filter(o => !pid || o.pid === pid);
    return `<button type="button" class="hc h-${s}${d === st.today ? " now" : ""}" data-act="day" data-d="${d}" aria-label="${esc(HM.fmtDate(d))}: ${LBL[s]}${n.length ? `, ${n.filter(o => o.status === "done").length} of ${n.length}` : ""}">${s === "done" ? ico("check") : s === "missed" ? '<i class="xm"></i>' : ""}</button>`; }).join("");
  const ad = HM.adherence(st, HM.addDays(st.today, -28), HM.addDays(st.today, -1), pid || null);
  const live = st.plan.filter(p => !p.removed || HM.occList(st).some(o => o.pid === p.pid && o.status === "done"));
  return { cls: "s-list", html: `${backBtn()}<div class="top"><h2 class="disp">Habit history</h2>${sampleTag()}</div><div class="pad">
    <div class="hscroll">${[["", "All habits"]].concat(live.map(p => [p.pid, shortT(H(p.hid))])).map(([v, l]) => `<button type="button" class="chip${pid === v ? " on" : ""}" aria-pressed="${pid === v}" data-act="histpid" data-v="${v}">${esc(l)}</button>`).join("")}</div>
    <div class="card2"><div class="hgrid head">${"MTWTFSS".split("").map(c => `<span>${c}</span>`).join("")}</div><div class="hgrid">${cells}</div>
    <div class="legend">${["done", "partial", "missed", "rest", "none", "future"].map(k => `<span><i class="hc h-${k} sw"></i>${LBL[k]}</span>`).join("")}</div></div>
    <div class="card2"><div class="eyebrow">Last 4 weeks, finished days only</div><div class="big left"><b>${ad.den ? Math.round(ad.done / ad.den * 100) : "–"}${ad.den ? "%" : ""}</b><span>${ad.done} of ${ad.den} scheduled done</span></div>
    <p class="fine">${ad.skipped} skipped, ${ad.missed} missed. Rest days, paused days and upcoming days aren&rsquo;t counted. Tap a day to see or correct it.</p></div></div>` };
};
function openDay(d) {
  const os = HM.occOn(st, d), cs = st.checkins.filter(c => c.ts.startsWith(d)), ms = st.meas.filter(m => m.ts.startsWith(d));
  const canFix = d < st.today && HM.diff(d, st.today) <= 7;
  const ST = { done: "Done", skipped: "Skipped", rest: "Rest", paused: "Paused", due: d < st.today ? "Missed" : "Scheduled" };
  sheet(HM.fmtDate(d), `${os.length ? os.map(o => `<div class="vrow"><span>${esc(H(o.hid).t)}<small>${ST[o.status] || o.status}${o.doneAt ? " · " + esc(o.doneAt.slice(11, 16)) : ""}${o.date !== o.orig ? ` · moved from ${esc(HM.fmtShort(o.orig))}` : ""}</small></span>
      ${canFix && o.status === "due" ? `<button type="button" class="mini" data-act="late-done" data-oid="${esc(o.oid)}">Mark done</button>` : ""}${(canFix || d === st.today) && o.status === "done" ? `<button type="button" class="mini" data-act="late-undo" data-oid="${esc(o.oid)}">Undo</button>` : ""}</div>`).join("") : '<p class="fine">Nothing was scheduled.</p>'}
    ${cs.length ? `<div class="sec-h"><h3>Check-ins</h3></div>${cs.map(c => `<div class="vrow"><span>${c.mood ? esc(HM.MOODS[c.mood - 1]) : "No mood"}<small>${esc(c.ts.slice(11, 16))}${c.energy ? ` · energy ${c.energy}/5` : ""}${c.stress ? ` · stress ${c.stress}/5` : ""}</small></span></div>`).join("")}` : ""}
    ${ms.length ? `<div class="sec-h"><h3>Measurements</h3></div>${ms.map(m => `<div class="vrow"><span>${esc(HM.MEAS[m.type].label)}<small>${esc(m.method || "")}</small></span><b>${m.type === "bp" ? `${m.v.sys}/${m.v.dia}` : m.v.v} <small>${esc(m.unit)}</small></b></div>`).join("")}` : ""}
    ${canFix ? '<p class="fine">You can correct the last 7 days. Corrections keep the original schedule.</p>' : ""}<button type="button" class="btn" data-act="sheet-close">Close</button>`);
}

SCREENS.meas = () => {
  const t = F.mtype || "bp";
  const list = st.meas.filter(m => m.type === t).sort((a, b) => b.ts.localeCompare(a.ts));
  return { cls: "s-list", html: `${backBtn()}<div class="top"><h2 class="disp">Measurements</h2>${sampleTag()}<p class="lede">Optional. Enter only what you already measure.</p></div><div class="pad">
    <div class="hscroll">${Object.entries(HM.MEAS).map(([k, v]) => `<button type="button" class="chip${t === k ? " on" : ""}" aria-pressed="${t === k}" data-act="mtype" data-v="${k}">${esc(v.label)}</button>`).join("")}</div>
    <button type="button" class="btn" data-act="meas-new" data-t="${t}">${ico("plus")} Add ${esc(HM.MEAS[t].label.toLowerCase())}</button>
    <button type="button" class="link center-block" data-act="go" data-r="trend" data-m="${t}">See the chart</button>
    ${list.length ? list.slice(0, 40).map(m => `<div class="vrow"><span>${esc(HM.fmtDate(m.ts.slice(0, 10)))}<small>${esc(m.ts.slice(11, 16))} · ${esc(m.method || m.source)}</small></span><b>${m.type === "bp" ? `${m.v.sys}/${m.v.dia}` : m.v.v} <small>${esc(m.unit)}</small></b>
      <button type="button" class="mini icon" data-act="meas-edit" data-id="${m.id}" aria-label="Edit">${ico("edit")}</button></div>`).join("") : `<div class="card2 center"><p class="fine">No ${esc(HM.MEAS[t].label.toLowerCase())} entries yet.</p></div>`}</div>` };
};
SCREENS.measform = p => {

    ${f.errs.length ? `<div class="card2 err" role="alert">${f.errs.map(e => `<p>${esc(e)}</p>`).join("")}</div>` : ""}

    <div class="two"><div><label class="fl" for="mf-d">Date</label><input id="mf-d" class="in" type="date" max="${st.today}" value="${esc(f.date)}" data-f="mf.date"></div><div><label class="fl" for="mf-t">Time</label><input id="mf-t" class="in" type="time" value="${esc(f.time)}" data-f="mf.time"></div></div>
    <label class="fl" for="mf-m">${M.methods ? "Method (kept separate in charts)" : "Device or method"}</label>${M.methods ? `<select id="mf-m" class="in" data-f="mf.method">${M.methods.map(x => `<option ${x === f.method ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>` : `<input id="mf-m" class="in" type="text" value="${esc(f.method)}" placeholder="${f.type === "bp" ? "Upper-arm cuff, seated" : "e.g. watch, manual count"}" data-f="mf.method">`}
    <label class="fl" for="mf-n">Context note (optional)</label><input id="mf-n" class="in" type="text" value="${esc(f.note)}" data-f="mf.note" placeholder="e.g. after coffee">
    <p class="fine">No diagnostic ranges are shown. Talk to a clinician about what your numbers mean.</p>
    ${ex ? `<button type="button" class="btn ghost-btn danger" data-act="meas-del" data-id="${ex.id}">${ico("trash")} Delete</button>` : ""}</div>`,
    dock: `<button type="button" class="btn" data-act="meas-save">Save</button>` };
};

SCREENS.compare = () => {
  const live = st.plan.filter(p => HM.occList(st).some(o => o.pid === p.pid));
  const pid = F.cmpPid && live.some(p => p.pid === F.cmpPid) ? F.cmpPid : live[0]?.pid;
  const m = F.cmpM || "mood";
  const from = HM.addDays(st.today, -55); const dates = HM.range(from, HM.addDays(st.today, -1));
  const opts = [["mood", "Mood"], ["energy", "Energy"], ["stress", "Stress"], ["sleep", "Sleep duration"], ["bp", "Systolic BP"]];
  let body = "";
  if (!pid) body = `<div class="card2 center nodata">${ico("link", "big")}<p><b>Nothing to compare yet</b></p><p class="fine">Once you have a few weeks of habit days and records, they&rsquo;ll line up here.</p></div>`;
  else {
    const doneDays = new Set(HM.occList(st).filter(o => o.pid === pid && o.status === "done").map(o => o.date));
    const sched = new Set(HM.occList(st).filter(o => o.pid === pid && o.date < st.today && ["done", "skipped", "due"].includes(o.status)).map(o => o.date));
    const rec = {}; series(m, from).forEach(x => { (rec[x.d] = rec[x.d] || []).push(x.v); });
    const W = 300, x = d => 8 + HM.diff(from, d) / 55 * (W - 16);
    const vals = Object.values(rec).flat(); const lo = Math.min(...vals), hi = Math.max(...vals);
    const y = v => 92 - ((v - lo) / ((hi - lo) || 1)) * 50;
    let svg = `<line x1="8" x2="${W - 8}" y1="28" y2="28" class="grid"/>`;
    dates.forEach(d => { if (doneDays.has(d)) svg += `<rect x="${x(d) - 1.6}" y="18" width="3.2" height="20" rx="1.6" class="mk s3"/>`; else if (sched.has(d)) svg += `<circle cx="${x(d)}" cy="28" r="2" class="hole"/>`; });
    for (const [d, vs] of Object.entries(rec)) if (d < st.today) vs.forEach(v => svg += doneDays.has(d) ? `<circle cx="${x(d)}" cy="${y(v)}" r="2.8" class="mk s1"/>` : `<rect x="${x(d) - 2.5}" y="${y(v) - 2.5}" width="5" height="5" class="mk s2 o"/>`);
    svg += `<text x="8" y="12" class="xl">Habit done (bars) · scheduled, not done (rings)</text><text x="8" y="112" class="xl">${esc(HM.fmtShort(from))}</text><text x="${W - 8}" y="112" class="xl" text-anchor="end">${esc(HM.fmtShort(HM.addDays(st.today, -1)))}</text>`;
    const onD = Object.entries(rec).filter(([d]) => doneDays.has(d)).flatMap(([, v]) => v), offD = Object.entries(rec).filter(([d]) => !doneDays.has(d) && d < st.today).flatMap(([, v]) => v);
    const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
    const enough = onD.length >= 6 && offD.length >= 6;
    const fmtV = v => m === "mood" ? HM.MOODS[Math.round(v) - 1] + ` (${v.toFixed(1)} on 1–5)` : `${(Math.round(v * 10) / 10)}${m === "sleep" ? " h" : m === "bp" ? " mmHg" : " of 5"}`;
    body = `<div class="card2 chartc"><svg class="chart" viewBox="0 0 ${W} 118" aria-hidden="true">${svg}</svg><div class="legend"><span><i class="l3"></i>Habit day</span><span><i class="l1"></i>Record on a habit day</span><span><i class="l2 sqi"></i>Record on another day</span></div></div>
      ${enough ? `<div class="card2"><p><b>These patterns appeared together in your records.</b></p><p>${METRICS[m]} averaged ${esc(fmtV(avg(onD)))} on ${onD.length} entries from habit days, and ${esc(fmtV(avg(offD)))} on ${offD.length} entries from other days.</p>
        <p class="fine">This doesn&rsquo;t show the habit caused a change. Days differ in many ways, and research results don&rsquo;t predict your personal numbers.</p></div>`
        : `<div class="card2 center"><p><b>Not enough data yet</b></p><p class="fine">We need at least 6 entries on habit days and 6 on other days. You have ${onD.length} and ${offD.length}.</p></div>`}`;
  }
  return { cls: "s-list", html: `${backBtn()}<div class="top"><h2 class="disp">Compare</h2>${sampleTag()}<p class="lede">Your habit days lined up with one record, over 8 weeks.</p></div><div class="pad">
    ${live.length ? `<div class="hscroll">${live.map(p => `<button type="button" class="chip${pid === p.pid ? " on" : ""}" aria-pressed="${pid === p.pid}" data-act="cmp-pid" data-v="${p.pid}">${esc(shortT(H(p.hid)))}</button>`).join("")}</div>
    <div class="hscroll">${opts.map(([k, l]) => `<button type="button" class="chip${m === k ? " on" : ""}" aria-pressed="${m === k}" data-act="cmp-m" data-v="${k}">${l}</button>`).join("")}</div>` : ""}${body}</div>` };
};

/* ============ weekly review ============ */
SCREENS.review = () => {
  const ws = HM.addDays(HM.weekStart(st.today), -7), we = HM.addDays(ws, 6);
  const ad = HM.adherence(st, ws, we); const rest = HM.occList(st).filter(o => o.date >= ws && o.date <= we && o.status === "rest").length;
  const ci = st.checkins.filter(c => c.ts.slice(0, 10) >= ws && c.ts.slice(0, 10) <= we).length;
  const live = st.plan.filter(p => !p.removed && p.status === "active");
  const R = F.rev || (F.rev = { manageable: null, decision: null, pid: live[0]?.pid || null, days: null, mins: null, swap: null });
  const per = live.map(p => { const a = HM.adherence(st, ws, we, p.pid); return `<div class="vrow"><span>${esc(H(p.hid).t)}<small>${esc(daysText(p.days))}</small></span><b>${a.done}/${a.den}</b></div>`; }).join("");
  const target = R.pid ? HM.planItem(st, R.pid) : null;
  let ctrl = "", preview = "";
  if (target && R.decision && R.decision !== "keep") {
    const h = H(target.hid);
    if (R.decision === "easier") { if (R.days == null) R.days = target.days.length > 3 ? [0, 2, 4] : target.days.slice(0, Math.max(1, target.days.length - 1)); if (R.mins == null) R.mins = Math.max(1, Math.round(target.mins * 0.6)); }
    if (R.decision === "schedule" && R.days == null) R.days = target.days.slice();
    if (R.decision !== "swap") { R.mins = R.mins ?? target.mins; ctrl = `<fieldset class="fs"><legend>Days for ${esc(h.t)}</legend>${chips("rev.days", HM.WD.map((d, i) => [i, d]), R.days, { multi: true, label: "Days" })}</fieldset>
      <fieldset class="fs"><legend>Minutes</legend><div class="stepper"><button type="button" data-act="rev-mins" data-d="-1" aria-label="Less">${ico("minus")}</button><output>${R.mins} min</output><button type="button" data-act="rev-mins" data-d="1" aria-label="More">${ico("plus")}</button></div></fieldset>`; }
    else { const alts = HM.recommend(st.profile, st.plan.filter(p => !p.removed).map(p => p.hid)).slice(0, 4);
      ctrl = `<fieldset class="fs"><legend>Swap ${esc(h.t)} for</legend>${alts.map(a => `<button type="button" class="lrow${R.swap === a.h.id ? " on" : ""}" role="radio" aria-checked="${R.swap === a.h.id}" data-act="rev-swap" data-id="${a.h.id}">${goalIcon(a.h)}<span class="lt"><b>${esc(a.h.t)}</b><small>${gradeChip(a.f.gr, true)} ${esc(a.f.out)}</small></span></button>`).join("") || '<p class="fine">No suitable alternative for your goal.</p>'}</fieldset>`; }
    const nh = R.decision === "swap" ? (R.swap ? H(R.swap) : null) : h;
    const nd = R.decision === "swap" ? (nh ? HM.suggestSchedule(nh, st.profile.prefs).days : []) : R.days || [];
    const nm = R.decision === "swap" ? (nh ? HM.suggestSchedule(nh, st.profile.prefs).mins : 0) : R.mins;
    if (nh) { const focus = HM.earning(st) && target.pid === st.rewards.focusPid;
      const per2 = HM.periodOf(st.today); const futureN = HM.range(HM.addDays(st.today, 1), per2.end).filter(d => nd.includes(HM.dow(d))).length;
      const P2 = st.rewards.periods[per2.id]; const lockedSum = P2 ? Object.entries(P2.alloc).filter(([oid]) => { const o = st.occ[oid]; return o && (o.date <= st.today || o.status === "done"); }).reduce((s, [, v]) => s + v, 0) : 0;
      preview = `<div class="card2 prev"><div class="eyebrow">Next week preview</div><p><b>${esc(nh.t)}</b></p><p>${esc(daysText(nd))} · ${esc(minsText(nm))} each · about ${nd.length * (nm || 0)} min a week</p>
        <p class="fine">Reminders: ${target.reminder ? "kept on" : "off"}. Changes start tomorrow; past weeks stay as they were.</p>
        ${focus && R.decision !== "swap" ? `<p class="fine">Rewards: ${fmtN(1000 - lockedSum)} unearned points this period spread over ${futureN} future day${futureN === 1 ? "" : "s"}. Earned and missed points don&rsquo;t change.</p>` : ""}</div>`; }
  }
  const dec = [["keep", "Keep this plan"], ["easier", "Make it easier"], ["schedule", "Change the schedule"], ["swap", "Swap a habit"]];
  return { cls: "s-list", html: `${backBtn()}<div class="top"><div class="eyebrow">${esc(HM.fmtShort(ws))} – ${esc(HM.fmtShort(we))}</div><h2 class="disp">Weekly review</h2>${sampleTag()}</div><div class="pad">
    <div class="card2"><div class="big left"><b>${ad.done}</b><span>of ${ad.den} scheduled done</span></div><p class="fine">${ad.skipped} skipped, ${ad.missed} missed, ${rest} rest · ${ci} check-in${ci === 1 ? "" : "s"}</p>${per}</div>
    <fieldset class="fs"><legend>Did this week feel manageable? (optional)</legend>${chips("rev.manageable", [["yes", "Yes"], ["somewhat", "Somewhat"], ["no", "Not really"]], R.manageable, { label: "Manageable" })}</fieldset>
    <fieldset class="fs"><legend>One decision for next week</legend><div class="dec" role="radiogroup" aria-label="Decision">${dec.map(([k, l]) => `<button type="button" class="lrow${R.decision === k ? " on" : ""}" role="radio" aria-checked="${R.decision === k}" data-act="rev-dec" data-v="${k}"><span class="lt"><b>${l}</b></span></button>`).join("")}</div></fieldset>
    ${R.decision && R.decision !== "keep" && live.length > 1 ? `<fieldset class="fs"><legend>Which habit</legend>${chips("rev.pid", live.map(p => [p.pid, shortT(H(p.hid))]), R.pid, { label: "Habit" })}</fieldset>` : ""}
    ${ctrl}${preview}</div>`,
    dock: `<button type="button" class="btn" data-act="rev-save" ${R.decision && (R.decision !== "swap" || R.swap) && (R.decision === "keep" || R.decision === "swap" || (R.days && R.days.length)) ? "" : "disabled"}>${R.decision === "keep" || !R.decision ? "Save review" : "Save and update plan"}</button>` };
};

/* ============ rewards ============ */
SCREENS.rewards = () => {

    <div class="to">${need ? `${fmtN(need)} more for a $5 gift card. At up to 1,000 a period, that&rsquo;s at least ${periods} more billing period${periods === 1 ? "" : "s"}.` : "Enough for a $5 gift card."}</div>
    ${b.pending || b.reserved ? `<p class="fine">${b.pending ? `${fmtN(b.pending)} pending until the day ends` : ""}${b.pending && b.reserved ? " · " : ""}${b.reserved ? `${fmtN(b.reserved)} reserved for an order` : ""}</p>` : ""}</div>
    <div class="pad"><div class="card2 left"><div class="eyebrow">This period · ${esc(HM.fmtShort(per.start))} – ${esc(HM.fmtShort(per.end))}</div>
      ${fp ? `<p>1,000 points shared across ${occs.length} scheduled day${occs.length === 1 ? "" : "s"} of <b>${esc(H(fp.hid).t)}</b>. Earned ${fmtN(b.earnedPeriod)}.</p>
      <div class="alloc">${occs.map(o => `<span class="ac a-${stOf(o)}" title="${esc(HM.fmtDate(o.orig))}: ${stOf(o)}"><b>${P.alloc[o.oid]}</b><small>${esc(HM.fmtShort(o.orig))}</small></span>`).join("")}</div>
      <div class="legend"><span><i class="ac a-earned sw"></i>Earned</span><span><i class="ac a-pending sw"></i>Pending</span><span><i class="ac a-missed sw"></i>Missed</span><span><i class="ac a-upcoming sw"></i>Upcoming</span></div>` : '<p class="fine">Add an eligible habit to your plan to start a rewards routine.</p>'}</div>
    <details class="card2 det"><summary>How points work (proposed policy)</summary><ul class="fine"><li>Membership is a proposed $6.99 a month.</li><li>Up to 1,000 points per billing period, shared by one routine. More days or more habits don&rsquo;t add points.</li><li>No extra points for harder exercise, better moods or health numbers.</li><li>Points carry over. Missed days stay unearned.</li><li>1,000 points = $1 of gift-card value. Merchants are examples.</li></ul></details>
    ${st.rewards.orders.length ? `<div class="sec-h"><h3>Orders</h3></div>${st.rewards.orders.slice().reverse().map(o => `<button type="button" class="vrow wide" data-act="go" data-r="giftstatus" data-o="${o.id}"><span>$${o.usd} ${esc(o.merchant)} card (example)<small>${esc(o.id)} · ${esc(o.status === "fulfilled" ? "Delivered (simulated)" : o.status === "failed" ? "Failed, points returned" : "Processing")}</small></span>${ico("chev", "chev")}</button>`).join("")}` : ""}
    <button type="button" class="btn ghost-btn" data-act="go" data-r="ledger">Points history</button></div>`,
    dock: `<button type="button" class="btn" data-act="go" data-r="gift" ${b.available >= 5000 && !pendingOrder ? "" : "disabled"}>${pendingOrder ? "Order in progress" : "Redeem a $5 gift card"}</button>`, tab: "you" };
};
SCREENS.ledger = () => {
  const L = { earn: "Earned", reversal: "Reversed (undo)", reserve: "Reserved for order", consume: "Spent on order", release: "Released after failed order" };
  const rows = st.rewards.ledger.slice().reverse().map(t => { const o = t.oid ? st.occ[t.oid] : null;
    const label = t.type === "earn" ? (t.reversed ? "Earned (reversed)" : t.state === "pending" ? "Pending" : "Earned") : L[t.type];
    const pts = t.type === "reserve" ? `&minus;${fmtN(t.pts)}${t.active ? "" : " (closed)"}` : t.type === "consume" ? "" : t.type === "release" ? `+${fmtN(t.released)} returned` : `${t.pts > 0 ? "+" : "&minus;"}${fmtN(Math.abs(t.pts))}`;
    return `<div class="vrow"><span>${esc(label)}<small>${esc(t.note || (o ? `${shortT(H(o.hid))} · ${HM.fmtShort(o.orig)}` : t.order ? `Order ${t.order}` : ""))} · ${esc(t.tx)} · ${esc(t.period || "")}</small></span><b>${pts}</b></div>`; }).join("");
  return { cls: "s-list", html: `${backBtn()}<div class="top"><h2 class="disp">Points history</h2>${sampleTag()}</div><div class="pad">${rows || '<p class="fine center">No points yet.</p>'}<p class="fine">Each completion can earn once. Undo creates a matching reversal.</p></div>` };
};

function shortName(h) { return SHORT3[h.id] || shortT(h); }
const DONE_TITLE3 = { walk: "Nice walk.", walk2: "Nice walk.", reflect: "Nicely done.", "p-sleep": "Rest well.", cook: "Good choice.", fruit: "Good choice.", "p-strength": "Strong work.", squat: "Strong work.", stretch: "Nicely done.", seated: "Well done.", "p-calm": "Well done.", breathe: "Well done.", "p-energy": "Good start.", water: "Good start.", friend: "That was nice." };

/* ============ today ============ */
function todayView() {
  const live = st.plan.filter(p => !p.removed);
  const right = topRight("go", "list", "My plan", 'data-r="plan"');
  if (!live.length) return { cls: "s-today s-empty", fixed: true, tab: "today", html: `${right}<div class="day">${esc(HM.fmtDate(st.today))}</div>
    <div class="hero f-sage"><div class="sun"></div>${art("welcome")}</div><div class="body"><h2 class="disp">Let&rsquo;s find your first habit</h2>
    <p class="sub">One small thing is plenty.</p><div class="cta"><button type="button" class="btn" data-act="restart-onb">Get a recommendation</button><button type="button" class="ghost" data-act="tab" data-t="explore">Browse Explore</button></div></div>` };
  const os = HM.occOn(st, st.today);
  const due = os.filter(o => o.status === "due");
  const done = os.filter(o => o.status === "done");
  const missedReturn = st.ui.lastOpen && HM.diff(st.ui.lastOpen, st.today) >= 3 && !st.ui.welcomedBack;
  const back3 = missedReturn ? `<div class="wb" role="status"><span>Welcome back. No catching up needed.</span><button type="button" data-act="wb-close" aria-label="Dismiss">${ico("x")}</button></div>` : "";
  if (!due.length) {
    if (done.length) return { cls: "s-all", fixed: true, tab: "today", html: `${right}${art("couch", "big", "Woman relaxing on a couch")}
      <div class="body"><h2 class="disp">That&rsquo;s everything for today.</h2><div class="sub">${nextScheduled() ? `See you ${esc(HM.fmtDate(nextScheduled().date).split(",")[0])}.` : "See you soon."}</div>
      <div class="row">${done.map(o => th(HM.art(H(o.hid)), HM.field(H(o.hid)))).join("")}</div>
      <button type="button" class="ghost" data-act="go" data-r="checkin">How are you feeling?</button></div>` };
    const rest = os.some(o => o.status === "rest");
    const nx = nextScheduled();
    return { cls: "s-today s-rest", fixed: true, tab: "today", html: `${right}${back3}<div class="day">${esc(HM.fmtDate(st.today))}</div>
      <div class="hero f-plum"><div class="sun"></div>${art("rest")}</div><div class="body"><h2 class="disp">${rest ? "A rest day" : "Nothing planned today"}</h2>
      <p class="sub">${nx ? `Next up ${esc(HM.fmtDate(nx.date).split(",")[0])}: ${esc(shortName(H(nx.hid)))}` : "Nothing else is planned yet."}</p>
      <div class="cta">${rest ? `<button type="button" class="btn ghost-btn" data-act="unrest">Undo rest day</button>` : `<button type="button" class="btn ghost-btn" data-act="go" data-r="plan">See my plan</button>`}</div></div>` };
  }
  const o = due[0], h = H(o.hid), item = HM.planItem(st, o.pid);
  const stack = st.stacks.find(s => s.pids.includes(o.pid));
  const later = due.slice(1);
  const when = [item.time || o.cue, minsWords(o.mins)].filter(Boolean).join(", ");
  const guided = GUIDES[h.id] && !GUIDES[h.id].watchOnly;
  return { cls: "s-today", fixed: true, tab: "today", html: `${right}${back3}<div class="day">${esc(HM.fmtDate(st.today))}</div>
    <div class="hero ${HM.field(h)}"><div class="sun"></div>${art(HM.art(h), "hero-art", h.t)}</div>
    <div class="body"><p class="kick">${esc(when)}</p>
    <h2 class="disp">${esc(h.t)}</h2>
    ${o.date !== o.orig ? `<p class="fine">Moved from ${esc(HM.fmtShort(o.orig))}</p>` : ""}
    <div class="later">${later.map(x => `<button type="button" class="thb" data-act="go" data-r="habit" data-id="${x.hid}" aria-label="Later today: ${esc(H(x.hid).t)}">${th(HM.art(H(x.hid)), HM.field(H(x.hid)))}</button>`).join("")}
      ${later.length ? `<span class="soft">${later.length} more later</span>` : ""}${stack ? `<button type="button" class="tag stackt" data-act="stack-done" data-s="${stack.id}">${ico("stack")}${esc(stack.cue)}</button>` : ""}</div>
    <div class="acts">${guided ? `<button type="button" class="pill" data-act="guide-open" data-id="${h.id}" data-oid="${esc(o.oid)}">${ico("play")}Follow along</button>` : ""}<button type="button" class="pill" data-act="go" data-r="habit" data-id="${h.id}" data-pid="${o.pid}">How to</button></div>
    <div class="cta"><button type="button" class="btn" data-act="done" data-oid="${esc(o.oid)}">Done</button><button type="button" class="ghost" data-act="occ-more" data-oid="${esc(o.oid)}">Not now</button></div></div>` };
}

/* ============ the painted mood: the large character follows the chosen face ============ */
function moodStage(v, cls = "") {
  const layers = [["milestone", 0]].concat(HM.MOODS.map((l, i) => ["m" + (i + 1), i + 1]));
  return `<div class="mstage ${cls}" aria-hidden="true">${layers.map(([k, i]) => `<div class="art i-${k} ml${(v || 0) === i ? " on" : ""}" data-ml="${i}"></div>`).join("")}</div>`;
}
function moodRow(v, act) {
  return HM.MOODS.map((l, i) => `<button type="button" class="mood" role="radio" aria-checked="${v === i + 1}" data-act="${act}" data-v="${i + 1}">${th("m" + (i + 1), "f-cream", v === i + 1 ? "sel" : "")}<small>${esc(l)}</small></button>`).join("");
}
/* updates the face, the radios and the save button in place so the change can cross-fade */
function setMoodUI(v, saveSel) {
  $$("#vp .mstage .ml").forEach(e => e.classList.toggle("on", Number(e.dataset.ml) === (v || 0)));
  $$("#vp .moods .mood").forEach(b => { const on = Number(b.dataset.v) === v; b.setAttribute("aria-checked", on); b.querySelector(".th").classList.toggle("sel", on); });
  const ml = $("#vp .mline"); if (ml) ml.textContent = v ? HM.MOODS[v - 1] : "";
  const b = $(saveSel); if (b) b.disabled = !v && !(F.ci && ([F.ci.energy, F.ci.stress, F.ci.fatigue, F.ci.sleepq].some(Boolean) || F.ci.note)) && saveSel.includes("ci-save") || (!v && saveSel.includes("mood-save"));
}

  const o = st.occ[p.oid]; const h = o ? H(o.hid) : null;
  const m = F.mood && F.mood.oid === p.oid ? F.mood : (F.mood = { oid: p.oid, v: null });
  return { cls: "s-done s-done3", fixed: true, html: `${moodStage(m.v, "big")}
    <div class="body"><h2 class="disp">${esc(DONE_TITLE3[h ? HM.art(h) : ""] || "Nicely done.")}</h2>
    <div class="sub">Saved to your week. <button type="button" class="inl" data-act="undo" data-oid="${esc(p.oid)}">Undo</button></div>
    <div class="q" id="mq">How do you feel?</div>
    <div class="moods" role="radiogroup" aria-labelledby="mq">${moodRow(m.v, "mood3")}</div>

/* ============ explore ============ */

function varied(list) {
  const out = [], pool = list.slice();
  while (pool.length) { const last = out.slice(-2).map(h => HM.art(h)); const i = pool.findIndex(h => !last.includes(HM.art(h))); out.push(pool.splice(i < 0 ? 0 : i, 1)[0]); }
  return out;
}

}
SCREENS.explore = () => {

  if (searching) {
    const res = exploreResults();
    return { cls: "s-exp3", tab: "explore", html: `${head}<div class="pad tools3"><span aria-live="polite">${res.length} habit${res.length === 1 ? "" : "s"}</span><span><button type="button" class="pill${n || E.coll !== "all" ? " on" : ""}" data-act="filters">${ico("filter")}Filters${n + (E.coll !== "all" ? 1 : 0) ? ` (${n + (E.coll !== "all" ? 1 : 0)})` : ""}</button> <button type="button" class="pill" data-act="clear-all">Clear</button></span></div>
      <div class="pad list">${res.length ? res.map(habitRow).join("") : `<div class="nothing">${art("reflect", "small")}<p><b>Nothing matches.</b></p><p class="fine">${E.coll === "saved" ? "Tap the star on a habit to save it." : "Try another word or fewer filters."}</p></div>`}</div>`,

  }

  const shelf = (k, title, items, note = "") => items.length ? `<section class="shelf"><div class="shead"><h3>${esc(title)}</h3><button type="button" class="link" data-act="go" data-r="shelf" data-k="${k}" aria-label="See all: ${esc(title)}">See all</button></div>${note}

};

/* ============ habit detail: level 1 ============ */
SCREENS.habit = p => {

  if (h.personal) {

      <p class="how">${esc(plain(how))}</p>

/* ============ level 2: understanding the science ============ */

    ${neg.length ? `<div class="sec-h"><h3>Looked into, not supported</h3></div>${neg.map(f => `<button type="button" class="frow3" data-act="finding" data-f="${esc(f.id)}"><span>${esc(f.out)}</span>${ico("chev", "chev")}</button>`).join("")}` : ""}

/* ============ level 3: detailed scientific evidence ============ */
SCREENS.research = p => {
  const h = H(p.id); if (!h || h.personal) return SCREENS.explore();

  return { cls: "s-list s-res3", html: `${backBtn()}<div class="top"><h2 class="disp">Full research details</h2><p class="lede">${esc(h.t)}</p></div><div class="pad">
    ${tabsV}${h.v.length > 1 ? '<p class="fine">Two research summaries looked at this habit. Both are kept as written.</p>' : ""}
    <div class="kvbox"><div class="kv"><span>Category</span><p>${esc(HM.PLACEMENT[h.pl].long)}</p></div>
      <div class="kv"><span>Starting action</span><p>${esc(v.beg || v.action || "Not specified")}</p></div>

function sourceList(fids) {

  if (!ids.length) return '<p class="fine">No sources listed.</p>';

/* ---------- phases ---------- */
function guidePhases(G, s) {
  const P = [];
  if (G.kind === "timer") P.push({ k: "go", s: s.mins * 60, cue: G.cues[0] });
  if (G.kind === "breath") {
    const [, , i, h1, o, h2] = G.paces.find(p => p[0] === s.pace) || G.paces[0];
    const hold = G.box && !s.skipHolds;
    const cyc = i + o + (hold ? h1 + h2 : 0);
    const n = G.box ? s.rounds : Math.max(1, Math.round(s.mins * 60 / cyc));
    for (let r = 1; r <= n; r++) {
      P.push({ k: "in", s: i, cue: "Breathe in", r, n });
      if (hold) P.push({ k: "hold", s: h1, cue: "Pause", r, n });
      P.push({ k: "out", s: o, cue: "Breathe out", r, n });
      if (hold) P.push({ k: "holdout", s: h2, cue: "Pause", r, n });
    }
  }
  if (G.kind === "stages") G.groups.forEach((g, i) => { P.push({ k: "tense", s: G.tense, cue: `${g}: gently tense`, r: i + 1, n: G.groups.length }); P.push({ k: "release", s: G.release, cue: `${g}: let go, and notice`, r: i + 1, n: G.groups.length }); });
  if (G.kind === "holds") G.sides.forEach((side, i) => { if (i) P.push({ k: "switch", s: null, cue: "Switch sides when you’re ready" }); P.push({ k: "hold", s: s.hold, cue: `${G.areas ? (G.areas.find(a => a[0] === s.area) || G.areas[0])[1] + ", " + side.toLowerCase() : side}: hold`, r: i + 1, n: G.sides.length }); });
  if (G.kind === "intervals") for (let i = 1; i <= s.holds; i++) { P.push({ k: "hold", s: s.hold, cue: "Hold. Keep breathing.", r: i, n: s.holds }); if (i < s.holds) P.push({ k: "rest", s: G.rest, cue: "Rest. Stand up and relax.", r: i, n: s.holds, skippable: true }); }
  if (G.kind === "reps") for (let i = 1; i <= G.sets; i++) { P.push({ k: "reps", s: null, target: G.reps, cue: "Stand up fully, then sit down slowly", r: i, n: G.sets }); if (i < G.sets) P.push({ k: "switch", s: null, cue: "Rest until you’re ready for the next set", r: i, n: G.sets }); }
  return P;
}

    <div class="gstage ${HM.field(h)} k-${ph.k}" style="--dur:${ph.s || 0}s">

      <p class="gnum" role="timer" aria-live="off">${untimed ? (ph.k === "reps" ? `${g.count || 0} of ${ph.target}` : "") : fmtT(Math.max(0, ph.s - (g.el || 0) / 1000))}</p>

/* ---------- engine: the app keeps time; the page only draws ---------- */
let g3raf = null;
function g3Speak(t) { if (!F.g3?.voice || !t || !window.speechSynthesis) return; try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); } catch (e) { } }
function g3Mount() {
  cancelAnimationFrame(g3raf);
  const g = F.g3; if (!g || g.state !== "run") return;
  const ph = g.P[g.i]; if (!ph) return;
  const stage = $("#vp .gstage"); const ring = $("#vp .rp"); const num = $("#vp .gnum"); const cue = $("#vp .gcue");
  const G = GUIDES[g.id];
  /* the breathing disc is a CSS transition whose duration is the phase length; restarted at each phase */
  const disc = $("#vp .gdisc");
  if (disc && stage) {
    const S = { in: [.78, 1], out: [1, .78], hold: [1, 1], holdout: [.78, .78] }[ph.k] || [1, 1];
    const frac = ph.s ? Math.min(1, (g.el || 0) / (ph.s * 1000)) : 0;
    const still = reduceMotion();
    disc.style.setProperty("--s0", still ? 1 : S[0] + (S[1] - S[0]) * frac); disc.style.setProperty("--s1", still ? 1 : S[1]);
    disc.style.setProperty("--rem", `${ph.s ? ph.s * (1 - frac) : 0}s`);
    stage.classList.remove("go"); void stage.offsetWidth; if (!g.paused) stage.classList.add("go");
  }
  const tick = now => {
    if (!F.g3 || F.g3 !== g || g.state !== "run" || nav.cur.r !== "guide3") return;
    if (!g.paused && ph.s != null) {
      g.el = (g.el || 0) + (now - (g.last || now)); g.last = now;
      const left = Math.max(0, ph.s - g.el / 1000);
      if (num) num.textContent = fmtT(Math.ceil(left));
      if (ring) ring.setAttribute("stroke-dashoffset", (100 * left / ph.s).toFixed(2));
      if (G.kind === "timer" && G.cues.length > 1 && cue) { const c = G.cues[Math.min(G.cues.length - 1, Math.floor((g.el / 1000) / Math.max(30, ph.s / G.cues.length)))]; if (cue.textContent !== c) { cue.textContent = c; g3Speak(c); } }
      if (left <= 0) return g3Advance();
    } else g.last = now;
    g3raf = requestAnimationFrame(tick);
  };
  g.last = performance.now();
  g3raf = requestAnimationFrame(tick);
}
function g3Advance() {
  const g = F.g3; g.i++; g.el = 0; g.count = 0;
  if (g.i >= g.P.length) return g3Finish();
  g3Speak(g.P[g.i].cue);
  render(true);
}
function g3Finish() {
  const g = F.g3; const G = GUIDES[g.id]; cancelAnimationFrame(g3raf);
  const secs = Math.round((performance.now() - g.started - g.pausedMs) / 1000);
  g.summary = G.kind === "reps" ? `${G.sets} sets of ${G.reps}` : G.kind === "breath" ? `${g.P.filter(p => p.k === "in").length} breaths in ${fmtT(secs)}` : G.kind === "stages" ? `${G.groups.length} muscle groups` : `${fmtT(secs)}`;
  g.state = "done"; g3Speak("Session complete."); render(true);
}

const A3 = {
  /* opens a guided activity from Today (with the planned occurrence) or from a habit page (try it, nothing logged) */
  "guide-open": el => { F.g3 = null; const oid = el.dataset.oid || ""; go("guide3", oid ? { id: el.dataset.id, oid } : { id: el.dataset.id }); },
  "g3-tab": el => { F.g3.tab = el.dataset.v; re(); },
  "g3-set": el => { const g = F.g3, G = GUIDES[g.id], k = el.dataset.k, d = Number(el.dataset.d);
    const lim = k === "mins" ? G.range : k === "rounds" ? G.range : k === "hold" ? G.range : k === "holds" ? [1, 4] : [1, 99];
    g.s[k] = Math.max(lim[0], Math.min(lim[1], (g.s[k] || 0) + d)); re(); },
  "g3-pace": el => { F.g3.s.pace = el.dataset.v; re(); },
  "g3-area": el => { F.g3.s.area = el.dataset.v; re(); },

/* ---------- peeking-card deck (app-wide standard for swipeable habit sets) ----------
   The next card peeks from behind the current one. Position dots and previous/next buttons are always there,
   so nothing relies on discovering the swipe. The last card shows the end of the set; a single card has no peek
   and no pagination. Reduced motion turns the slide off. */
const DECKS = {};
function deck(id, cards, i, { label = "Habits", endText = "That&rsquo;s all of them" } = {}) {
  const n = cards.length; i = Math.max(0, Math.min(i, n - 1)); DECKS[id] = { n, i };
  if (n === 1) return `<div class="deck one" id="dk-${id}" data-deck="${id}">${`<div class="dcard cur" aria-roledescription="card">${cards[0]}</div>`}</div>`;
  const last = i === n - 1;
  return `<div class="deck${last ? " last" : ""}" id="dk-${id}" data-deck="${id}" role="region" aria-roledescription="carousel" aria-label="${esc(label)}">
    <div class="dstage">${i + 1 < n ? `<div class="dcard peek" aria-hidden="true"></div>` : ""}${i + 2 < n ? `<div class="dcard peek2" aria-hidden="true"></div>` : ""}
    <div class="dcard cur" aria-roledescription="card" aria-label="${i + 1} of ${n}">${cards[i]}</div></div>
    <div class="dnav"><button type="button" class="dbtn" data-act="deck" data-deck="${id}" data-d="-1" ${i ? "" : "disabled"} aria-label="Previous">${ico("back")}</button>
    <div class="ddots" aria-hidden="true">${cards.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
    <span class="dpos">${i + 1} of ${n}</span>
    <button type="button" class="dbtn" data-act="deck" data-deck="${id}" data-d="1" ${last ? "disabled" : ""} aria-label="Next">${ico("chev")}</button></div>
    ${last ? `<p class="dend" aria-live="polite">${endText}</p>` : ""}</div>`;
}
/* touch and mouse swipe on the current card; the deck's screen decides what a move means (DECK_MOVE[id]) */
const DECK_MOVE = {};
function deckMove(id, d) { const D = DECKS[id]; if (!D) return; const j = D.i + d; if (j < 0 || j >= D.n) return; (DECK_MOVE[id] || (() => { }))(j); }
document.addEventListener("pointerdown", e => {
  const card = e.target.closest?.(".deck .dcard.cur"); if (!card || e.target.closest("button, a, input, select, textarea, label")) return;
  const dk = card.closest(".deck"); const id = dk.dataset.deck; const x0 = e.clientX, y0 = e.clientY; let dx = 0, dragging = false;
  const mv = ev => { dx = ev.clientX - x0; const dy = ev.clientY - y0; if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) dragging = true;
    if (dragging && !st.settings.reduce) card.style.transform = `translateX(${dx}px) rotate(${dx / 60}deg)`; };
  const up = () => { document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); document.removeEventListener("pointercancel", up);
    card.style.transform = ""; if (dragging && Math.abs(dx) > 60) deckMove(id, dx < 0 ? 1 : -1); };
  document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
});
document.addEventListener("keydown", e => {
  const dk = e.target.closest?.(".deck"); if (!dk || !["ArrowLeft", "ArrowRight"].includes(e.key) || e.target.closest("input, textarea, select")) return;
  e.preventDefault(); deckMove(dk.dataset.deck, e.key === "ArrowRight" ? 1 : -1);
});
