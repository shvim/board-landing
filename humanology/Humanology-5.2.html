lity_rule":"confirm_eligibility","studied_population":"Adults in 21 trials (about 32,000 people), including people with hypertension","qualification":"Extra potassium can be dangerous with kidney disease or potassium-raising medicines, including ACE inhibitors, ARBs and potassium-sparing diuretics. Check with a clinician or pharmacist before changing salts in these situations.","time_commitment":"Use in place of regular salt during usual food preparation.","display_evidence_in_details":true,"blocked_if":["kidney_disease","potassium_raising_medication","potassium_restriction"],"research_source_ids":["35945000","34459569","41578335"],"research_summary":"Blood pressure has support across multiple trials. A newer review found that evidence for cardiovascular events still relies heavily on the large Chinese trial.","source_notes":[{"source_id":"35945000","role":"Pooled research","summary":"Trials of potassium-enriched salt substitutes found lower systolic and diastolic pressure relative to regular salt."},{"source_id":"34459569","role":"Direct, high-risk population","summary":"With potassium-enriched salt there were about 29 versus 34 strokes per 1,000 person-years in rural Chinese participants with a prior stroke or who were at least 60 with hypertension. Follow-up averaged 4.74 years."},{"source_id":"41578335","role":"Broader review with overlapping trials","summary":"Across 34 trials, some potassium-enriched formulations probably lowered systolic pressure. Cardiovascular event evidence was dominated by one large Chinese trial. Do not count the stroke trial twice."}]},{"card_id":"whole-grains","title":"Choose whole-grain staples","action":"Swap some refined bread, rice or pasta for whole-grain versions. Studies used different grains and amounts.","tracking_prompt":"Track the foods you swap. A lipid panel measures the outcome.","goals":["heart"],"benefit_ids":["whole-grains-1","whole-grains-2"],"eligibility_rule":"read_studied_population","studied_population":"Adults","qualification":"Different grains and amounts were tested. Increase fiber gradually if it causes stomach discomfort.","time_commitment":"Daily food swap.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["42743912","26269373"],"research_summary":"Two reviews found modest LDL and total cholesterol reductions. Their study periods overlap. The per-48-gram estimate comes from the newer review.","source_notes":[{"source_id":"42743912","role":"Pooled research","summary":"The review separately reports a small decrease in total cholesterol and LDL per 48 g/day of whole grains. Certainty differs between those outcomes."},{"source_id":"26269373","role":"Earlier pooled comparison","summary":"Whole-grain diets modestly lowered LDL and total cholesterol compared with non-whole-grain controls. The trial pool overlaps the period covered by the newer review."}]},{"card_id":"walk-for-ideas","title":"Walk while brainstorming","action":"Walk for a few minutes while generating ideas or brainstorm immediately afterward.","tracking_prompt":"Count distinct ideas on comparable prompts.","goals":["memory"],"benefit_ids":["walk-for-ideas-1"],"eligibility_rule":"read_studied_population","studied_population":"Mostly university and college students (1,036 participants)","qualification":"Most participants were students completing short lab tasks. The finding applies to generating ideas.","time_commitment":"A few minutes up to 20 minutes when you need ideas.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["42127076","24749966"],"research_summary":"A review and primary experiments support generating more ideas during or shortly after walking. They do not establish better real-world problem solving.","source_notes":[{"source_id":"42127076","role":"Pooled research","summary":"Walking improved scores on idea-generation tasks, mostly in student samples. Results for convergent problem solving were uncertain."},{"source_id":"24749966","role":"Primary experimental example","summary":"Four experiments compared walking and sitting on idea-generation tasks. Walking improved creative ideation during or shortly after activity. The result depended on the task."}]},{"card_id":"water-flosser","title":"Clean between your teeth daily","action":"Use a powered interdental cleaner each day in addition to brushing, following the device instructions.","tracking_prompt":"Track bleeding over several weeks.","goals":[],"benefit_ids":["water-flosser-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults with gingivitis (16 RCTs, 1,258 people), at least 28 days","qualification":"Minor gum trauma possible with mechanical devices.","time_commitment":"Once daily in addition to brushing, for at least four weeks.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["36562267","21387981"],"research_summary":"A review supports less bleeding when powered cleaning is added to brushing. An oral-irrigator trial compared different devices against floss.","source_notes":[{"source_id":"36562267","role":"Direct, adjunct to brushing","summary":"Trials in adults with gingivitis found less bleeding between teeth with powered interdental cleaning plus brushing than with brushing alone. Floss gave a comparable result."},{"source_id":"21387981","role":"Different active comparator","summary":"After four weeks, two oral-irrigator groups had less gingival bleeding than a floss group with manual brushing. This does not duplicate the brushing-alone comparison."}]},{"card_id":"social-break","title":"Take a week off social media","action":"Choose a seven-day break from the platforms studied or their equivalents. Arrange another way to stay in touch.","tracking_prompt":"Record wellbeing at the start and end of the week.","goals":["mood"],"benefit_ids":["social-break-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults, mean age 29.6 (154 people), not a clinical group","qualification":"The positive finding came from one short trial. A larger review found no clear average change in positive affect, negative affect or life satisfaction.","time_commitment":"Seven consecutive days.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["35512731","40038410"],"research_summary":"One week-long trial found improved wellbeing. A review pooling abstinence studies found no consistent change in related wellbeing measures.","source_notes":[{"source_id":"35512731","role":"Controlled trial","summary":"One week away from selected social media platforms improved a wellbeing score compared with usual use. Follow-up was short."},{"source_id":"40038410","role":"Mixed broader findings","summary":"A systematic review of social-media breaks found no clear pooled benefit for positive affect, negative affect or life satisfaction. These related endpoints differ from the wellbeing scale of the one-week trial."}]},{"card_id":"toothbrush","title":"Use a powered toothbrush","action":"Use a powered toothbrush for your usual brushing and follow the device instructions.","tracking_prompt":"Log use. How clean your teeth feel is a personal observation.","goals":[],"benefit_ids":["toothbrush-1"],"eligibility_rule":"read_studied_population","studied_population":"Healthy adults (28 publications, single-brushing studies)","qualification":"The outcome is plaque removal immediately after brushing. Longer-term effects have a different evidence base.","time_commitment":"Usual brushing, about 2 times/day","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["34877772","16170978","31050195"],"research_summary":"Reviews of single-brushing experiments agree on a small plaque-removal benefit. The reviews can include the same participants.","source_notes":[{"source_id":"34877772","role":"Pooled research","summary":"Pooled single-brushing studies found slightly greater plaque removal with a powered toothbrush. This specific finding concerns immediate plaque removal."},{"source_id":"16170978","role":"Controlled trial","summary":"In a single-use crossover comparison, one battery-powered brush removed more plaque than a manual brush. The finding concerns the tested models."},{"source_id":"31050195","role":"Overlapping review","summary":"An earlier review of single-brushing comparisons favored powered brushes over manual brushes for plaque removal. Trials can overlap with the later review."}]},{"card_id":"screen-cap","title":"Set a daily phone screen-time cap","action":"Try a two-hour daily phone screen-time cap for three weeks if it fits your work and communication needs.","tracking_prompt":"Use your screen-time report and rate mood and sleep separately.","goals":["mood","sleep"],"benefit_ids":["screen-cap-1","screen-cap-2","screen-cap-3"],"eligibility_rule":"confirm_eligibility","studied_population":"Healthy university students, mean age 22.7 (n=111)","qualification":"Evidence comes from one unblinded trial in healthy university students. Keep access to essential communication.","time_commitment":"Cap of 2 h/day, 3 weeks","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["39985031","35389685"],"research_summary":"One student trial tested the two-hour cap and measured all three groups of outcomes. A separate intervention reducing smartphone use by one hour provides context for mood and wellbeing.","source_notes":[{"source_id":"39985031","role":"Direct, single sample","summary":"After three weeks, 111 students assigned to a daily two-hour phone cap or control differed on depressive symptoms, perceived stress, wellbeing and insomnia severity. The insomnia score differed by 2.59 points at the end. Several outcomes came from these same students."},{"source_id":"35389685","role":"Different reduction target","summary":"An experiment reducing daily smartphone use by one hour found improvements in depressive symptoms and wellbeing. It used a relative reduction rather than a two-hour daily cap and does not validate the card’s insomnia score."}]},{"card_id":"standing-stockings","title":"Use fitted stockings during standing shifts","action":"Use appropriately fitted graduated compression stockings during standing shifts if they are suitable for you.","tracking_prompt":"Record end-of-shift swelling or heaviness.","goals":[],"benefit_ids":["standing-stockings-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Healthcare workers on six-hour standing shifts and hairdressers exposed to prolonged standing.","qualification":"The finding concerns leg swelling during standing shifts. Check fit and seek advice about arterial circulation problems or skin disease.","time_commitment":"Standing work days, up to 12 months","display_evidence_in_details":true,"blocked_if":["compression_contraindicated"],"research_source_ids":["37458579","22451457"],"research_summary":"Two independent studies found less lower-leg swelling with stockings during standing work, one in healthcare workers and one in hairdressers.","source_notes":[{"source_id":"37458579","role":"Direct, occupational swelling","summary":"Graduated stockings countered increases in lower-leg volume in healthcare workers on standing shifts. Seventy-two participants completed data collection. The flight-clot outcome was outside this study."},{"source_id":"22451457","role":"Independent occupational crossover trial","summary":"In 108 hairdressers randomized to low-strength stockings and no-compression periods, lower-leg volume averaged 19 mL less with stockings. Symptoms also improved. This supports the swelling result in a second standing occupation."}]},{"card_id":"optimism","title":"Imagine your best possible future","action":"Spend five minutes a day for two weeks imagining your best possible future in relationships, personal life and work.","tracking_prompt":"Rate optimism before and after the two weeks.","goals":["mood"],"benefit_ids":["optimism-1"],"eligibility_rule":"read_studied_population","studied_population":"Adults in studies of future-self imagery.","qualification":"The studied outcome was optimism on a questionnaire.","time_commitment":"5 min/day, 14 days","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["21450262","31545815","36724699"],"research_summary":"One trial supports the two-week imagery schedule. Another study found immediate optimism changes across writing and imagery formats.","source_notes":[{"source_id":"21450262","role":"Direct, tested schedule","summary":"Five minutes daily of imagining one’s best possible self increased self-rated optimism relative to imagining ordinary daily activities, both after one session and over two weeks."},{"source_id":"31545815","role":"Direct pooled result","summary":"Across different versions of the best-possible-self exercise, participants showed higher optimism on average than comparison groups. The pooled estimate spans different practice formats."},{"source_id":"36724699","role":"Different practice duration","summary":"An online study compared versions of best-possible-self practice. Writing and imagery produced similar immediate improvements in optimism. It did not test how long the effect lasts."}]},{"card_id":"bedtime-phone","title":"Put your phone away before bed","action":"Put your phone away for the last 30 minutes before bed for four weeks. The small trial included nightly enforcement.","tracking_prompt":"Record phone-free minutes and estimated time to fall asleep.","goals":["sleep"],"benefit_ids":["bedtime-phone-1","bedtime-phone-2","bedtime-phone-3"],"eligibility_rule":"confirm_eligibility","studied_population":"Young adults with poor sleep who regularly used their phone at bedtime.","qualification":"Research involved young adults with poor sleep and a habitual bedtime phone routine. Outcomes were self-reported.","time_commitment":"30 phone-free min/night","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["32040492","29073407","41668954"],"research_summary":"One small trial directly supports the 30-minute restriction in young adults with poor sleep. Different evening media rules in athletes produced mixed sleep findings.","source_notes":[{"source_id":"32040492","role":"Direct, self-reported outcomes","summary":"In 38 young adults a reinforced bedtime phone restriction improved reported sleep onset, sleep quality and bedtime arousal. The groups’ average changes in onset differed by about ten minutes. The paper’s p = 0.049 is the end-of-study group comparison."},{"source_id":"29073407","role":"Null result in a different population","summary":"A four-week restriction on electronic media after 10 pm did not improve sleep habits in high-school athletes who already slept well. The rule, population and baseline sleep differed from the card trial."},{"source_id":"41668954","role":"Different exposure and comparison","summary":"Sixteen male elite soccer players compared two hours of pre-bed smartphone exposure with magazine reading. Sleep quality worsened during phone exposure. This does not establish the effects of a 30-minute cutoff on onset or bedtime arousal."}]},{"card_id":"blink","title":"Practice complete blinks","action":"Gently close, squeeze and open your eyes 15 times, three times daily for two weeks.","tracking_prompt":"Rate symptoms at the same time each day.","goals":[],"benefit_ids":["blink-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults with dry eye (98 and 28 people)","qualification":"Evidence comes from short studies in people with dry eye. Seek eye care for persistent symptoms, pain or vision changes.","time_commitment":"3 x 15 repeats/day","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["40467388","32409236"],"research_summary":"Two short studies support symptom relief in dry eye. Blink-reminder software changes a different behavior from the card’s close–squeeze–open exercises.","source_notes":[{"source_id":"40467388","role":"Direct, selected schedule","summary":"Short studies in adults with dry eye found fewer symptoms and incomplete blinks with the selected 15 close–squeeze–open repeats three times a day. Several objective tear-film measures showed no significant change."},{"source_id":"32409236","role":"Related schedule","summary":"In a four-week before-and-after program, dry-eye symptoms improved. It used a different blink schedule and lacked a randomized no-exercise control."}]},{"card_id":"apples","title":"Try two whole apples daily","action":"Try two whole apples a day for eight weeks if this fits your diet.","tracking_prompt":"Track servings. Cholesterol requires a lipid panel.","goals":["heart"],"benefit_ids":["apples-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Mildly hypercholesterolemic adults, mean age 51 (n=40)","qualification":"One small trial in adults with mildly high cholesterol compared whole apples with an apple drink. A broader review combining apples and apple products found no clear overall LDL reduction.","time_commitment":"Daily, 8 weeks","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["31840162","23271615","35449537"],"research_summary":"One small trial supports the two-apple routine versus a matched drink. A second trial favored whole apples over clear juice. A broader review pooling apple products found an inconclusive overall LDL difference.","source_notes":[{"source_id":"31840162","role":"Direct, matched drink","summary":"Two whole apples daily resulted in modestly lower LDL than a matched apple drink after eight weeks in a small crossover trial of adults with mildly elevated cholesterol."},{"source_id":"23271615","role":"Related whole-fruit comparison","summary":"In 23 healthy volunteers, clear apple juice produced higher LDL than whole apples in a four-week crossover study. The whole-apple portion was 550 g daily. This differs from the card’s population and matched drink."},{"source_id":"35449537","role":"Mixed pooled evidence","summary":"Across trials of apples and apple-derived products, pooled LDL was 2.8 mg/dL lower, with a 95% interval from 5.78 lower to 0.17 higher. The overall result was inconclusive and the review mixed product forms."}]},{"card_id":"work-breaks","title":"Add four breaks to a desk shift","action":"Add four five-minute breaks spread across the shift. Participants also had their usual two longer breaks.","tracking_prompt":"Rate discomfort at the end of comparable shifts.","goals":[],"benefit_ids":["work-breaks-1"],"eligibility_rule":"read_studied_population","studied_population":"Data-entry workers (n=51)","qualification":"Two field studies tested supplementary breaks in data-entry work. They measured discomfort and eyestrain during the work period.","time_commitment":"20 extra min/workday","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["17514726","10877480"],"research_summary":"Two data-entry field studies support the four extra five-minute breaks. The search did not identify a stronger test of that schedule and eyestrain outcome.","source_notes":[{"source_id":"17514726","role":"Controlled trial","summary":"Data-entry workers reported less discomfort and eyestrain when four five-minute breaks were added to their usual breaks."},{"source_id":"10877480","role":"Direct occupational result","summary":"Data-entry operators reported smaller increases in discomfort and eyestrain during periods with four additional five-minute breaks. Data-entry performance was maintained."}]},{"card_id":"hummus","title":"Try an afternoon hummus snack","action":"The tested snack was hummus with pretzels, about 240 kcal, roughly three hours after lunch.","tracking_prompt":"Record hunger and evening snacks.","goals":["metabolic"],"benefit_ids":["hummus-1"],"eligibility_rule":"read_studied_population","studied_population":"Healthy adults, mean age 26 (n=39)","qualification":"One small, short trial in healthy young adults. The snack contains ingredients that may be unsuitable for people with food allergies.","time_commitment":"One snack about three hours after lunch.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["32488233"],"research_summary":"One small trial tested the afternoon hummus-and-pretzels snack and later dessert snacking. A conference abstract describes a similar study by the same research group and was not counted as replication.","source_notes":[{"source_id":"32488233","role":"Direct, specified snack","summary":"Compared with no snack, hummus with pretzels reduced afternoon hunger in 39 healthy adults. Later dessert snacking was about 20% lower than after either no snack or granola bars. The measurement followed six days on each pattern."}]},{"card_id":"volunteer","title":"Try a structured volunteering session","action":"Join a structured session helping nursing-home residents if this is available and suits you.","tracking_prompt":"Rate loneliness before the session and at follow-up.","goals":["mood"],"benefit_ids":["volunteer-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults aged 59 to 79 (n=76)","qualification":"The intervention was a structured activity with older adults. Benefit was self-reported.","time_commitment":"Single session","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["42054579","39855242"],"research_summary":"One trial tested a single nursing-home session. A separate, sustained volunteering program also reduced loneliness in older volunteers. The one-session effect is still based on one trial.","source_notes":[{"source_id":"42054579","role":"Direct, structured session","summary":"In a trial of 76 older adults, participants who helped nursing-home residents reported less loneliness within a day. The effect persisted at one month. The participants volunteered within a structured program."},{"source_id":"39855242","role":"Independent longer volunteering program","summary":"Older volunteers in a structured telephone program reported less loneliness than controls after a sustained intervention. Most effects were not sustained at later follow-up. This does not test one nursing-home visit."}]},{"card_id":"jumps","title":"Practice short sets of vertical jumps","action":"One tested example in young women was 10 maximal countermovement jumps, three nonconsecutive days a week for six months. Use only if high-impact activity is appropriate.","tracking_prompt":"Log sessions. Bone density is measured by DXA.","goals":["movement"],"benefit_ids":["jumps-1"],"eligibility_rule":"clinician_clearance","studied_population":"Healthy adults over 18 (review); example trial: healthy non-smoking young women aged 20-23","qualification":"High-impact exercise. Seek clinical advice if pregnant or if you have osteoporosis, a fracture history, joint or back problems, or restrictions on impact exercise. The specific schedule was studied in healthy young women.","time_commitment":"Under two minutes per session in the example trial, including rests. This was an estimate.","display_evidence_in_details":true,"blocked_if":["impact_exercise_restriction"],"research_source_ids":["38305252","16269526"],"research_summary":"A pooled analysis supports femoral-neck density. The ten-jump, three-days-a-week example comes from one trial. Other hip studies used different sites or schedules.","source_notes":[{"source_id":"38305252","role":"Pooled research","summary":"Across jump programs, the clearest density improvement was at the femoral neck. The programs varied; the review does not establish fracture prevention."},{"source_id":"16269526","role":"Direct, one specific regimen","summary":"In young women, femoral-neck density rose from baseline after six months of ten maximal jumps three times weekly. The pooled estimate on the card comes from the review of multiple programs."}]},{"card_id":"psyllium","title":"Use psyllium regularly","action":"Use the label for dosing and mixing. LDL trials used a median of about 10 g of psyllium daily. Take each dose with at least a full glass of water, and check medicine spacing with a pharmacist.","tracking_prompt":"Log bowel frequency if relevant. LDL requires a lipid panel.","goals":["heart","digestion"],"benefit_ids":["psyllium-1","psyllium-2"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults in lipid trials and adults with constipation. Benefits differ by population.","qualification":"Do not swallow dry powder. Avoid with swallowing difficulty or suspected bowel obstruction. Check label directions, fluid restrictions and medicine spacing with a pharmacist.","time_commitment":"Daily according to product directions. Trial doses and duration varied by outcome.","display_evidence_in_details":true,"blocked_if":["swallowing_difficulty","bowel_obstruction","fluid_restriction"],"research_source_ids":["30239559","35816465","8824651","41366295"],"research_summary":"Two lipid reviews support lower LDL, with overlapping trial periods. Separate constipation evidence supports improved bowel frequency with variable effect sizes.","source_notes":[{"source_id":"30239559","role":"Direct LDL result","summary":"Across 28 controlled trials, a median daily psyllium intake of about 10.2 g lowered LDL by 0.33 mmol/L on average. This is the lipid evidence on this two-benefit card."},{"source_id":"35816465","role":"Direct psyllium subgroup","summary":"In the psyllium subgroup, bowel frequency increased by about 3.08 per week, with a wide 95% interval of 0.61 to 5.54 and substantial variation. The overall fiber response rate cannot be attributed to psyllium alone."},{"source_id":"8824651","role":"Controlled trial","summary":"Adults with chronic constipation received psyllium or placebo for eight weeks. Stool frequency and consistency improved during psyllium treatment."},{"source_id":"41366295","role":"Later lipid review","summary":"A later synthesis also found lower LDL and total cholesterol with psyllium. It may reuse trials in the earlier review and offers no additional evidence on constipation."}]},{"card_id":"retrieval","title":"Practice recalling what you learn","action":"After learning new facts, test yourself and check the answers. One trial tested trainees immediately and twice more at intervals of about two weeks.","tracking_prompt":"Track how many answers you recall on a later test.","goals":["memory"],"benefit_ids":["retrieval-1"],"eligibility_rule":"read_studied_population","studied_population":"Healthy adults/students learning facts","qualification":"Research measured recall of practiced material on a later test.","time_commitment":"Three practice sessions in the example, the first immediately after learning.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["16719566","25150680","19930508","SPACED-2021"],"research_summary":"A review of 29 studies examined spacing retrieval practice. Delayed recall favored spaced over massed retrieval. One trainee trial supplies the three-session example.","source_notes":[{"source_id":"16719566","role":"Spacing evidence","summary":"Spacing learning episodes improved later retention compared with massed practice. Effective intervals depended on how much later learners were tested. This paper does not establish the feedback and self-testing schedule."},{"source_id":"25150680","role":"Retrieval evidence","summary":"Pooling testing-versus-restudy comparisons favored retrieval for later recall. This supports self-testing as an ingredient. The exact two-week spacing and feedback example comes from the trainee trial."},{"source_id":"19930508","role":"Direct combined example","summary":"Forty trainees completed repeated testing with feedback versus repeated study. The first session was immediate and two further sessions were roughly two weeks apart. Six-month scores averaged 39% versus 26% on the studied material."},{"source_id":"SPACED-2021","role":"Review of combined practice","summary":"A review of 29 studies found better later retention when retrieval sessions were spaced rather than massed. This supports the combined learning approach. The specific two-week interval remains a trial example."}]},{"card_id":"flight-stockings","title":"Wear fitted stockings on a long flight","action":"Use properly fitted below-knee graduated compression stockings during a long flight if appropriate for you. Check fit and suitability before travel.","tracking_prompt":"Log use. Symptoms cannot establish this outcome at home.","goals":[],"benefit_ids":["flight-stockings-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Long-haul flyers, especially higher-risk","qualification":"The measured benefit involved silent clots detected by screening. Seek guidance on fit and suitability if you have arterial circulation or skin problems.","time_commitment":"Put on once per flight","display_evidence_in_details":true,"blocked_if":["compression_contraindicated"],"research_source_ids":["33878207","11377600"],"research_summary":"Nine flight trials contributed screened clot outcomes. One primary trial illustrates what screening detected. Symptomatic clot prevention remains unestablished.","source_notes":[{"source_id":"33878207","role":"Pooled research","summary":"Flight trials found fewer symptomless leg clots on screening with compression stockings. They could not estimate protection against symptomatic events."},{"source_id":"11377600","role":"Primary flight trial","summary":"Screening after long-haul flights found symptomless calf clots in the no-stocking group and none in those wearing stockings. This early trial illustrates the review evidence and should not be counted on top of it."}]},{"card_id":"fall-hazards","title":"Arrange a home fall-hazard assessment","action":"Arrange a home assessment with a trained professional and follow through on the recommended changes.","tracking_prompt":"Log completed changes and any falls.","goals":["movement"],"benefit_ids":["fall-hazards-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Older adults living at home who have elevated fall risk.","qualification":"The benefit applies to higher-risk older adults living in the community, especially people who have fallen or need help with daily activities. Arrange a trained assessor and implement their recommendations.","time_commitment":"One assessment followed by the time required to implement changes.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["FALL","34463746","10591231"],"research_summary":"The high-risk subgroup in the Cochrane review provides the card estimate. Broader home-modification reviews include different baseline risks and outcomes.","source_notes":[{"source_id":"FALL","role":"Pooled research","summary":"Home assessment and actual hazard reduction reduced the rate of falls in higher-risk older adults living in the community. The effect differed by baseline risk."},{"source_id":"34463746","role":"Secondary result only","summary":"A home-hazard intervention lowered the rate of falls in a secondary analysis. The primary measure, time to first fall, did not differ clearly. Attach only to the fall-rate interpretation."},{"source_id":"10591231","role":"Controlled trial","summary":"An occupational therapist assessed and helped modify homes. The benefit was concentrated among older adults who had previously fallen."}]},{"card_id":"handwash","title":"Wash hands regularly","action":"Wet your hands, lather with soap and scrub all surfaces for at least 20 seconds. Rinse and dry. Wash at key times, including before eating and after using the bathroom.","tracking_prompt":"Log the occasions you want to remember.","goals":[],"benefit_ids":["handwash-1"],"eligibility_rule":"read_studied_population","studied_population":"Community and household populations studied in hand-hygiene programs.","qualification":"The research studied hygiene programs and usual-care comparisons. It does not isolate the effect of precisely 20 seconds of washing.","time_commitment":"At least 20 seconds of scrubbing, plus rinsing and drying.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["37121242","35445655","CDC-HANDWASH","34408031"],"research_summary":"Community handwashing-promotion studies found fewer respiratory infections in some settings. Another review’s smaller soap-only comparison was inconclusive. CDC supplies the scrub-time instruction.","source_notes":[{"source_id":"37121242","role":"Pooled research","summary":"Handwashing-with-soap promotion programs reduced respiratory infections in low- and middle-income settings. The review evaluates programs rather than one wash duration."},{"source_id":"35445655","role":"Uncertain frequency estimate","summary":"A model of six community studies estimated a 3% reduction in daily infection probability per extra hand-hygiene event. Even its 80% credible interval included no difference. This cannot support a precise risk reduction or a wash duration."},{"source_id":"CDC-HANDWASH","role":"Scrubbing instructions","summary":"CDC explains how to scrub all hand surfaces with soap for at least 20 seconds. This source supplies the technique."},{"source_id":"34408031","role":"Mixed soap-specific findings","summary":"In one review, the three soap-and-water trials showed no clear respiratory infection reduction compared with control. Sanitiser results were clearer. The settings and number of soap trials differ from the larger handwashing-promotion review."}]},{"card_id":"water-premeal","title":"Drink water before meals in a structured weight program","action":"The trial used 500 mL of water before main meals alongside a reduced-calorie diet. Only consider this if that fluid intake fits your care plan.","tracking_prompt":"Track the routine and weekly weight if relevant.","goals":["metabolic"],"benefit_ids":["water-premeal-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults with obesity in primary care and adults aged 55–75 with overweight or obesity on a reduced-calorie diet.","qualification":"One trial used a reduced-calorie diet and the other provided weight-management advice. Avoid this fluid schedule if your clinician limits fluid or you have a condition requiring individualized intake.","time_commitment":"Before each main meal. The trial lasted 12 weeks.","display_evidence_in_details":true,"blocked_if":["fluid_restriction"],"research_source_ids":["19661958","26237305"],"research_summary":"Two independent 12-week trials tested 500 mL before meals alongside weight-management support. Both estimates favored water. In the primary-care trial the adjusted result included no difference.","source_notes":[{"source_id":"19661958","role":"Direct, combined program","summary":"Forty-eight adults aged 55–75 on a reduced-calorie diet were assigned to water before meals or diet alone. Weight loss over 12 weeks was about 2 kg greater with 500 mL water before each main meal."},{"source_id":"26237305","role":"Independent primary-care trial","summary":"Among 84 adults with obesity who received weight-management advice, 500 mL of water before main meals was associated with 1.3 kg more weight loss over 12 weeks than the attention control. The adjusted interval included no difference."}]},{"card_id":"drink-swap","title":"Replace a sugary drink with water","action":"Try replacing one sugary drink a day with plain water.","tracking_prompt":"Count how many sugary drinks you replace this week.","goals":["metabolic"],"benefit_ids":["drink-swap-1"],"eligibility_rule":"read_studied_population","studied_population":"Adults with overweight or obesity who regularly drink sugary beverages.","qualification":"The swap removes the sugar from that drink. In people with overweight or obesity, trials have not established how much weight, if any, is lost from switching to water.","time_commitment":"No extra time","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["38612997","22301929","35285920"],"research_summary":"Reviews that isolate water substitution find uncertain weight effects. Combined results for diet drinks and water cannot establish the water-only effect.","source_notes":[{"source_id":"38612997","role":"Inconclusive water-specific result","summary":"Replacing sugary drinks with water was associated with an estimated 0.81 kg lower weight in the relevant subgroup. Its 95% interval ran from 1.66 kg lower to 0.03 kg higher and includes no difference."},{"source_id":"22301929","role":"Inconclusive water-specific result","summary":"At six months mean weight loss in the water group did not clearly exceed the attention control. A separate positive analysis combined water and diet drinks. It cannot establish the effect of water alone."},{"source_id":"35285920","role":"Water-specific subgroup","summary":"Three trials in this review evaluated water in place of sugary drinks. Evidence for body weight was rated low certainty. Findings for low-calorie sweetened drinks cannot be attributed to water."}]},{"card_id":"eat-slowly","title":"Slow down at a meal","action":"Try eating a familiar meal more slowly, giving yourself time between bites.","tracking_prompt":"Record meal length and how full you feel.","goals":["metabolic"],"benefit_ids":["eat-slowly-1"],"eligibility_rule":"read_studied_population","studied_population":"Adults who eat quickly and overeat","qualification":"Jaw/TMJ, dental, swallowing difficulty - do not force counts","time_commitment":"During a meal. Studies varied in pace.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["24847856","39279635","24388483"],"research_summary":"A meal-level review and laboratory studies support reduced intake in some meals. Methods for slowing eating vary, and the evidence does not establish lasting weight loss.","source_notes":[{"source_id":"24847856","role":"Direct pooled result","summary":"Experimental meals consumed more slowly were associated with lower intake on average than faster meals. The designs and methods for changing eating rate varied."},{"source_id":"39279635","role":"Related food-texture study","summary":"Researchers changed food texture to slow eating. Participants consumed less energy at those meals. This provides context for eating rate, while testing a different action from deliberately slowing down."},{"source_id":"24388483","role":"Controlled trial","summary":"A fast-versus-slow eating comparison found lower intake in the normal-weight subgroup. The group-by-weight interaction was not significant."}]},{"card_id":"three-good-things","title":"Write down three good things","action":"For one week, write down three things that went well each night and why they happened.","tracking_prompt":"Rate wellbeing before and after the week.","goals":["mood"],"benefit_ids":["three-good-things-1"],"eligibility_rule":"read_studied_population","studied_population":"General adults seeking small mood lift","qualification":"Different gratitude exercises have been studied. Average wellbeing effects were small and depended on the comparison activity.","time_commitment":"A few minutes each evening for one week.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["40627390","16045394","37217328"],"research_summary":"One online trial supports the nightly exercise. A different prompting schedule produced small positive-affect changes in healthcare workers, with no clear life-satisfaction benefit.","source_notes":[{"source_id":"40627390","role":"Broader gratitude research","summary":"Across 163 samples, diverse gratitude exercises produced a small average wellbeing improvement. This estimate includes many exercises and should not be presented as the effect of writing three good things."},{"source_id":"16045394","role":"Direct, specific exercise","summary":"The full report describes a week of writing three things that went well and why. Participants reported greater happiness at later follow-ups than those writing about early memories. This is the link for the exact exercise."},{"source_id":"37217328","role":"Different schedule and outcomes","summary":"Healthcare workers were prompted three times weekly to name good things. Positive affect showed a small improvement. Life satisfaction and depressive symptoms did not clearly differ between groups. This differs from nightly writing about why events happened."}]},{"card_id":"mindfulness","title":"Try a brief guided mindfulness practice","action":"Try a guided meditation for about ten minutes daily for eight weeks.","tracking_prompt":"Rate perceived stress weekly.","goals":["mood"],"benefit_ids":["mindfulness-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Employees with mild to moderate stress.","qualification":"The workplace trial used a guided meditation app for eight weeks. Stop if distress increases and seek appropriate support.","time_commitment":"10 min/day","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["39808431","31237569","34962055"],"research_summary":"Trials in employees and students found lower perceived stress with guided digital mindfulness compared with waiting-list controls.","source_notes":[{"source_id":"39808431","role":"Direct, tested prescription","summary":"In 1,458 stressed employees, assignment to an app providing ten minutes of daily meditation for eight weeks improved perceived stress compared with waiting list. Actual usage varied."},{"source_id":"31237569","role":"Direct, student sample","summary":"Stressed college students assigned to an app-based mindfulness program reported lower perceived stress than a wait-list group. This extends the finding to another study population."},{"source_id":"34962055","role":"Independent student trial","summary":"Working university students assigned to an eight-week mindfulness app reported lower stress than wait-listed students. It supports perceived stress in a different sample."}]},{"card_id":"left-side","title":"Try positional therapy for nighttime reflux","action":"In one trial, adults wore a device at night for two weeks that prompted them to turn away from their right side. Choosing the left side yourself is a less-tested option.","tracking_prompt":"Record nighttime reflux symptoms.","goals":["digestion"],"benefit_ids":["left-side-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults with nocturnal reflux","qualification":"The controlled trial used a device that discouraged right-side sleeping. The benefit of choosing the left side without a device is less certain.","time_commitment":"During sleep. The device trial lasted two weeks.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["35301135","37969463"],"research_summary":"The direct symptom result comes from a two-week device trial. Other positioning devices or combined incline-and-side approaches do not isolate choosing the left side unaided.","source_notes":[{"source_id":"35301135","role":"Controlled trial","summary":"A wearable device encouraged left-side sleep for two weeks. Nighttime reflux symptoms improved relative to a sham device."},{"source_id":"37969463","role":"Review including the same trial","summary":"The review found evidence linking left-side position to lower acid exposure and summarized the same device trial that reported symptom relief. It adds context without providing another independent device trial."}]},{"card_id":"music","title":"Listen to music before bed","action":"Try listening to calming recorded music for about 30–45 minutes at bedtime. Studies used different selections and schedules.","tracking_prompt":"Rate sleep quality the next morning.","goals":["sleep"],"benefit_ids":["music-1"],"eligibility_rule":"read_studied_population","studied_population":"Adults with sleep difficulties.","qualification":"Research supports perceived sleep quality. Objective sleep duration and sleep stages remain uncertain.","time_commitment":"About 30–45 minutes at bedtime.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["36000763","15660547","18426457","30676671"],"research_summary":"A Cochrane review supports better self-rated sleep quality. Another trial reported better perceived sleep but an inconclusive result on its primary insomnia-severity measure.","source_notes":[{"source_id":"36000763","role":"Pooled research","summary":"A Cochrane review found better perceived sleep quality among adults with insomnia symptoms. Objective sleep measurements were less conclusive."},{"source_id":"15660547","role":"Direct primary example","summary":"Older adults listening to soothing bedtime music reported better sleep quality over the intervention period than controls. Perceived sleep quality was the relevant endpoint."},{"source_id":"18426457","role":"Direct primary example","summary":"Young adults with sleep complaints who listened to 45 minutes of relaxing classical music at bedtime for three weeks reported improved sleep quality on a questionnaire."},{"source_id":"30676671","role":"Mixed findings across sleep measures","summary":"In adults with insomnia, bedtime music improved perceived sleep on a secondary measure. The primary comparison on insomnia severity was inconclusive, and objective sleep measures showed no change."}]},{"card_id":"smell-training","title":"Practice smell training","action":"After evaluation for persistent postviral smell loss, one approach is to gently smell four familiar scents twice daily. Research protocols included 12-week training blocks and longer programs. Avoid irritants and direct nasal application.","tracking_prompt":"Log sessions and which scents you can identify.","goals":[],"benefit_ids":["smell-training-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Adults with persistent post-viral smell loss","qualification":"Persistent or unexplained smell loss merits clinical assessment. Avoid putting oils or other substances inside your nose.","time_commitment":"Twice daily. Training duration varied across studies.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["32567798","23929687","32660334","42311058"],"research_summary":"A postviral review and a separate review of ten post-COVID trials support improved smell-test performance. The training protocols and viral causes differ.","source_notes":[{"source_id":"32567798","role":"Direct review, varied protocols","summary":"An evidence review recommends repeated odor training for postviral smell loss based on changes in measured olfactory function. Protocols and odor sets differed across the studies."},{"source_id":"23929687","role":"Different duration and comparison","summary":"People with postinfectious smell loss trained with stronger or weaker odors for 18 weeks. Improvement on testing was more common in the higher-concentration arm. Both groups trained, limiting inference about training versus usual care."},{"source_id":"32660334","role":"Postviral training review","summary":"Across four pooled studies, trained participants were more likely than controls to improve by a clinically important amount on an odor test. Training protocols varied."},{"source_id":"42311058","role":"Post-COVID subgroup","summary":"Ten randomized trials in post-COVID smell loss found a small average improvement in objective smell scores. The finding applies to this postviral subgroup across varied protocols."}]},{"card_id":"prunes","title":"Try prunes for constipation","action":"The studied schedule was 50 g of prunes twice daily for three weeks in adults with constipation.","tracking_prompt":"Count complete bowel movements weekly.","goals":["digestion"],"benefit_ids":["prunes-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Chronic constipation; 37 women, 3 men; mean age 38","qualification":"A small crossover trial tested this exact schedule. A second comparison also observed improved bowel frequency from baseline. Large servings may cause bloating or loose stools.","time_commitment":"Two daily portions for three weeks.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["21323688","34074830"],"research_summary":"Two constipation studies support the bowel-frequency finding. Trials in other populations measuring total stools do not directly replicate the complete spontaneous bowel movement outcome.","source_notes":[{"source_id":"21323688","role":"Direct exact schedule","summary":"Forty adults with constipation crossed over between dried plums and psyllium. Fifty grams of dried plums twice daily for three weeks improved complete spontaneous bowel movements and stool consistency relative to psyllium."},{"source_id":"34074830","role":"Direct for bowel frequency","summary":"Adults with constipation ate 100 g of prunes daily for four weeks. Bowel frequency improved from baseline, with similar response rates across treatments. The other trial tested 50 g twice daily for three weeks."}]},{"card_id":"cystitis","title":"Add water for recurrent cystitis prevention","action":"The trial added 1.5 L of water daily to usual intake in selected women drinking under 1.5 L of fluid daily. Confirm that the eligibility and fluid plan fit.","tracking_prompt":"Log episodes diagnosed by a clinician. This routine is for prevention.","goals":[],"benefit_ids":["cystitis-1"],"eligibility_rule":"clinician_clearance","studied_population":"Premenopausal women with recurrent cystitis and usual total fluid intake below 1.5 L/day. See the full eligibility criteria.","qualification":"Prevention in healthy premenopausal women with at least three symptomatic episodes in the prior year, at least one culture-confirmed, and low usual fluid intake. Exclude current symptoms, pregnancy, breastfeeding and fluid restriction. New urinary symptoms require assessment.","time_commitment":"Extra water spread throughout the day for 12 months in the trial.","display_evidence_in_details":true,"blocked_if":["current_urinary_symptoms","pregnancy","breastfeeding","fluid_restriction"],"research_source_ids":["30285042","31988085"],"research_summary":"One water-only trial directly supports the extra 1.5 L daily in this population. A broader fluid review found fewer episodes overall, with uncertainty about who had any recurrence at one year.","source_notes":[{"source_id":"30285042","role":"Direct prevention trial","summary":"Among 140 premenopausal women with recurrent cystitis and low fluid intake, adding 1.5 L of water daily resulted in 1.7 versus 3.2 episodes on average over a year. The study concerned prevention."},{"source_id":"31988085","role":"Broader recurrence review","summary":"A review of increased fluid intake found fewer recurrent urinary infections overall. At 12 months the difference in the proportion with any recurrence was inconclusive. It pools different fluid interventions and does not independently verify the card’s exact water dose."}]},{"card_id":"dash","title":"Build meals around the DASH pattern","action":"Build meals around vegetables, fruit, whole grains and low-fat dairy, with less saturated fat. Use the studied dietary pattern as the reference.","tracking_prompt":"Track adherence and average home blood pressure.","goals":["heart"],"benefit_ids":["dash-1","dash-2"],"eligibility_rule":"read_studied_population","studied_population":"Adults SBP <160 and DBP 80–95 mmHg","qualification":"Adapt to allergies and prescribed diets. Kidney disease or potassium/fluid restrictions require clinical dietary advice; do not change medication. ","time_commitment":"A daily eating pattern. Shopping and preparation time vary.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["9099655","32330233"],"research_summary":"A controlled feeding trial and a DASH-specific review support lower blood pressure. Reviews of multiple dietary patterns add little to this specific comparison.","source_notes":[{"source_id":"9099655","role":"Direct feeding trial","summary":"With sodium intake and body weight held constant, participants assigned the DASH combination diet saw greater reductions in systolic and diastolic pressure than those on the control diet."},{"source_id":"32330233","role":"Pooled research","summary":"Randomized trials of the DASH pattern found lower systolic and diastolic pressure. Sodium intake and other trial conditions varied."}]},{"card_id":"walking-breaks","title":"Break up a seated workday with walks","action":"Choose a studied schedule below. The blood pressure and fatigue findings apply to the light walking schedules.","tracking_prompt":"Log walks and rate fatigue at the same time on comparable days.","goals":["heart","mood","energy"],"benefit_ids":["walking-breaks-1","walking-breaks-2","walking-breaks-3"],"eligibility_rule":"read_studied_population","studied_population":"Sedentary adults completing prolonged sitting days. The exact age and health criteria varied by schedule.","qualification":"These were short laboratory comparisons with prolonged sitting. The studies did not establish a lasting blood-pressure or mood effect.","time_commitment":"Five minutes per break on the chosen schedule.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["36728338","27809874","37682412"],"research_summary":"Laboratory studies support same-day effects of walking breaks. A broader blood-pressure review cannot assign mood or fatigue effects to particular schedules.","source_notes":[{"source_id":"36728338","role":"Direct light-walk schedules","summary":"In 11 adults, light walks interrupted laboratory sitting and lowered same-day systolic pressure. Figure 3 supports fatigue and mood findings for the five-minute light-walk schedules. Preserve the separate moderate-walk citation."},{"source_id":"27809874","role":"Direct moderate-walk schedule","summary":"Thirty sedentary adults completed uninterrupted sitting and two activity conditions. Six hourly five-minute moderate walks improved self-rated mood and reduced fatigue compared with sitting. A morning half-hour walk did not show those same results."},{"source_id":"37682412","role":"Broader sitting-break evidence","summary":"Pooled laboratory studies found that interrupting prolonged sitting attenuated increases in blood pressure. The interventions varied. It does not establish mood changes or a particular walking schedule."}]},{"card_id":"one-brisk-walk","title":"Try a ten-minute brisk walk","action":"Take one ten-minute walk at a self-selected brisk pace if appropriate.","tracking_prompt":"Rate fatigue before and shortly after the walk.","goals":["energy"],"benefit_ids":["one-brisk-walk-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Active college-aged adults; mean 21.3; eligible 18–53","qualification":"One study in active young adults measured fatigue immediately afterward.","time_commitment":"One ten-minute walk.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["30087839"],"research_summary":"One small study directly supports lower fatigue after a ten-minute walk versus before the walk. Earlier walking studies emphasized energy or tension, and stair studies changed the activity.","source_notes":[{"source_id":"30087839","role":"Controlled trial","summary":"After a ten-minute brisk walk, young adults reported less fatigue than before. The study reported an overall group-by-time interaction and within-group changes."}]},{"card_id":"nap","title":"Try a brief post-lunch nap opportunity","action":"Allow 15 minutes for a post-lunch nap. The research tested an opportunity to sleep in young adults after restricted sleep.","tracking_prompt":"Record sleepiness afterward.","goals":["energy"],"benefit_ids":["nap-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Young adults after a night of restricted sleep.","qualification":"Allow time to wake fully. The finding comes from young adults after a short night and cannot establish fitness to drive.","time_commitment":"One 15-minute opportunity to sleep, plus time to wake fully.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["11007448","16796222","11322712"],"research_summary":"Short lab trials after restricted sleep support improved afternoon alertness. The study allowing a 15-minute nap opportunity differs from studies timing actual sleep.","source_notes":[{"source_id":"11007448","role":"Direct, nap opportunity","summary":"Twelve students after a restricted night were less sleepy at two afternoon assessments when allowed a 15-minute post-lunch nap than when kept awake. They slept an average of 10.2 minutes."},{"source_id":"16796222","role":"Related duration measure","summary":"After restricted sleep, ten minutes of actual nap sleep improved immediate alertness in a small lab trial. Five, 20 and 30 minutes had different effects. The 15-minute time allowance is supported by the other paper."},{"source_id":"11322712","role":"Related nap duration","summary":"After restricted sleep, ten minutes of afternoon sleep improved subjective alertness immediately. Some testing after a 30-minute nap showed early grogginess. Time asleep differs from a 15-minute opportunity to nap."}]},{"card_id":"oats","title":"Choose oats with a stated beta-glucan amount","action":"Choose oat foods that state their oat beta-glucan content. Use the label to reach about 3 g per day. Total fiber on the label is a different measure.","tracking_prompt":"Log the labeled amount. A lipid panel measures the outcome.","goals":["heart"],"benefit_ids":["oats-1"],"eligibility_rule":"read_studied_population","studied_population":"Adults with dyslipidemia","qualification":"Use the labeled amount of oat beta-glucan. Products vary widely. People who need gluten-free foods should choose appropriately labeled oats.","time_commitment":"Daily food choice; at least several weeks in trials.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["25411276","27724985","20660224","35631184"],"research_summary":"Several reviews support lower LDL with oat beta-glucan, with overlapping trials. The product, processing and amount of beta-glucan affect applicability.","source_notes":[{"source_id":"25411276","role":"Pooled research","summary":"Controlled trials using at least 3 g/day of oat beta-glucan found lower LDL compared with control diets. The active amount refers specifically to oat beta-glucan."},{"source_id":"27724985","role":"Pooled research","summary":"A second oat beta-glucan synthesis reported lower LDL across 58 trials. The two syntheses may include many of the same trials."},{"source_id":"20660224","role":"Direct, product-specific result","summary":"Cereals providing 3 g daily of high- or medium-molecular-weight oat beta-glucan lowered LDL by about 5%. The low-molecular-weight preparation was less effective."},{"source_id":"35631184","role":"Overlapping lipid review","summary":"A review in adults with high cholesterol found lower average LDL with oat beta-glucan. Dose, product and study duration varied, and earlier reviews may include the same trials."}]},{"card_id":"pelvic-floor","title":"Follow a supervised pelvic-floor training plan","action":"Arrange supervised training with a qualified clinician. NICE recommends a program lasting at least three months, with at least eight contractions three times a day, adapted to the person.","tracking_prompt":"Keep a bladder diary if recommended.","goals":[],"benefit_ids":["pelvic-floor-1"],"eligibility_rule":"clinician_clearance","studied_population":"Women with stress urinary incontinence.","qualification":"For women with stress urinary incontinence. A clinician should check technique and tailor the program. Supervision is part of the recommendation.","time_commitment":"Three sets daily for at least three months, with supervision.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["30288727","NICE"],"research_summary":"Controlled trials support improved stress incontinence. NICE supplies the supervised schedule. Supervised-versus-unsupervised studies ask a different question.","source_notes":[{"source_id":"30288727","role":"Pooled research","summary":"A Cochrane review compared pelvic-floor training with inactive controls and found symptom improvement in women with stress incontinence."},{"source_id":"NICE","role":"Supervised training schedule","summary":"Sections 1.4.4–1.4.5 recommend at least three months of supervised training for women with stress or mixed incontinence and at least eight contractions three times daily. This is guidance on the program rather than an independent effect estimate."}]},{"card_id":"handgrip","title":"Practice isometric handgrip training","action":"Start with a qualified exercise professional to set the grip force. One example uses four two-minute holds at about 30% of maximum, with three-minute rests, on three days weekly for at least eight weeks.","tracking_prompt":"Log sessions and average blood pressure measured at rest.","goals":["heart"],"benefit_ids":["handgrip-1"],"eligibility_rule":"clinician_clearance","studied_population":"Normotensive and hypertensive adults","qualification":"A suitable force-measuring device and an initial supervised session are needed. Breathe normally. Uncontrolled blood pressure, recent cardiac events or exercise restrictions require clinical assessment. The systolic result is more consistent across reviews than the diastolic result.","time_commitment":"Four two-minute holds plus recoveries, three days weekly for at least eight weeks.","display_evidence_in_details":true,"blocked_if":["exercise_restriction"],"research_source_ids":["41922197","28033302","34140663"],"research_summary":"Reviews support lower resting systolic pressure on average. A smaller review in treated hypertension found an inconclusive diastolic effect.","source_notes":[{"source_id":"41922197","role":"Direct pooled result","summary":"In 31 studies, systolic and diastolic pressure were lower by about 5.4 and 2.7 mmHg on average. Results differed markedly across studies. The four-set protocol is an evidence-informed example."},{"source_id":"28033302","role":"Controlled trial","summary":"Eight weeks of handgrip training at 30% maximum was compared with lower intensity. Systolic pressure fell within the higher-intensity group; its diastolic change was not significant."},{"source_id":"34140663","role":"Endpoint-specific uncertainty","summary":"Across trials in people with treated hypertension, handgrip training lowered resting systolic pressure, while the diastolic estimate was imprecise. Keep the diastolic result qualified."}]},{"card_id":"tai-chi","title":"Join a fall-prevention tai chi program","action":"Choose an instructor-led tai chi program designed for fall prevention. One trial offered classes three times weekly for six months. A second tested a twice-weekly therapeutic program for 24 weeks.","tracking_prompt":"Record class attendance and any falls.","goals":["movement"],"benefit_ids":["tai-chi-1"],"eligibility_rule":"confirm_eligibility","studied_population":"Inactive community adults aged 70–92","qualification":"For older adults at elevated fall risk who can participate in a supervised class. The benefit pertains to tested fall-prevention programs.","time_commitment":"Instructor-led classes for about six months.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["15814861","30208396","37736087"],"research_summary":"Structured programs reduce falls in older adults across trials. Keep evidence on all falls separate from the particular trial measuring repeat falling.","source_notes":[{"source_id":"15814861","role":"Controlled trial","summary":"Older adults in a supervised tai chi program had fewer repeated falls compared with stretching over six months."},{"source_id":"30208396","role":"Related total-fall result","summary":"Among 670 older adults at increased fall risk, twice-weekly therapeutic tai ji quan produced fewer falls than stretching over 24 weeks. Its primary endpoint counted all falls. Cite the earlier trial specifically for repeat falling."},{"source_id":"37736087","role":"Broader fall prevention evidence","summary":"A pooled analysis favored tai chi for preventing falls in older adults across differing programs. Total falls and balance outcomes cannot be substituted for repeat falling on the card."}]},{"card_id":"neck-strength","title":"Follow a taught resistance routine for neck and shoulder pain","action":"Ask a physical therapist to teach the studied elastic-band lateral raise and progression. The short schedule used one slow set for up to two minutes on five workdays per week for ten weeks. A longer tested option appears in the details.","tracking_prompt":"Track pain on the same scale once a week and record training days.","goals":["movement"],"benefit_ids":["neck-strength-1"],"eligibility_rule":"clinician_clearance","studied_population":"Workers ≥ 30 h/week with frequent neck/shoulder pain; 174 women, 24 men","qualification":"The trial included initial therapist instruction and planned resistance progression. Seek assessment for new, severe or unexplained pain.","time_commitment":"Two or twelve minutes per session, five workdays weekly for ten weeks.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["21177034","25574172"],"research_summary":"One trial directly supports the tested workday routine, with a companion report for the instructions. Muscle-activity findings do not independently establish pain relief.","source_notes":[{"source_id":"21177034","role":"Controlled trial","summary":"Symptomatic workers received taught progressive band exercises for two or twelve minutes on workdays. Both groups reported less neck or shoulder pain than controls."},{"source_id":"25574172","role":"Tested exercise instructions","summary":"The companion report describes the same workplace intervention, including technique, progression, and sets for the two-minute and twelve-minute options."}]},{"card_id":"sleep-extension","title":"Work with a counselor to extend short sleep","action":"With individualized sleep counseling, plan enough time in bed to allow about 8.5 hours nightly and review the plan at follow-up. The trial enrolled habitual short sleepers with overweight.","tracking_prompt":"Track sleep opportunity and sleep duration separately. A food diary cannot reproduce the trial’s energy-balance measurement.","goals":["sleep","metabolic"],"benefit_ids":["sleep-extension-1","sleep-extension-2"],"eligibility_rule":"clinician_clearance","studied_population":"Adults 21–40, BMI 25–29.9, habitual sleep <6.5 h/night; no sleep apnea or insomnia","qualification":"The study enrolled adults aged 21–40 with overweight who usually slept less than 6.5 hours. Insomnia and sleep apnea were excluded. The trial included individualized counseling and follow-up.","time_commitment":"Nightly for two weeks after individualized counseling.","display_evidence_in_details":true,"blocked_if":[],"research_source_ids":["35129580","34507028"],"research_summary":"A broader review supports increased sleep duration. The objectively estimated energy-intake result remains tied to one two-week trial in short sleepers with overweight.","source_notes":[{"source_id":"35129580","role":"Controlled trial","summary":"Individualized counseling increased measured sleep duration and reduced energy intake over two weeks in short-sleeping adults with overweight. Both results came from the same trial."},{"source_id":"34507028","role":"Broader research","summary":"Sleep-extension interventions increased sleep duration across populations, with substantial variation. This review does not establish lower energy intake."}]}],"benefits":[{"benefit_id":"walk-after-meals-1","card_id":"walk-after-meals","statement":"Smaller rise in blood glucose in the hours after a meal compared with continued sitting","goals":["metabolic"],"population":"Sedentary adults, mostly healthy or overweight/obese adults in lab test meals","comparator":"Uninterrupted sitting","timeframe":"Acute, hours after a single test meal","sou 9580","34507028"]},{"benefit_id":"sleep-extension-2","card_id":"sleep-extension","statement":"Lower measured energy intake over two weeks in the same group","goals":["metabolic"],"population":"Adults 21–40, BMI 25–29.9, habitual sleep <6.5 h/night; no sleep apnea or insomnia","comparator":"habitual sleep with study contact","timeframe":"2-week intervention","source_urls":["https://pubmed.ncbi.nlm.nih.gov/35129580/"],"evidence_label":"Research supported","effect_detail":"About 270 fewer kcal per day on average than controls over the two-week intervention. Long-term weight change was outside this endpoint.","audience_filter":null,"display_scope":"card","source_ids":["35129580"]}],"variants":[{"variant_id":"stairs-1","card_id":"stairs","action":"Three times a day, at least 1 hour apart, climb stairs fast: about 60 steps (about 3 flights) or about 30 seconds all-out (about 6 flights). Do this 3 days a week for 6 weeks.","time":"About 3 bouts x 20-30 s = 1 to 1.5 min of climbing per day on 3 days a week.","population":"Sedentary young adults (Jenkins n=12/arm; Yin n=14 snacks, 15 control)","benefit_ids":["stairs-1"],"schedule_evidence":"Studied protocol. See source record.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/30649897/","https://pubmed.ncbi.nlm.nih.gov/38569204/"],"source_ids":["30649897","38569204"]},{"variant_id":"stairs-2","card_id":"stairs","action":"One session: 3 minutes easy warm-up, then climb stairs fast for 20 seconds, recover 2 minutes, repeat 3 times. 5 days a week for 4 weeks.","time":"3 min warm-up + 3 x 20 s climbing (1 min) + 2 x 2 min recoveries (4 min) = 8 min; with a third recovery, about 10 min per day.","population":"Inactive young men with obesity (n=12 vs 12 control, age ~26, BMI ~27)","benefit_ids":["stairs-1"],"schedule_evidence":"This exact schedule was studied in one small trial in young men. Other stair schedules help support the broader fitness finding.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/40087042/"],"source_ids":["40087042"]},{"variant_id":"walking-breaks-1","card_id":"walking-breaks","action":"Across an eight-hour sitting day, take a five-minute light walk every 30 minutes. The experiment used a level treadmill at 2 mph (3.2 km/h); a flat-route walk is a practical adaptation.","time":"Repeated throughout 8 hours. Budget up to 80 minutes walking plus transitions; this is a scheduling allowance, not a verified trial bout count.","population":"Sedentary adults ≥ 45; mean 57; 2 taking antihypertensives","benefit_ids":["walking-breaks-1","walking-breaks-2","walking-breaks-3"],"schedule_evidence":"Studied protocol. See source record.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/36728338/"],"source_ids":["36728338"]},{"variant_id":"walking-breaks-2","card_id":"walking-breaks","action":"Across an eight-hour sitting day, take a five-minute light walk every 60 minutes. The study used a level treadmill at 2 mph (3.2 km/h); ordinary flat-route walking is an adaptation.","time":"Repeated throughout 8 hours. Budget up to 40 minutes walking plus transitions; scheduling allowance, not a verified trial bout count.","population":"Sedentary adults ≥ 45; mean 57; 2 taking antihypertensives","benefit_ids":["walking-breaks-1","walking-breaks-2","walking-breaks-3"],"schedule_evidence":"Studied protocol. See source record.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/36728338/"],"source_ids":["36728338"]},{"variant_id":"walking-breaks-3","card_id":"walking-breaks","action":"Walk for five minutes at moderate effort, once each hour for six bouts. Aim for the studied perceived effort of 12–13 on the 6–20 Borg scale: somewhat hard. The study used individualized treadmill speed/incline.","time":"30 minutes of walking across a 6-hour day, plus transitions. One experimental day per condition.","population":"Healthy sedentary adults 25–50, BMI 18.5–29.9; 21 women/9 men","benefit_ids":["walking-breaks-2","walking-breaks-3"],"schedule_evidence":"Studied protocol. See source record.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/27809874/"],"source_ids":["27809874"]},{"variant_id":"walk-after-meals-1","card_id":"walk-after-meals","action":"One practical option is a two-minute easy walk every 30 minutes for three hours after a meal. The trial tested that interval for five hours.","time":"Six two-minute walks total 12 minutes in the three-hour example.","population":"Adults interrupting prolonged sitting after a meal.","benefit_ids":["walk-after-meals-1","walk-after-meals-2"],"schedule_evidence":"Two minutes every 30 minutes was tested for five hours after a standardized drink in sedentary men. Three hours is a shorter app example.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/42627002/"],"source_ids":["42627002"]},{"variant_id":"walk-after-meals-2","card_id":"walk-after-meals","action":"Walk ten minutes after each main meal.","time":"Three ten-minute walks per day in the trial.","population":"Adults with type 2 diabetes for whom walking is suitable.","benefit_ids":["walk-after-meals-3"],"schedule_evidence":"Tested against one 30-minute daily walk without specified meal timing.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/27747394/"],"audience_filter":"type_2_diabetes","source_ids":["27747394"]},{"variant_id":"neck-strength-1","card_id":"neck-strength","action":"Tested package: initially therapist-taught lateral raises with elastic tubing, one slow set up to fatigue or 2 minutes, 5 workdays/week for 10 weeks; resistance progressed using a manual. Do not substitute an arbitrary band routine.","time":"","population":"Workers ≥ 30 h/week with frequent neck/shoulder pain; 174 women, 24 men","benefit_ids":["neck-strength-1"],"schedule_evidence":"Studied with initial therapist instruction and a progression plan.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/25574172/","https://pubmed.ncbi.nlm.nih.gov/21177034/"],"source_ids":["25574172","21177034"]},{"variant_id":"neck-strength-2","card_id":"neck-strength","action":"Tested package: initially therapist-taught lateral raises, 5–6 sets of 8–12 repetitions, new sets about every 2 minutes, 12 minutes/session, 5 workdays/week for 10 weeks; manual-guided resistance progression.","time":"","population":"Workers ≥ 30 h/week with frequent neck/shoulder pain; 174 women, 24 men","benefit_ids":["neck-strength-1"],"schedule_evidence":"Studied with initial therapist instruction and a progression plan.","source_urls":["https://pubmed.ncbi.nlm.nih.gov/25574172/","https://pubmed.ncbi.nlm.nih.gov/21177034/"],"source_ids":["25574172","21177034"]}],"research_sources":[{"source_id":"10591231","title":"Home visits by an occupational therapist for assessment and modification of environmental hazards: a randomized trial of falls prevention.","url":"https://pubmed.ncbi.nlm.nih.gov/10591231/","year":"1999","role":"Controlled trial","what_it_shows":"An occupational therapist assessed and helped modify homes. The benefit was concentrated among older adults who had previously fallen.","authors":"Cumming RG, Thomas M, Szonyi G, Salkeld G, O'Neill E, Westbury C, Frampton G.","doi":"10.1111/j.1532-5415.1999.tb01556.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"10877480","title":"A field study of supplementary rest breaks for data-entry operators.","url":"https://pubmed.ncbi.nlm.nih.gov/10877480/","year":"2000","role":"Direct occupational result","what_it_shows":"Data-entry operators reported smaller increases in discomfort and eyestrain during periods with four additional five-minute breaks. Data-entry performance was maintained.","authors":"Galinsky TL, Swanson NG, Sauter SL, Hurrell JJ, Schleifer LM.","doi":"10.1080/001401300184297","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"11007448","title":"Maintenance of alertness and performance by a brief nap after lunch under prior sleep deficit.","url":"https://pubmed.ncbi.nlm.nih.gov/11007448/","year":"2000","role":"Direct, nap opportunity","what_it_shows":"Twelve students after a restricted night were less sleepy at two afternoon assessments when allowed a 15-minute post-lunch nap than when kept awake. They slept an average of 10.2 minutes.","authors":"Takahashi M, Arito H.","doi":"10.1093/sleep/23.6.1h","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"12221048","title":"Dose response of almonds on coronary heart disease risk factors: blood lipids, oxidized low-density lipoproteins, lipoprotein(a), homocysteine, and pulmonary nitric oxide: a randomized, controlled, crossover trial.","url":"https://pubmed.ncbi.nlm.nih.gov/12221048/","year":"2002","role":"Direct LDL trial","what_it_shows":"Whole almonds used as snacks lowered LDL in adults with elevated cholesterol in a crossover comparison with control snacks. The tested amounts differed, so this trial does not fix a universal serving.","authors":"Jenkins DJ, Kendall CW, Marchie A, Parker TL, Connelly PW, Qian W, Haight JS, Faulkner D, Vidgen E, Lapsley KG, Spiller GA.","doi":"10.1161/01.cir.0000028421.91733.20","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"15660547","title":"Music improves sleep quality in older adults.","url":"https://pubmed.ncbi.nlm.nih.gov/15660547/","year":"2005","role":"Direct primary example","what_it_shows":"Older adults listening to soothing bedtime music reported better sleep quality over the intervention period than controls. Perceived sleep quality was the relevant endpoint.","authors":"Lai HL, Good M.","doi":"10.1111/j.1365-2648.2004.03281.x","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"15814861","title":"Tai Chi and fall reductions in older adults: a randomized controlled trial.","url":"https://pubmed.ncbi.nlm.nih.gov/15814861/","year":"2005","role":"Controlled trial","what_it_shows":"Older adults in a supervised tai chi program had fewer repeated falls compared with stretching over six months.","authors":"Li F, Harmer P, Fisher KJ, McAuley E, Chaumeton N, Eckstrom E, Wilson NL.","doi":"10.1093/gerona/60.2.187","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"16045394","title":"Positive psychology progress: empirical validation of interventions.","url":"https://pubmed.ncbi.nlm.nih.gov/16045394/","year":"2005","role":"Direct, specific exercise","what_it_shows":"The full report describes a week of writing three things that went well and why. Participants reported greater happiness at later follow-ups than those writing about early memories. This is the link for the exact exercise.","authors":"Seligman ME, Steen TA, Park N, Peterson C.","doi":"10.1037/0003-066x.60.5.410","review_basis":"Abstract and original paper, three-good-things exercise","publication_type":"Primary study"},{"source_id":"16170978","title":"Comparative efficacy of a new battery-powered toothbrush and a commercially available manual toothbrush on the removal of established supragingival plaque: a single-use crossover study in adults.","url":"https://pubmed.ncbi.nlm.nih.gov/16170978/","year":"2005","role":"Controlled trial","what_it_shows":"In a single-use crossover comparison, one battery-powered brush removed more plaque than a manual brush. The finding concerns the tested models.","authors":"Singh S, Rustogi KN, Chaknis P, Petrone ME, DeVizio W, Proskin HM.","doi":"","review_basis":"Publication abstract","publication_type":"Primary study"},{"source_id":"16269526","title":"Effect of low-repetition jump training on bone mineral density in young women.","url":"https://pubmed.ncbi.nlm.nih.gov/16269526/","year":"2006","role":"Direct, one specific regimen","what_it_shows":"In young women, femoral-neck density rose from baseline after six months of ten maximal jumps three times weekly. The pooled estimate on the card comes from the review of multiple programs.","authors":"Kato T, Terashima T, Yamashita T, Hatanaka Y, Honda A, Umemura Y.","doi":"10.1152/japplphysiol.00666.2005","review_basis"
