/* ---------- the recommendation set ----------
   One to three goals give three habits; four or more give one per goal, up to five. Each pick is the best-fitting
   habit for its goal that isn't already in the set, preferring habits that help several of the chosen goals.
   The set is chosen to fit the daily time budget where possible; if it can't, the cards say so and the person
   decides (see addPick). Recommendations are choices: nothing is added until the person adds it. */
function recSet(o) {
  const gs = onbGoals(o); const prefs = o.prefs; const cap = HM.timeCap(prefs.time);
  const exclude = st.plan.filter(p => !p.removed).map(p => p.hid);
  const target = gs.length <= 3 ? 3 : Math.min(5, gs.length);
  const lists = (gs.length ? gs : [null]).map(g => ({ g, list: HM.recommend({ goal: g, overall: !g, refine: g ? o.refines[g] : null, prefs }, exclude) }));
  const score = x => x.sc + benefitGoals(x.h, gs).length * 2.5;
  const out = []; let used = 0; const ids = new Set();
  const pickFor = (L, budget) => L.list.filter(x => !ids.has(x.h.id)).map(x => ({ ...x, s2: score(x) })).sort((a, b) => b.s2 - a.s2)
    .find(x => budget == null || (x.h.d.mins || 0) <= budget);
  for (let round = 0; out.length < target && round < 4; round++) {
    let added = false;
    for (const L of lists) {
      if (out.length >= target) break;
      let x = pickFor(L, cap == null ? null : cap - used); let over = false;
      if (!x && round === 0) { x = pickFor(L, null); over = !!x; }     // nothing fits the remaining time: show the best one and say so
      if (!x) continue;
      ids.add(x.h.id); used += x.h.d.mins || 0; out.push({ h: x.h, f: x.f, g: L.g, over }); added = true;
    }

  }

}
const setMins = (o, which) => (o.set || []).filter(x => which(x)).reduce((m, x) => m + (x.h.d.mins || 0), 0);
const chosen = o => (o.set || []).filter(x => o.pick[x.h.id] === "add");

  const cap = HM.timeCap(o.prefs.time); const all = setMins(o, () => true);

  if (cap == null) return all ? `Together about ${all} minutes a day.` : "";
  return all <= cap ? `Together about ${all} minutes a day, within your ${tLabel(o.prefs.time).toLowerCase()}.` : `All of them together would take about ${all} minutes, more than your ${tLabel(o.prefs.time).toLowerCase()}. Pick the ones that matter most.`;
}

    <div class="racts">${pk === "add" ? `<button type="button" class="btn added" data-act="rec5-add" data-id="${h.id}" aria-pressed="true">${ico("check")}Added</button>` : `<button type="button" class="btn" data-act="rec5-add" data-id="${h.id}" aria-pressed="false">Add this habit</button>`}

/* ---------- actions ---------- */
function addPick(o, id, force) {
  const cap = HM.timeCap(o.prefs.time); const h = H(id);
  const now = chosen(o).reduce((m, x) => m + (x.h.d.mins || 0), 0); const after = now + (h.d.mins || 0);
  if (!force && cap != null && after > cap) {
    const others = chosen(o);
    return sheet("That goes past your time", `<p>With this one, your habits would take about <b>${after} minutes</b> on a day when they&rsquo;re all scheduled. You said ${esc(tLabel(o.prefs.time).toLowerCase())}.</p>
      ${others.length ? `<p class="fine">You could swap it for one you&rsquo;ve added:</p>${others.map(x => `<button type="button" class="vrow wide" data-act="rec5-swap" data-id="${id}" data-out="${x.h.id}"><span>Swap for ${esc(x.h.t)}<small>${esc(minsShort(x.h.d.mins))}</small></span>${ico("chev", "chev")}</button>`).join("")}` : ""}
      <button type="button" class="btn" data-act="rec5-force" data-id="${id}">Add it anyway</button><button type="button" class="btn ghost-btn" data-act="sheet-close">Keep my time</button>`);
  }
  o.pick[id] = "add"; closeSheet(true);
  const i = o.set.findIndex(x => x.h.id === id); if (i === o.ri && o.ri < o.set.length - 1) setTimeout(() => { if (nav.cur.r === "recset") { o.ri = i + 1; re(); } }, 380);
  re();
}
function startPlan(o) {
  const picks = chosen(o);
  for (const x of picks) {
    const h = x.h; const s = HM.suggestSchedule(h, { time: o.prefs.time });
    const days = DAYS5.find(d => d[0] === (o.dsched[h.id] || defaultDays(h)))[2];
    const r = remOf51(o, h.id, s.cue);
    HM.addPlan(st, h.id, null, { days, cue: s.cue, mins: s.mins, start: st.today, reminder: r.on, remTime: r.time });
  }
  const gs = onbGoals(o);
  Object.assign(st.profile, { onboarded: true, goal: gs[0] || null, goals: gs.slice(), overall: o.overall, refine: gs[0] ? o.refines[gs[0]] || null : null, refines: { ...o.refines },
    prefs: { ...st.profile.prefs, time: o.prefs.time ?? null, effort: o.prefs.effort, ability: o.prefs.ability || st.profile.prefs.ability, equipment: "none" } });
  st.ui.v5onb = { at: st.today, added: picks.map(x => x.h.id), later: (o.set || []).filter(x => o.pick[x.h.id] === "later").map(x => x.h.id) };
  F.onb = null; nav.stack = []; nav.cur = { r: "today", p: {} }; render();
  toast(picks.length > 1 ? `${picks.length} habits added. Here's your first.` : "Added. Here's your day.");
}
const A5onb = {
  "start": () => { F.onb = null; go("goals"); },
  "restart-onb": () => { F.onb = null; go("goals"); },
  "g5-pick": el => { const o = F.onb; const g = el.dataset.g; o.overall = false; const i = o.goals.indexOf(g); i >= 0 ? o.goals.splice(i, 1) : o.goals.push(g); o.set = null; re(); },
  "goal-overall": () => { const o = F.onb; o.overall = true; o.set = null; go("time"); },
  "g5-next": () => { const o = F.onb; o.overall = false; o.gi = 0; o.set = null; go("interest"); },
  "int5-pick": el => { const o = F.onb; const g = onbGoals(o)[o.gi]; o.refines[g] = el.dataset.v; o.set = null; re(); setTimeout(() => { if (nav.cur.r === "interest") nextInterest(); }, 260); },
  "int5-skip": () => { const o = F.onb; delete o.refines[onbGoals(o)[o.gi]]; o.set = null; nextInterest(); },
  "time5-pick": el => { const v = el.dataset.v === "null" ? null : el.dataset.v; F.onb.prefs.time = v; F.onb.set = null; re(); setTimeout(() => { if (nav.cur.r === "time") go("effort"); }, 260); },
  "eff5-pick": el => { const v = el.dataset.v; const p = F.onb.prefs; if (v === "seated") { p.ability = "seated"; p.effort = null; } else { p.ability = null; p.effort = v; } F.onb.set = null; re(); setTimeout(() => { if (nav.cur.r === "effort") go("recset"); }, 260); },
  "eff5-skip": () => { F.onb.prefs.ability = null; F.onb.prefs.effort = null; F.onb.set = null; go("recset"); },
  "rec5-add": el => { const o = F.onb; const id = el.dataset.id; if (o.pick[id] === "add") { delete o.pick[id]; re(); } else addPick(o, id, false); },
  "rec5-force": el => addPick(F.onb, el.dataset.id, true),

  "rec5-later": el => { const o = F.onb; const id = el.dataset.id; o.pick[id] = o.pick[id] === "later" ? undefined : "later"; const i = o.set.findIndex(x => x.h.id === id); if (o.pick[id] === "later" && i < o.set.length - 1) o.ri = i + 1; re(); },
  "rec5-more-time": () => { const o = F.onb; const ks = TIME5.map(t => t[0]); const i = ks.indexOf(o.prefs.time); o.prefs.time = ks[Math.min(ks.length - 1, i + 1)]; o.set = null; re(); },
  "rec5-any-effort": () => { F.onb.prefs.effort = null; F.onb.prefs.ability = null; F.onb.set = null; re(); },
  "ch5-days": el => { F.onb.dsched[el.dataset.id] = el.dataset.v; re(); },
  "ch5-remove": el => { F.onb.pick[el.dataset.id] = "later"; re(); },
  "ch5-add": el => addPick(F.onb, el.dataset.id, false),

/* Humanology V5 — Progress (inside You): the week in circles, each habit's history, private reflections, and the
   "Your health" placeholder with sample data and every connection state. Proposed placement for design review.
   Counting rule: progress is measured against the occurrences that were scheduled on each date. Occurrences are
   created from the schedule in effect at the time and kept, so changing a schedule never rewrites the past. */
"use strict";

/* ---------- check-in records: date, local timezone, edits; a retry never counts twice ---------- */
const completeV4 = HM.complete, undoV4 = HM.undoComplete;
HM.complete = (s, oid) => {
  const o = completeV4(s, oid); if (!o) return null;     // already done: the model ignores the repeat, so it is counted once
  o.tz = s.settings.tz; o.localDate = o.date;
  if (o.date < s.today) { o.late = true; o.edits = (o.edits || []).concat({ at: s.today, tz: s.settings.tz, change: "marked done later" }); }
  return o;
};

    const hgt = (r.value - mn) / (mx - mn) * (Hh - 34); return `<rect x="${(x + bw * 0.15).toFixed(1)}" y="${(Hh - 20 - hgt).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${hgt.toFixed(1)}" rx="2" class="bar"/>`; }).join("");

    <div class="pad"><div class="seg2 wide" role="radiogroup" aria-label="Range"><button type="button" role="radio" aria-checked="${view === "week"}" class="${view === "week" ? "on" : ""}" data-act="hview" data-v="week">Week</button><button type="button" role="radio" aria-checked="${view === "month"}" class="${view === "month" ? "on" : ""}" data-act="hview" data-v="month">Month</button></div>
    <div class="card2"><svg class="hchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(M.label)}, last ${n} days. ${have.length} readings, ${n - have.length} missing.${avg != null ? ` Average ${M.fmt(avg)}.` : ""}">${bars}${yl}${xl}</svg>
    <p class="fine">${avg != null ? `Average ${esc(M.fmt(avg))} over ${plural(have.length, m === "sleep" ? "night" : "day")} with readings.` : "No readings in this range."} ${n - have.length ? `${n - have.length} missing, shown as gaps.` : ""}</p></div>

    const p4 = HM.addPlan(s, "caffeine", null, { days: [0, 1, 2, 3, 4, 5, 6], cue: "After lunch", mins: 0, start: "2026-10-27" });
    HM.genOcc(s, "2026-10-27");
    let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (const o of HM.occList(s).filter(o => o.pid === p4.pid && o.date < s.today && o.status === "due")) {
      if (n === "missed" && o.date > "2026-11-19") continue;

/* Humanology V5 — connections between habits and outcomes.
   The point of Humanology: try a habit, watch what changes alongside it, keep what seems to help, try the next one
   if nothing changes. Each habit is linked to the outcomes its evidence is about (sleep habits → sleep, heart
   habits → blood pressure and resting heart rate, mood habits → mood and stress…). We show two plain comparisons:
     1. days you did the habit vs scheduled days you didn't, and
     2. before you started (or your first three weeks) vs the last three weeks.
   Always framed as observations, never as proof. Sample data in the prototype is labeled. */

/* ================= Humanology 5.2 — canonical catalog, adapter, selector =================
   One structured catalog (release 2026-11-26.4, embedded at build time as #catalog52) feeds every screen.
   The 5.1 renderers read an HM.CAT shape, so buildCat52() derives that shape from the catalog by ID. Nothing
   here is a second hand-written copy: titles, actions, benefits, sources and schedules are all looked up by ID. */
"use strict";
const C52 = (() => {
  const raw = JSON.parse(document.getElementById("catalog52").textContent);
  const card = {}, ben = {}, vari = {}, src = {};
  raw.cards.forEach(c => card[c.card_id] = c);
  raw.benefits.forEach(b => ben[b.benefit_id] = b);
  raw.variants.forEach(v => vari[v.variant_id] = v);
  raw.research_sources.forEach(s => src[s.source_id] = s);
  const variantsOf = id => raw.variants.filter(v => v.card_id === id);
  return { raw, card, ben, vari, src, variantsOf, release: "2026-11-26.4" };
})();
const ART52 = JSON.parse(document.getElementById("art52").textContent);
const LEGACY51 = JSON.parse(document.getElementById("legacy51").textContent);

/* ---------- the supplied selector, verbatim from catalog/recommend.mjs (parity is tested in tests/parity.mjs) ---------- */
/*RECOMMEND52-START*/
function recommend52(catalog, options = {}) {
  const goals = new Set(options.goals ?? []);
  const audience = new Set(options.audience ?? []);
  const blocked = new Set(options.blocked ?? []);
  const eligible = new Set(options.eligibleCards ?? []);
  const cleared = new Set(options.clearedCards ?? []);
  const omit = new Set([...(options.dismissed ?? []), ...(options.activeCards ?? [])]);
  const byId = new Map(catalog.benefits.map(benefit => [benefit.benefit_id, benefit]));
  const results = [];
  for (const card of catalog.cards) {
    const id = card.card_id;
    if (omit.has(id) || card.blocked_if.some(key => blocked.has(key))) continue;
    if ((card.blocked_if.length || card.eligibility_rule !== 'read_studied_population')
        && !eligible.has(id)) continue;
    if (card.eligibility_rule === 'clinician_clearance' && !cleared.has(id)) continue;
    const variants = catalog.variants.filter(v => v.card_id === id);
    const selected = options.selectedVariants?.[id];
    const allowed = variants.filter(v => (!selected || selected === v.variant_id)
      && (!v.audience_filter || audience.has(v.audience_filter)));
    if (variants.length && !allowed.length) continue;
    const variantBenefits = new Set(allowed.flatMap(v => v.benefit_ids));
    const possible = card.benefit_ids.map(key => byId.get(key))
      .filter(b => (!b.audience_filter || audience.has(b.audience_filter))
        && (!variants.length || variantBenefits.has(b.benefit_id)));
    const matched = possible.filter(b => b.goals.some(g => goals.has(g)));
    if (!matched.length) continue;
    const matchedGoals = [...new Set(matched.flatMap(b => b.goals.filter(g => goals.has(g))))];
    // Summaries for a variant-specific intervention are attached to that variant only.
    const visibleVariants = allowed.map(v => ({
      ...v, benefits: possible.filter(b => v.benefit_ids.includes(b.benefit_id))
    }));
    results.push({
      card, matchedGoals,
      benefits: possible.filter(b => b.display_scope !== 'variant' && b.display_scope !== 'research_only'),
      variants: visibleVariants,

function refineHit52(goal, refine, b) { const r = refine && HM.REFINE[goal]?.find(x => x[0] === refine); return r && r[0] !== "general" && r[2].test(b.statement) ? 1 : 0; }
recSet = function (o) {
  const gs = onbGoals(o).length ? onbGoals(o) : HM.CAT.meta.goals.map(g => g.id); const p = o.prefs; const cap = HM.timeCap(p.time);
  const res = recommend52(C52.raw, recOpts52({ goals: gs }));
  const fits = r => { const id = r.card.card_id, ef = EFFORT52[id] || null;
    if (p.ability === "seated" && MOVES52.has(id)) return false;
    if (p.effort === "gentle" && ef && ef >= 4) return false;
    return true; };
  const score = r => { const id = r.card.card_id; const bs = r.benefits.concat(r.variants.flatMap(v => v.benefits)); let s = r.matchedGoals.length * 10 + Math.max(0, ...bs.map(evRank52)) * 2;
    for (const g of r.matchedGoals) s += 3 * Math.max(0, ...bs.filter(b => b.goals.includes(g)).map(b => refineHit52(g, o.refines[g], b)));
    if (p.effort === "more" && MOVES52.has(id)) s += 4; if (p.effort === "some" && EFFORT52[id] === 2) s += 2; if (p.effort === "gentle" && EFFORT52[id] === 1) s += 2;
    if (cap != null && MINS52[id] != null && MINS52[id] <= cap) s += 1; return s; };
  const pool = res.filter(fits).map(r => ({ r, s: score(r) })).sort((a, b) => b.s - a.s || a.r.card.card_id.localeCompare(b.r.card.card_id));
  const target = onbGoals(o).length > 3 ? Math.min(5, onbGoals(o).length) : 3;
  const out = []; let used = 0;
  const take = x => { const id = x.r.card.card_id; const m = MINS52[id]; const over = cap != null && m != null && used + m > cap; if (m != null) used += m;
    out.push({ h: H(id), f: null, g: x.r.matchedGoals[0], over, rec: x.r, mg: x.r.matchedGoals }); };
  /* prefer routines that fit the time left (or have no stated time); if nothing fits, show the best one and say so */
  const free = x => !out.some(y => y.h.id === x.r.card.card_id);
  const fitsLeft = x => cap == null || MINS52[x.r.card.card_id] == null || used + MINS52[x.r.card.card_id] <= cap;
  for (const g of onbGoals(o)) { if (out.length >= target) break; const cand = pool.filter(x => free(x) && x.r.matchedGoals.includes(g)); const x = cand.find(fitsLeft) || cand[0]; if (x) take(x); }

};
